apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: jellyfin
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: jellyfin
    helm.sh/chart: app-template-5.1.0
  name: jellyfin
  namespace: jellyfin
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/instance: jellyfin
      app.kubernetes.io/name: jellyfin
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        checksum/configMaps: c8fab0b4fdaf653b9d85c5fab3d071da238ec2c6068ea4d10a2305aea1bb6e97
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: jellyfin
        app.kubernetes.io/name: jellyfin
    spec:
      automountServiceAccountToken: false
      containers:
        - env:
            - name: JELLYFIN_PublishedServerUrl
              value: https://jellyfin.plus2.danielvicory.dev
          image: jellyfin/jellyfin:10.11.11@sha256:aefb67e6a7ff1debdd154a78a7bbb780fd0c873d8639210a7f6a2016ad2b35db
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /health
              port: 8096
            periodSeconds: 30
            timeoutSeconds: 5
          name: main
          readinessProbe:
            httpGet:
              path: /health
              port: 8096
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              cpu: "2"
              ephemeral-storage: 1Gi
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /health
              port: 8096
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - mountPath: /cache
              name: cache
            - mountPath: /config
              name: config
            - mountPath: /media
              mountPropagation: HostToContainer
              name: media
              readOnly: true
            - mountPath: /network
              name: network
              readOnly: true
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      initContainers:
        - command:
            - /bin/sh
            - -ec
            - |
              found=0
              while IFS= read -r line; do
                case "$line" in *" /media "*) found=1 ;; esac
              done < /proc/self/mountinfo
              test "$found" = 1
              test -d /media && test -r /media
              mkdir -p /config/config
              cp /network/network.xml /config/config/network.xml.new
              mv /config/config/network.xml.new /config/config/network.xml
          image: jellyfin/jellyfin:10.11.11@sha256:aefb67e6a7ff1debdd154a78a7bbb780fd0c873d8639210a7f6a2016ad2b35db
          imagePullPolicy: IfNotPresent
          name: prepare
          resources:
            limits:
              cpu: 100m
              ephemeral-storage: 64Mi
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /cache
              name: cache
            - mountPath: /config
              name: config
            - mountPath: /media
              mountPropagation: HostToContainer
              name: media
              readOnly: true
            - mountPath: /network
              name: network
              readOnly: true
      nodeSelector:
        kubernetes.io/hostname: compute-1
      securityContext:
        runAsGroup: 751
        runAsNonRoot: true
        runAsUser: 751
        supplementalGroups:
          - 505
      serviceAccountName: jellyfin
      volumes:
        - emptyDir:
            sizeLimit: 4Gi
          name: cache
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - hostPath:
            path: /srv/media/library
            type: Directory
          name: media
        - configMap:
            name: jellyfin
          name: network
