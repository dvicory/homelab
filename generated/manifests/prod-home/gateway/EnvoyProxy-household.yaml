apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: household
  namespace: gateway
spec:
  logging:
    level:
      default: warn
      oauth2: critical
  provider:
    kubernetes:
      envoyDeployment:
        container:
          image: docker.io/envoyproxy/envoy:distroless-v1.39.6@sha256:1cac8b3a2f72d5a0918f54d7b49e68aae0b0ba325c2d50c8a9a3fff7a4d1f994
        pod:
          nodeSelector:
            kubernetes.io/hostname: compute-1
        replicas: 1
      envoyService:
        externalTrafficPolicy: Local
        name: household-origin
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - name: https
                  nodePort: 30443
                  port: 443
        type: NodePort
    type: Kubernetes
  telemetry:
    accessLog:
      settings:
        - format:
            json:
              client: '%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%'
              duration_ms: '%DURATION%'
              host: '%REQ(:AUTHORITY)%'
              method: '%REQ(:METHOD)%'
              path: '%PATH(NQ)%'
              request_id: '%REQ(X-REQUEST-ID)%'
              response_flags: '%RESPONSE_FLAGS%'
              status: '%RESPONSE_CODE%'
              timestamp: '%START_TIME%'
              upstream: '%UPSTREAM_HOST%'
            type: JSON
          sinks:
            - file:
                path: /dev/stdout
              type: File
