apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: idm
  namespace: gateway
spec:
  hostnames:
    - idm.plus2.danielvicory.dev
    - idm.backup.plus2.danielvicory.dev
  parentRefs:
    - name: household
  rules:
    - backendRefs:
        - name: kanidm
          namespace: identity
          port: 443
      filters:
        - requestHeaderModifier:
            remove:
              - X-Forwarded-User
              - X-Forwarded-Email
              - X-Auth-Request-User
              - X-Auth-Request-Email
              - Remote-User
              - Forwarded
          type: RequestHeaderModifier
      matches:
        - path:
            type: PathPrefix
            value: /
