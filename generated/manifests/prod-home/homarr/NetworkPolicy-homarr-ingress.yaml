apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: homarr-ingress
  namespace: portal
spec:
  ingress: []
  podSelector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/instance: homarr
      app.kubernetes.io/name: homarr
  policyTypes:
    - Ingress
