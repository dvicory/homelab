apiVersion: batch/v1
kind: CronJob
metadata:
  name: media-config-roots
  namespace: media
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      activeDeadlineSeconds: 900
      backoffLimit: 6
      template:
        metadata:
          labels:
            app.kubernetes.io/name: media-config-roots
        spec:
          automountServiceAccountToken: false
          containers:
            - command:
                - node
                - /configuration/roots.mjs
              image: docker.io/library/node:22.14.0-bookworm-slim@sha256:1c18d9ab3af4585870b92e4dbc5cac5a0dc77dd13df1a5905cea89fc720eb05b
              name: configure
              resources:
                limits:
                  cpu: 500m
                  memory: 256Mi
                requests:
                  cpu: 25m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
              volumeMounts:
                - mountPath: /configuration
                  name: configuration
                  readOnly: true
                - mountPath: /secrets
                  name: secrets
                  readOnly: true
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - configMap:
                name: media-configuration
              name: configuration
            - name: secrets
              projected:
                defaultMode: 288
                sources:
                  - secret:
                      items:
                        - key: RADARR_API_KEY
                          path: RADARR_API_KEY
                        - key: SONARR_API_KEY
                          path: SONARR_API_KEY
                      name: media-runtime
  schedule: 0 4 * * *
  successfulJobsHistoryLimit: 1
  suspend: true
