apiVersion: batch/v1
kind: CronJob
metadata:
  name: media-config-seerr
  namespace: media
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      activeDeadlineSeconds: 900
      backoffLimit: 6
      template:
        metadata:
          labels:
            app.kubernetes.io/name: media-config-seerr
        spec:
          automountServiceAccountToken: false
          containers:
            - command:
                - node
                - /configuration/seerr.mjs
              image: ghcr.io/seerr-team/seerr:v3.4.1@sha256:f4768de5f616248d723e05891f3345a1402123775d03bf0890dbfedc0831bda1
              name: configure
              resources:
                limits:
                  cpu: 500m
                  memory: 256Mi
                requests:
                  cpu: 25m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
              volumeMounts:
                - mountPath: /configuration
                  name: configuration
                  readOnly: true
                - mountPath: /secrets
                  name: secrets
                  readOnly: true
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - configMap:
                name: media-configuration
              name: configuration
            - name: secrets
              projected:
                defaultMode: 288
                sources:
                  - secret:
                      items:
                        - key: RADARR_API_KEY
                          path: RADARR_API_KEY
                        - key: SONARR_API_KEY
                          path: SONARR_API_KEY
                        - key: JELLYFIN_OWNER_USERNAME
                          path: JELLYFIN_OWNER_USERNAME
                        - key: JELLYFIN_OWNER_PASSWORD
                          path: JELLYFIN_OWNER_PASSWORD
                        - key: JELLYFIN_OWNER_EMAIL
                          path: JELLYFIN_OWNER_EMAIL
                      name: media-runtime
                  - secret:
                      items:
                        - key: SEERR_API_KEY
                          path: SEERR_API_KEY
                      name: media-runtime
                      optional: true
  schedule: 0 4 * * *
  successfulJobsHistoryLimit: 1
  suspend: true
