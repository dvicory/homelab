  config.yml: "# Configarr v1.32.0: Git URLs refer to locally seeded, detached policy inputs.\ntrashGuideUrl: \"file:///app/repos/trash-guides\"\ntrashRevision: HEAD\nrecyclarrConfigUrl: \"file:///app/repos/recyclarr-config\"\nrecyclarrRevision: HEAD\nlocalConfigTemplatesPath: \"/app/templates\"\ntelemetry: false\nsonarr:\n  \"sonarr\":\n    base_url: \"http://sonarr.media.svc:8989\"\n    api_key: !env SONARR_API_KEY\n    quality_definition:\n      type: series\n    include:\n      - template: \"media-sonarr-sonarr\"\n    custom_formats:\n      - trash_ids: [\"ec8fa7296b64e8cd390a1600981f3923\",\"eb3d5cc0a2be0db205fb823640db6a3c\",\"44e7c4de10ae50265753082e5dc76047\",\"d0c516558625b04b363fa6c5c2c7cfd4\",\"e6258996055b9fbab7e9cb2f75819294\",\"58790d4e2fdcd9733aa7ae68ba2bb503\",\"d84935abd3f8556dcd51d4f27e22d0a6\"]\n        assign_scores_to:\n          - name: \"WEB-1080p\"\n            use_default_score: true\n    root_folders:\n      - \"/data/library/tv\"\n    download_clients:\n      update_password: true\n      data:\n        - name: \"SABnzbd (Homelab)\"\n          type: \"Sabnzbd\"\n          enable: true\n          priority: 1\n          remove_completed_downloads: true\n          remove_failed_downloads: true\n          fields:\n            host: \"sabnzbd.media.svc\"\n            port: 8080\n            use_ssl: false\n            url_base: \"\"\n            api_key: !env SABNZBD_API_KEY\n            username: !env SABNZBD_USERNAME\n            password: !env SABNZBD_PASSWORD\n            tv_category: \"tv\"\n  \nradarr:\n  \"radarr\":\n    base_url: \"http://radarr.media.svc:7878\"\n    api_key: !env RADARR_API_KEY\n    quality_definition:\n      type: movie\n    include:\n      - template: \"media-radarr-radarr\"\n    custom_formats:\n      - trash_ids: [\"e7718d7a3ce595f289bfee26adc178f5\",\"ae43b294509409a6a13919dedd4764c4\",\"5caaaa1c08c1742aa4342d8c4cc463f2\",\"c20f169ef63c5f40c2def54abaf4438e\",\"403816d65392c79236dcb6dd591aeda4\",\"af94e0fe497124d1f9