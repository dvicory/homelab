apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
  name: media-configarr
  namespace: media
spec:
  activeDeadlineSeconds: 900
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: media-configarr
    spec:
      automountServiceAccountToken: false
      containers:
        - command:
            - /bin/sh
            - -ec
            - |
              exec 9>/coordination/configarr.lock
              flock -x 9
              output="$(dumb-init node index.js 2>&1)" || {
                printf '%s\n' "$output"
                exit 1
              }
              printf '%s\n' "$output"
              case "$output" in
                *"ERROR "*|*"change(s) failed"*) exit 1 ;;
              esac
          env:
            - name: ROOT_PATH
              value: /app
            - name: CONFIG_LOCATION
              value: /app/config/config.yml
            - name: CUSTOM_REPO_ROOT
              value: /coordination/configarr-repos/04e692c8926f6b9736943afcd9b505bad29f5e54-4ae377bb704fc7fd69a544ad04e91357e0b09f62
            - name: STOP_ON_ERROR
              value: "true"
            - name: LOG_LEVEL
              value: warn
            - name: CONFIGARR_ENFORCE_CONFIG_VALIDATION
              value: "true"
            - name: CONFIGARR_ENFORCE_EXTERNAL_VALIDATION
              value: "true"
            - name: RADARR_API_KEY
              valueFrom:
                secretKeyRef:
                  key: RADARR_API_KEY
                  name: media-runtime
            - name: SONARR_API_KEY
              valueFrom:
                secretKeyRef:
                  key: SONARR_API_KEY
                  name: media-runtime
            - name: SABNZBD_API_KEY
              valueFrom:
                secretKeyRef:
                  key: SABNZBD_API_KEY
                  name: media-runtime
            - name: PROWLARR_API_KEY
              valueFrom:
                secretKeyRef:
                  key: PROWLARR_API_KEY
                  name: media-runtime
          image: docker.io/configarr/configarr:1.32.0@sha256:8a94c8355f86619ac4c52298144f15859f9c66311515f96c4688435fa020039e
          name: configarr
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 25m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /app/config
              name: configuration
              readOnly: true
            - mountPath: /coordination
              name: coordination
      initContainers:
        - command:
            - node
            - -e
            - |
              const targets = JSON.parse(process.env.READY_TARGETS);
              const deadline = Date.now() + 600000;
              async function ready(target) {
                while (true) {
                  try {
                    const response = await fetch(target.url, {
                      headers: { 'X-Api-Key': process.env[target.key] },
                      signal: AbortSignal.timeout(10000),
                    });
                    if (response.ok) return;
                  } catch {}
                  if (Date.now() + 5000 >= deadline) throw new Error('Media API readiness timed out: ' + target.url);
                  await new Promise(resolve => setTimeout(resolve, 5000));
                }
              }
              Promise.all(targets.map(ready)).catch(error => { console.error(error); process.exitCode = 1; });
          env:
            - name: READY_TARGETS
              value: '[{"key":"RADARR_API_KEY","url":"http://radarr.media.svc:7878/api/v3/system/status"},{"key":"SONARR_API_KEY","url":"http://sonarr.media.svc:8989/api/v3/system/status"},{"key":"PROWLARR_API_KEY","url":"http://prowlarr.media.svc:9696/api/v1/system/status"}]'
            - name: RADARR_API_KEY
              valueFrom:
                secretKeyRef:
                  key: RADARR_API_KEY
                  name: media-runtime
            - name: SONARR_API_KEY
              valueFrom:
                secretKeyRef:
                  key: SONARR_API_KEY
                  name: media-runtime
            - name: PROWLARR_API_KEY
              valueFrom:
                secretKeyRef:
                  key: PROWLARR_API_KEY
                  name: media-runtime
          image: docker.io/library/node:22.14.0-bookworm-slim@sha256:1c18d9ab3af4585870b92e4dbc5cac5a0dc77dd13df1a5905cea89fc720eb05b
          name: wait-for-apis
          resources:
            limits:
              cpu: 250m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      restartPolicy: OnFailure
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: coordination
          persistentVolumeClaim:
            claimName: media-seerr-configuration
        - configMap:
            items:
              - key: config.yml
                path: config.yml
            name: media-configuration
          name: configuration
