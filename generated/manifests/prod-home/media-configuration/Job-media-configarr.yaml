apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
  name: media-configarr
  namespace: media
spec:
  activeDeadlineSeconds: 900
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: media-configarr
    spec:
      automountServiceAccountToken: false
      containers:
        - command:
            - /bin/sh
            - -ec
            - |
              exec 9>/coordination/configarr.lock
              flock -x 9
              output="$(dumb-init node index.js 2>&1)" || {
                printf '%s\n' "$output"
                exit 1
              }
              printf '%s\n' "$output"
              case "$output" in
                *"ERROR "*|*"change(s) failed"*) exit 1 ;;
              esac
          env:
            - name: ROOT_PATH
              value: /app
            - name: CONFIG_LOCATION
              value: /app/config/config.yml
            - name: CUSTOM_REPO_ROOT
              value: /app/repos
            - name: STOP_ON_ERROR
              value: "true"
            - name: LOG_LEVEL
              value: warn
            - name: CONFIGARR_ENFORCE_CONFIG_VALIDATION
              value: "true"
            - name: CONFIGARR_ENFORCE_EXTERNAL_VALIDATION
              value: "true"
            - name: RADARR_API_KEY
              valueFrom:
                secretKeyRef:
                  key: RADARR_API_KEY
                  name: media-runtime
            - name: SONARR_API_KEY
              valueFrom:
                secretKeyRef:
                  key: SONARR_API_KEY
                  name: media-runtime
            - name: SABNZBD_API_KEY
              valueFrom:
                secretKeyRef:
                  key: SABNZBD_API_KEY
                  name: media-runtime
            - name: PROWLARR_API_KEY
              valueFrom:
                secretKeyRef:
                  key: PROWLARR_API_KEY
                  name: media-runtime
          image: docker.io/configarr/configarr:1.32.0@sha256:8a94c8355f86619ac4c52298144f15859f9c66311515f96c4688435fa020039e
          name: configarr
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 25m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /app/config
              name: configuration
              readOnly: true
            - mountPath: /app/templates
              name: templates
              readOnly: true
            - mountPath: /app/repos
              name: repos
            - mountPath: /coordination
              name: coordination
      initContainers:
        - command:
            - node
            - -e
            - |
              const targets = JSON.parse(process.env.READY_TARGETS);
              const deadline = Date.now() + 600000;
              async function ready(target) {
                while (true) {
                  try {
                    const response = await fetch(target.url, {
                      headers: { 'X-Api-Key': process.env[target.key] },
                      signal: AbortSignal.timeout(10000),
                    });
                    if (response.ok) return;
                  } catch {}
                  if (Date.now() + 5000 >= deadline) throw new Error('Media API readiness timed out: ' + target.url);
                  await new Promise(resolve => setTimeout(resolve, 5000));
                }
              }
              Promise.all(targets.map(ready)).catch(error => { console.error(error); process.exitCode = 1; });
          env:
            - name: READY_TARGETS
              value: '[{"key":"RADARR_API_KEY","url":"http://radarr.media.svc:7878/api/v3/system/status"},{"key":"SONARR_API_KEY","url":"http://sonarr.media.svc:8989/api/v3/system/status"},{"key":"PROWLARR_API_KEY","url":"http://prowlarr.media.svc:9696/api/v1/system/status"}]'
            - name: RADARR_API_KEY
              valueFrom:
                secretKeyRef:
                  key: RADARR_API_KEY
                  name: media-runtime
            - name: SONARR_API_KEY
              valueFrom:
                secretKeyRef:
                  key: SONARR_API_KEY
                  name: media-runtime
            - name: PROWLARR_API_KEY
              valueFrom:
                secretKeyRef:
                  key: PROWLARR_API_KEY
                  name: media-runtime
          image: docker.io/library/node:22.14.0-bookworm-slim@sha256:1c18d9ab3af4585870b92e4dbc5cac5a0dc77dd13df1a5905cea89fc720eb05b
          name: wait-for-apis
          resources:
            limits:
              cpu: 250m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
        - command:
            - /bin/sh
            - -ec
            - |
              set -eu
              for repo in trash-guides recyclarr-config; do
                root="/app/repos/$repo"
                rm -rf "$root"
                mkdir -p "$root"
              done
              trash="/app/repos/trash-guides/docs/json"
              for app in radarr sonarr; do
                for directory in cf cf-groups naming quality-profiles quality-size; do
                  mkdir -p "$trash/$app/$directory"
                done
                for directory in custom-formats quality-definitions quality-profiles; do
                  mkdir -p "/app/repos/recyclarr-config/$app/includes/$directory"
                done
              done
              cp /seed/radarr-movie.json "$trash/radarr/quality-size/movie.json"
              cp /seed/sonarr-series.json "$trash/sonarr/quality-size/series.json"
              cp /seed/sonarr-anime.json "$trash/sonarr/quality-size/anime.json"
              cp /seed/conflicts.json "$trash/radarr/conflicts.json"
              cp /seed/conflicts.json "$trash/sonarr/conflicts.json"
              cp /seed/radarr-cf-3d.json /app/repos/trash-guides/docs/json/radarr/cf/3d.json
              cp /seed/radarr-cf-amzn.json /app/repos/trash-guides/docs/json/radarr/cf/amzn.json
              cp /seed/radarr-cf-atv.json /app/repos/trash-guides/docs/json/radarr/cf/atv.json
              cp /seed/radarr-cf-atvp.json /app/repos/trash-guides/docs/json/radarr/cf/atvp.json
              cp /seed/radarr-cf-av1.json /app/repos/trash-guides/docs/json/radarr/cf/av1.json
              cp /seed/radarr-cf-bcore.json /app/repos/trash-guides/docs/json/radarr/cf/bcore.json
              cp /seed/radarr-cf-br-disk.json /app/repos/trash-guides/docs/json/radarr/cf/br-disk.json
              cp /seed/radarr-cf-crit.json /app/repos/trash-guides/docs/json/radarr/cf/crit.json
              cp /seed/radarr-cf-dsnp.json /app/repos/trash-guides/docs/json/radarr/cf/dsnp.json
              cp /seed/radarr-cf-extras.json /app/repos/trash-guides/docs/json/radarr/cf/extras.json
              cp /seed/radarr-cf-generated-dynamic-hdr.json /app/repos/trash-guides/docs/json/radarr/cf/generated-dynamic-hdr.json
              cp /seed/radarr-cf-hbo.json /app/repos/trash-guides/docs/json/radarr/cf/hbo.json
              cp /seed/radarr-cf-hd-bluray-tier-01.json /app/repos/trash-guides/docs/json/radarr/cf/hd-bluray-tier-01.json
              cp /seed/radarr-cf-hd-bluray-tier-02.json /app/repos/trash-guides/docs/json/radarr/cf/hd-bluray-tier-02.json
              cp /seed/radarr-cf-hd-bluray-tier-03.json /app/repos/trash-guides/docs/json/radarr/cf/hd-bluray-tier-03.json
              cp /seed/radarr-cf-hmax.json /app/repos/trash-guides/docs/json/radarr/cf/hmax.json
              cp /seed/radarr-cf-hulu.json /app/repos/trash-guides/docs/json/radarr/cf/hulu.json
              cp /seed/radarr-cf-it.json /app/repos/trash-guides/docs/json/radarr/cf/it.json
              cp /seed/radarr-cf-lq-release-title.json /app/repos/trash-guides/docs/json/radarr/cf/lq-release-title.json
              cp /seed/radarr-cf-lq.json /app/repos/trash-guides/docs/json/radarr/cf/lq.json
              cp /seed/radarr-cf-ma.json /app/repos/trash-guides/docs/json/radarr/cf/ma.json
              cp /seed/radarr-cf-max.json /app/repos/trash-guides/docs/json/radarr/cf/max.json
              cp /seed/radarr-cf-nf.json /app/repos/trash-guides/docs/json/radarr/cf/nf.json
              cp /seed/radarr-cf-pcok.json /app/repos/trash-guides/docs/json/radarr/cf/pcok.json
              cp /seed/radarr-cf-play.json /app/repos/trash-guides/docs/json/radarr/cf/play.json
              cp /seed/radarr-cf-pmtp.json /app/repos/trash-guides/docs/json/radarr/cf/pmtp.json
              cp /seed/radarr-cf-remux-tier-01.json /app/repos/trash-guides/docs/json/radarr/cf/remux-tier-01.json
              cp /seed/radarr-cf-remux-tier-02.json /app/repos/trash-guides/docs/json/radarr/cf/remux-tier-02.json
              cp /seed/radarr-cf-remux-tier-03.json /app/repos/trash-guides/docs/json/radarr/cf/remux-tier-03.json
              cp /seed/radarr-cf-repack-proper.json /app/repos/trash-guides/docs/json/radarr/cf/repack-proper.json
              cp /seed/radarr-cf-repack2.json /app/repos/trash-guides/docs/json/radarr/cf/repack2.json
              cp /seed/radarr-cf-repack3.json /app/repos/trash-guides/docs/json/radarr/cf/repack3.json
              cp /seed/radarr-cf-roku.json /app/repos/trash-guides/docs/json/radarr/cf/roku.json
              cp /seed/radarr-cf-sing-along-versions.json /app/repos/trash-guides/docs/json/radarr/cf/sing-along-versions.json
              cp /seed/radarr-cf-stan.json /app/repos/trash-guides/docs/json/radarr/cf/stan.json
              cp /seed/radarr-cf-web-tier-01.json /app/repos/trash-guides/docs/json/radarr/cf/web-tier-01.json
              cp /seed/radarr-cf-web-tier-02.json /app/repos/trash-guides/docs/json/radarr/cf/web-tier-02.json
              cp /seed/radarr-cf-web-tier-03.json /app/repos/trash-guides/docs/json/radarr/cf/web-tier-03.json
              cp /seed/radarr-cf-x265-hd.json /app/repos/trash-guides/docs/json/radarr/cf/x265-hd.json
              cp /seed/sonarr-cf-amzn.json /app/repos/trash-guides/docs/json/sonarr/cf/amzn.json
              cp /seed/sonarr-cf-atvp.json /app/repos/trash-guides/docs/json/sonarr/cf/atvp.json
              cp /seed/sonarr-cf-av1.json /app/repos/trash-guides/docs/json/sonarr/cf/av1.json
              cp /seed/sonarr-cf-br-disk.json /app/repos/trash-guides/docs/json/sonarr/cf/br-disk.json
              cp /seed/sonarr-cf-cc.json /app/repos/trash-guides/docs/json/sonarr/cf/cc.json
              cp /seed/sonarr-cf-dcu.json /app/repos/trash-guides/docs/json/sonarr/cf/dcu.json
              cp /seed/sonarr-cf-dsnp.json /app/repos/trash-guides/docs/json/sonarr/cf/dsnp.json
              cp /seed/sonarr-cf-extras.json /app/repos/trash-guides/docs/json/sonarr/cf/extras.json
              cp /seed/sonarr-cf-hbo.json /app/repos/trash-guides/docs/json/sonarr/cf/hbo.json
              cp /seed/sonarr-cf-hd-streaming-boost.json /app/repos/trash-guides/docs/json/sonarr/cf/hd-streaming-boost.json
              cp /seed/sonarr-cf-hmax.json /app/repos/trash-guides/docs/json/sonarr/cf/hmax.json
              cp /seed/sonarr-cf-hulu.json /app/repos/trash-guides/docs/json/sonarr/cf/hulu.json
              cp /seed/sonarr-cf-it.json /app/repos/trash-guides/docs/json/sonarr/cf/it.json
              cp /seed/sonarr-cf-lq-release-title.json /app/repos/trash-guides/docs/json/sonarr/cf/lq-release-title.json
              cp /seed/sonarr-cf-lq.json /app/repos/trash-guides/docs/json/sonarr/cf/lq.json
              cp /seed/sonarr-cf-max.json /app/repos/trash-guides/docs/json/sonarr/cf/max.json
              cp /seed/sonarr-cf-nf.json /app/repos/trash-guides/docs/json/sonarr/cf/nf.json
              cp /seed/sonarr-cf-pcok.json /app/repos/trash-guides/docs/json/sonarr/cf/pcok.json
              cp /seed/sonarr-cf-play.json /app/repos/trash-guides/docs/json/sonarr/cf/play.json
              cp /seed/sonarr-cf-pmtp.json /app/repos/trash-guides/docs/json/sonarr/cf/pmtp.json
              cp /seed/sonarr-cf-remux-tier-01.json /app/repos/trash-guides/docs/json/sonarr/cf/remux-tier-01.json
              cp /seed/sonarr-cf-remux-tier-02.json /app/repos/trash-guides/docs/json/sonarr/cf/remux-tier-02.json
              cp /seed/sonarr-cf-repack-proper.json /app/repos/trash-guides/docs/json/sonarr/cf/repack-proper.json
              cp /seed/sonarr-cf-repack2.json /app/repos/trash-guides/docs/json/sonarr/cf/repack2.json
              cp /seed/sonarr-cf-repack3.json /app/repos/trash-guides/docs/json/sonarr/cf/repack3.json
              cp /seed/sonarr-cf-sho.json /app/repos/trash-guides/docs/json/sonarr/cf/sho.json
              cp /seed/sonarr-cf-stan.json /app/repos/trash-guides/docs/json/sonarr/cf/stan.json
              cp /seed/sonarr-cf-syfy.json /app/repos/trash-guides/docs/json/sonarr/cf/syfy.json
              cp /seed/sonarr-cf-web-scene.json /app/repos/trash-guides/docs/json/sonarr/cf/web-scene.json
              cp /seed/sonarr-cf-web-tier-01.json /app/repos/trash-guides/docs/json/sonarr/cf/web-tier-01.json
              cp /seed/sonarr-cf-web-tier-02.json /app/repos/trash-guides/docs/json/sonarr/cf/web-tier-02.json
              cp /seed/sonarr-cf-web-tier-03.json /app/repos/trash-guides/docs/json/sonarr/cf/web-tier-03.json
              cp /seed/sonarr-cf-x265-hd.json /app/repos/trash-guides/docs/json/sonarr/cf/x265-hd.json
              printf '%s\n' '04e692c8926f6b9736943afcd9b505bad29f5e54' > /app/repos/trash-guides/TRASH-GUIDES-REVISION
              for repo in trash-guides recyclarr-config; do
                git -C "/app/repos/$repo" init -q
                git -C "/app/repos/$repo" config user.email "media-policy@localhost"
                git -C "/app/repos/$repo" config user.name "media-policy"
                git -C "/app/repos/$repo" add .
                git -C "/app/repos/$repo" commit --allow-empty -qm "Pinned offline media policy inputs"
                git -C "/app/repos/$repo" checkout --detach -q HEAD
              done
          image: docker.io/configarr/configarr:1.32.0@sha256:8a94c8355f86619ac4c52298144f15859f9c66311515f96c4688435fa020039e
          name: seed-policy
          resources:
            limits:
              cpu: 250m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /seed
              name: policy-inputs
              readOnly: true
            - mountPath: /app/repos
              name: repos
      restartPolicy: OnFailure
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: coordination
          persistentVolumeClaim:
            claimName: media-seerr-configuration
        - configMap:
            items:
              - key: config.yml
                path: config.yml
            name: media-configuration
          name: configuration
        - configMap:
            name: media-configarr-templates
          name: templates
        - configMap:
            name: media-configarr-inputs
          name: policy-inputs
        - emptyDir: {}
          name: repos
