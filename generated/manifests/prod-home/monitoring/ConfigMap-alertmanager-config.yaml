apiVersion: v1
data:
  alertmanager.yaml: '{"inhibit_rules":[{"equal":["alertname","namespace","pod","container","host","instance","job","mountpoint","pool","vdev","disk","certificate","name"],"source_matchers":["severity=\"critical\""],"target_matchers":["severity=\"warning\""]},{"equal":["host"],"source_matchers":["alertname=\"TelemetrySourceDown\"","job=\"host-node\""],"target_matchers":["alertname=~\"HostRequiredMountMissing|HostSystemdUnitFailed|HostZpoolStatusStale|HostSmartStatusStale|HostZpoolMissing|HostDiskTelemetryMissing\""]},{"equal":["host"],"source_matchers":["alertname=\"HostZpoolStatusStale\""],"target_matchers":["alertname=\"HostZpoolMissing\""]},{"equal":["host"],"source_matchers":["alertname=\"HostSmartStatusStale\""],"target_matchers":["alertname=\"HostDiskTelemetryMissing\""]},{"equal":["namespace","pod"],"source_matchers":["alertname=\"KubePodCrashLooping\""],"target_matchers":["alertname=~\"KubePodNotReady|KubeContainerRestarted\""]}],"receivers":[{"name":"heartbeat","webhook_configs":[{"max_alerts":1,"send_resolved":false,"url_file":"/etc/alertmanager/delivery/heartbeat-url"}]},{"name":"critical","pushover_configs":[{"message":"{{ template \"homelab.message\" . }}","priority":"1","send_resolved":true,"title":"{{ template \"homelab.title\" . }}","token_file":"/etc/alertmanager/delivery/pushover-token","url":"https://grafana.plus2.danielvicory.dev","url_title":"Grafana","user_key_file":"/etc/alertmanager/delivery/pushover-user-key"}],"telegram_configs":[{"bot_token_file":"/etc/alertmanager/delivery/telegram-bot-token","chat_id_file":"/etc/alertmanager/delivery/telegram-chat-id","message":"{{ template \"homelab.telegram\" . }}","parse_mode":"","send_resolved":true}]},{"name":"warning","pushover_configs":[{"message":"{{ template \"homelab.message\" . }}","priority":"0","send_resolved":true,"title":"{{ template \"homelab.title\" . }}","token_file":"/etc/alertmanager/delivery/pushover-token","url":"https://grafana.plus2.danielvicory.dev","url_title":"Grafana","user_key_file":"/etc/alertmanager/delivery/pushover-user-key"}],"telegram_configs":[{"bot_token_file":"/etc/alertmanager/delivery/telegram-bot-token","chat_id_file":"/etc/alertmanager/delivery/telegram-chat-id","message":"{{ template \"homelab.telegram\" . }}","parse_mode":"","send_resolved":true}]},{"name":"telegram-only","telegram_configs":[{"bot_token_file":"/etc/alertmanager/delivery/telegram-bot-token","chat_id_file":"/etc/alertmanager/delivery/telegram-chat-id","message":"{{ template \"homelab.telegram\" . }}","parse_mode":"","send_resolved":true}]},{"name":"pushover-only","pushover_configs":[{"message":"{{ template \"homelab.message\" . }}","priority":"1","send_resolved":true,"title":"{{ template \"homelab.title\" . }}","token_file":"/etc/alertmanager/delivery/pushover-token","url":"https://grafana.plus2.danielvicory.dev","url_title":"Grafana","user_key_file":"/etc/alertmanager/delivery/pushover-user-key"}]}],"route":{"group_by":["alertname","namespace","host","instance"],"group_interval":"2m","group_wait":"30s","receiver":"warning","repeat_interval":"24h","routes":[{"continue":false,"group_interval":"1m","group_wait":"0s","matchers":["alertname=\"Watchdog\""],"receiver":"heartbeat","repeat_interval":"5m"},{"matchers":["alertname=\"AlertDeliveryFailing\"","integration=\"pushover\""],"receiver":"telegram-only","repeat_interval":"4h"},{"matchers":["alertname=\"AlertDeliveryFailing\"","integration=\"telegram\""],"receiver":"pushover-only","repeat_interval":"4h"},{"matchers":["severity=\"critical\""],"receiver":"critical","repeat_interval":"4h"}]},"templates":["/etc/alertmanager/templates/*.tmpl"]}'
  homelab.tmpl: |
    {{ define "homelab.title" }}[{{ .Status | toUpper }}{{ if eq .Status "firing" }} {{ .CommonLabels.severity }}{{ end }}] {{ .CommonLabels.alertname }}{{ end }}
    {{ define "homelab.message" }}{{ range .Alerts }}{{ .Annotations.summary }}
    {{ end }}{{ end }}
    {{ define "homelab.telegram" }}{{ template "homelab.title" . }}
    {{ range .Alerts }}{{ .Annotations.summary }}
    {{ end }}https://grafana.plus2.danielvicory.dev{{ end }}
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
