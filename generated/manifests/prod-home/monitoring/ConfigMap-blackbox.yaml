apiVersion: v1
data:
  blackbox.yaml: |
    modules:
      http_2xx:
        http:
          follow_redirects: true
          preferred_ip_protocol: ip4
          valid_http_versions:
          - HTTP/1.1
          - HTTP/2.0
        prober: http
        timeout: 5s
      route-argocd:
        http:
          fail_if_header_not_matches:
          - allow_missing: false
            header: Location
            regexp: ^https://idm\.plus2\.danielvicory\.dev/
          fail_if_not_ssl: true
          follow_redirects: false
          headers:
            Host: argocd.plus2.danielvicory.dev
          method: GET
          preferred_ip_protocol: ip4
          tls_config:
            server_name: argocd.plus2.danielvicory.dev
          valid_status_codes:
          - 302
        prober: http
        timeout: 10s
      route-grafana:
        http:
          fail_if_header_not_matches:
          - allow_missing: false
            header: Location
            regexp: ^https://idm\.plus2\.danielvicory\.dev/
