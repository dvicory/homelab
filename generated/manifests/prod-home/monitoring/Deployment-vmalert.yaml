apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: vmalert
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: vmalert
    app.kubernetes.io/part-of: monitoring
    helm.sh/chart: app-template-5.1.0
  name: vmalert
  namespace: monitoring
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/instance: vmalert
      app.kubernetes.io/name: vmalert
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        homelab.danielvicory/config-sha256: 6b33128289fdd9ede9eb2992e7c60ed8c0c9fbd56cb7079338a1ce8be547ee73
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: vmalert
        app.kubernetes.io/name: vmalert
        app.kubernetes.io/part-of: monitoring
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - -datasource.url=http://victoriametrics.monitoring.svc:8428
            - -remoteWrite.url=http://victoriametrics.monitoring.svc:8428
            - -remoteRead.url=http://victoriametrics.monitoring.svc:8428
            - -notifier.url=http://alertmanager.monitoring.svc:9093
            - -rule=/etc/vmalert/rules.json
            - -evaluationInterval=30s
            - -httpListenAddr=:8880
            - -external.url=https://grafana.plus2.danielvicory.dev
          image: docker.io/victoriametrics/vmalert:v1.151.0@sha256:e519f14c31f4d68015702e684a0fc3f1b4e559aa985d8f4462768f07f55b05c9
          imagePullPolicy: IfNotPresent
          name: vmalert
          readinessProbe:
            httpGet:
              path: /health
              port: 8880
            periodSeconds: 10
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 25m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /etc/vmalert
              name: rules
              readOnly: true
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      nodeSelector:
        kubernetes.io/hostname: compute-1
      securityContext:
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: default
      volumes:
        - configMap:
            defaultMode: 420
            name: vmalert-rules
          name: rules
