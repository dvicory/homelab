apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app.kubernetes.io/instance: monitoring
    app.kubernetes.io/name: grafana
    app.kubernetes.io/version: 13.2.0
    helm.sh/chart: grafana-12.11.2
    release: monitoring
  name: monitoring-grafana
  namespace: monitoring
spec:
  endpoints:
    - honorLabels: true
      path: /metrics
      port: http-web
      scheme: http
  jobLabel: monitoring
  namespaceSelector:
    matchNames:
      - monitoring
  selector:
    matchLabels:
      app.kubernetes.io/instance: monitoring
      app.kubernetes.io/name: grafana
