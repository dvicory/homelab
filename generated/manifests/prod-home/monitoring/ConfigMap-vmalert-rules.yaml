apiVersion: v1
data:
  rules.json: '{"groups":[{"name":"dashboards","rules":[{"expr":"sum by (namespace, pod, container, node) (\n  rate(container_cpu_usage_seconds_total{job=\"cadvisor\", image!=\"\"}[5m])\n)\n","record":"node_namespace_pod_container:container_cpu_usage_seconds_total:sum_rate5m"},{"expr":"kube_pod_container_resource_requests{job=\"kube-state-metrics\", resource=\"cpu\"}\n* on (namespace, pod) group_left () max by (namespace, pod) (kube_pod_status_phase{job=\"kube-state-metrics\", phase=~\"Pending|Running\"} == 1)\n","record":"cluster:namespace:pod_cpu:active:kube_pod_container_resource_requests"},{"expr":"kube_pod_container_resource_requests{job=\"kube-state-metrics\", resource=\"memory\"}\n* on (namespace, pod) group_left () max by (namespace, pod) (kube_pod_status_phase{job=\"kube-state-metrics\", phase=~\"Pending|Running\"} == 1)\n","record":"cluster:namespace:pod_memory:active:kube_pod_container_resource_requests"},{"expr":"kube_pod_container_resource_limits{job=\"kube-state-metrics\", resource=\"cpu\"}\n* on (namespace, pod) group_left () max by (namespace, pod) (kube_pod_status_phase{job=\"kube-state-metrics\", phase=~\"Pending|Running\"} == 1)\n","record":"cluster:namespace:pod_cpu:active:kube_pod_container_resource_limits"},{"expr":"kube_pod_container_resource_limits{job=\"kube-state-metrics\", resource=\"memory\"}\n* on (namespace, pod) group_left () max by (namespace, pod) (kube_pod_status_phase{job=\"kube-state-metrics\", phase=~\"Pending|Running\"} == 1)\n","record":"cluster:namespace:pod_memory:active:kube_pod_container_resource_limits"}]},{"name":"delivery","rules":[{"alert":"AlertDeliveryFailing","annotations":{"summary":"{{ $labels.integration }} notifications are failing."},"expr":"sum by (integration) (\n  increase(alertmanager_notifications_failed_total{job=\"alertmanager\", integration=~\"pushover|telegram\"}[15m])\n) > 0\n","labels":{"severity":"critical"}}]},{"name":"endpoints","rules":[{"alert":"EndpointDown","annotations":{"summary":"{{ $labels.instance }} has not answered for 5 minutes."},"expr":"probe_success{job=\"blackbox\"} == 0\n","for":"5m","labels":{"severity":"critical"}},{"alert":"CertificateExpiringSoon","annotations":{"summary":"Certificate {{ $labels.certificate }} expires in {{ $value | humanizeDuration }}."},"expr":"label_replace(\n  probe_ssl_earliest_cert_expiry{job=\"blackbox\"} - time() < 1814400,\n  \"certificate\", \"$1\", \"instance\", \"(.*)\"\n)\nor\nlabel_replace(\n  certmanager_certificate_expiration_timestamp_seconds{job=\"cert-manager\"} - time() < 1814400,\n  \"certificate\", \"$1\", \"name\", \"(.*)\"\n)\n","for":"1h","labels":{"severity":"warning"}},{"alert":"CertificateExpiringSoon","annotations":{"summary":"Certificate {{ $labels.certificate }} expires in {{ $value | humanizeDuration }}."},"expr":"label_replace(\n  probe_ssl_earliest_cert_expiry{job=\"blackbox\"} - time() < 1209600,\n  \"certificate\", \"$1\", \"instance\", \"(.*)\"\n)\nor\nlabel_replace(\n  certmanager_certificate_expiration_timestamp_seconds{job=\"cert-manager\"} - time() < 1209600,\n  \"certificate\", \"$1\", \"name\", \"(.*)\"\n)\n","for":"1h","labels":{"severity":"critical"}},{"alert":"CertificateNotReady","annotations":{"summary":"Certificate {{ $labels.namespace }}/{{ $labels.name }} is not ready."},"expr":"certmanager_certificate_ready_status{job=\"cert-manager\", condition=\"False\"} == 1\n","for":"1h","labels":{"severity":"warning"}}]},{"name":"gitops","rules":[{"alert":"ArgoApplicationDegraded","annotations":{"summary":"Argo CD Application {{ $labels.name }} is degraded or cannot compare its source."},"expr":"max by (name, namespace) (argocd_app_info{job=\"argocd\", name!=\"apps\", health_status=~\"Degraded|Missing\"})\nor\nmax by (name, namespace) (argocd_app_condition{job=\"argocd\", condition=\"ComparisonError\"})\n","for":"15m","labels":{"severity":"critical"}},{"alert":"ArgoApplicationOutOfSync","annotations":{"summary":"Argo CD Application {{ $labels.name }} has been out of sync for 30 minutes."},"expr":"max by (name, namespace) (argocd_app_info{job=\"argocd\", sync_status=\"OutOfSync\"})\n","for":"30m","labels":{"severity":"warning"}}]},{"name":"host-services","rules":[{"alert":"HostSystemdUnitFailed","annotations":{"summary":"Unit {{ $labels.name }} on {{ $labels.host }} has failed."},"expr":"node_systemd_unit_state{job=\"host-node\", state=\"failed\"} == 1\n","for":"10m","labels":{"severity":"warning"}}]},{"name":"host-storage","rules":[{"alert":"HostZpoolUnhealthy","annotations":{"summary":"ZFS pool {{ $labels.pool }} on {{ $labels.host }} is not ONLINE."},"expr":"last_over_time(homelab_zpool_healthy{job=\"host-node\"}[2h]) == 0","for":"1m","labels":{"severity":"critical"}},{"alert":"HostZpoolDeviceErrors","annotations":{"summary":"ZFS pool {{ $labels.pool }} device {{ $labels.vdev }} on {{ $labels.host }} reports {{ $value }} {{ $labels.type }} errors."},"expr":"last_over_time(homelab_zpool_vdev_errors{job=\"host-node\"}[2h]) > 0","for":"1m","labels":{"severity":"critical"}},{"alert":"HostZpoolScrubErrors","annotations":{"summary":"The last scrub of {{ $labels.pool }} on {{ $labels.host }} found {{ $value }} errors."},"expr":"last_over_time(homelab_zpool_scrub_errors{job=\"host-node\"}[2h]) > 0","labels":{"severity":"critical"}},{"alert":"HostZpoolScrubOverdue","annotations":{"summary":"ZFS pool {{ $labels.pool }} on {{ $labels.host }} has not completed a scrub in 35 days."},"expr":"time() - max_over_time(homelab_zpool_scrub_end_time_seconds{job=\"host-node\"}[3d]) > 3024000\n","for":"1h","labels":{"severity":"warning"}},{"alert":"HostDiskSmartFailing","annotations":{"summary":"Disk {{ $labels.disk }} ({{ $labels.id }}) on {{ $labels.host }} reports failing SMART health."},"expr":"last_over_time(homelab_smart_healthy{job=\"host-node\"}[2h]) == 0\nor\nlast_over_time(homelab_smart_nvme_critical_warning{job=\"host-node\"}[2h]) > 0\n","labels":{"severity":"critical"}},{"alert":"HostDiskSmartFailing","annotations":{"summary":"Disk {{ $labels.disk }} ({{ $labels.id }}) on {{ $labels.host }} reports more defective sectors."},"expr":"delta(homelab_smart_scsi_grown_defects{job=\"host-node\"}[2h]) > 0\nor delta(homelab_smart_ata_pending_sectors{job=\"host-node\"}[2h]) > 0\nor delta(homelab_smart_ata_reallocated_sectors{job=\"host-node\"}[2h]) > 0\nor delta(homelab_smart_nvme_media_errors{job=\"host-node\"}[2h]) > 0\n","labels":{"severity":"warning"}},{"alert":"HostRequiredMountMissing","annotations":{"summary":"Required mount /mnt/storage-clear/media4 on hvn-hyp1 is not mounted."},"expr":"absent(node_filesystem_size_bytes{job=\"host-node\", host=\"hvn-hyp1\", mountpoint=\"/mnt/storage-clear/media4\"})\n","for":"2m","labels":{"host":"hvn-hyp1","mountpoint":"/mnt/storage-clear/media4","severity":"critical"}},{"alert":"HostRequiredMountMissing","annotations":{"summary":"Required mount /srv/media/data on hvn-hyp1 is not mounted."},"expr":"absent(node_filesystem_size_bytes{job=\"host-node\", host=\"hvn-hyp1\", mountpoint=\"/srv/media/data\"})\n","for":"2m","labels":{"host":"hvn-hyp1","mountpoint":"/srv/media/data","severity":"critical"}},{"alert":"HostFilesystemLowSpace","annotations":{"summary":"{{ $labels.mountpoint }} on {{ $labels.host }} has {{ $value | humanizePercentage }} free."},"expr":"last_over_time(node_filesystem_avail_bytes{job=\"host-node\", fstype!~\"tmpfs|ramfs|squashfs|overlay\"}[2h])\n/ last_over_time(node_filesystem_size_bytes{job=\"host-node\", fstype!~\"tmpfs|ramfs|squashfs|overlay\"}[2h])\n< 0.10\n","for":"30m","labels":{"severity":"warning"}},{"alert":"HostFilesystemLowSpace","annotations":{"summary":"{{ $labels.mountpoint }} on {{ $labels.host }} has {{ $value | humanizePercentage }} free."},"expr":"last_over_time(node_filesystem_avail_bytes{job=\"host-node\", fstype!~\"tmpfs|ramfs|squashfs|overlay\"}[2h])\n/ last_over_time(node_filesystem_size_bytes{job=\"host-node\", fstype!~\"tmpfs|ramfs|squashfs|overlay\"}[2h])\n< 0.05\n","for":"30m","labels":{"severity":"critical"}}]},{"name":"missing-telemetry","rules":[{"alert":"TelemetrySourceDown","annotations":{"summary":"Telemetry source kubelet{{ with $labels.instance }} ({{ . }}){{ end }} is not reporting."},"expr":"up{job=\"kubelet\"} == 0 or absent(up{job=\"kubelet\"})\n","for":"5m","labels":{"job":"kubelet","severity":"critical"}},{"alert":"TelemetrySourceDown","annotations":{"summary":"Telemetry source cadvisor{{ with $labels.instance }} ({{ . }}){{ end }} is not reporting."},"expr":"up{job=\"cadvisor\"} == 0 or absent(up{job=\"cadvisor\"})\n","for":"5m","labels":{"job":"cadvisor","severity":"critical"}},{"alert":"TelemetrySourceDown","annotations":{"summary":"Telemetry source argocd{{ with $labels.instance }} ({{ . }}){{ end }} is not reporting."},"expr":"up{job=\"argocd\"} == 0 or absent(up{job=\"argocd\"})\n","for":"5m","labels":{"job":"argocd","severity":"warning"}},{"alert":"TelemetrySourceDown","annotations":{"summary":"Telemetry source cert-manager{{ with $labels.instance }} ({{ . }}){{ end }} is not reporting."},"expr":"up{job=\"cert-manager\"} == 0 or absent(up{job=\"cert-manager\"})\n","for":"5m","labels":{"job":"cert-manager","severity":"warning"}},{"alert":"TelemetrySourceDown","annotations":{"summary":"Telemetry source kube-state-metrics{{ with $labels.instance }} ({{ . }}){{ end }} is not reporting."},"expr":"up{job=\"kube-state-metrics\"} == 0 or absent(up{job=\"kube-state-metrics\"})\n","for":"5m","labels":{"job":"kube-state-metrics","severity":"critical"}},{"alert":"TelemetrySourceDown","annotations":{"summary":"Telemetry source blackbox{{ with $labels.instance }} ({{ . }}){{ end }} is not reporting."},"expr":"up{job=\"blackbox\"} == 0 or absent(up{job=\"blackbox\"})\n","for":"5m","labels":{"job":"blackbox","severity":"warning"}},{"alert":"TelemetrySourceDown","annotations":{"summary":"Telemetry source victoriametrics{{ with $labels.instance }} ({{ . }}){{ end }} is not reporting."},"expr":"up{job=\"victoriametrics\"} == 0 or absent(up{job=\"victoriametrics\"})\n","for":"5m","labels":{"job":"victoriametrics","severity":"warning"}},{"alert":"TelemetrySourceDown","annotations":{"summary":"Telemetry source vmalert{{ with $labels.instance }} ({{ . }}){{ end }} is not reporting."},"expr":"up{job=\"vmalert\"} == 0 or absent(up{job=\"vmalert\"})\n","for":"5m","labels":{"job":"vmalert","severity":"warning"}},{"alert":"TelemetrySourceDown","annotations":{"summary":"Telemetry source alertmanager{{ with $labels.instance }} ({{ . }}){{ end }} is not reporting."},"expr":"up{job=\"alertmanager\"} == 0 or absent(up{job=\"alertmanager\"})\n","for":"5m","labels":{"job":"alertmanager","severity":"warning"}},{"alert":"TelemetrySourceDown","annotations":{"summary":"Host telemetry host-node on hvn-hyp1 is not reporting."},"expr":"up{job=\"host-node\", host=\"hvn-hyp1\"} == 0\nor absent(up{job=\"host-node\", host=\"hvn-hyp1\"})\n","for":"5m","labels":{"host":"hvn-hyp1","job":"host-node","severity":"critical"}},{"alert":"HostZpoolStatusStale","annotations":{"summary":"zpool.prom on hvn-hyp1 has not been refreshed for 10 minutes."},"expr":"time() - node_textfile_mtime_seconds{job=\"host-node\", file=~\"(.*/)?zpool\\\\.prom\"} > 600\nor node_textfile_scrape_error{job=\"host-node\"} == 1\nor absent(node_textfile_mtime_seconds{job=\"host-node\", host=\"hvn-hyp1\", file=~\"(.*/)?zpool\\\\.prom\"})\n","labels":{"host":"hvn-hyp1","severity":"critical"}},{"alert":"HostSmartStatusStale","annotations":{"summary":"smart.prom on hvn-hyp1 has not been refreshed for 45 minutes."},"expr":"time() - node_textfile_mtime_seconds{job=\"host-node\", file=~\"(.*/)?smart\\\\.prom\"} > 2700\nor absent(node_textfile_mtime_seconds{job=\"host-node\", host=\"hvn-hyp1\", file=~\"(.*/)?smart\\\\.prom\"})\n","labels":{"host":"hvn-hyp1","severity":"critical"}},{"alert":"HostZpoolMissing","annotations":{"summary":"ZFS pool rpool is missing from zpool.prom on hvn-hyp1."},"expr":"absent(homelab_zpool_present{job=\"host-node\", host=\"hvn-hyp1\", pool=\"rpool\"} == 1)\n","for":"2m","labels":{"host":"hvn-hyp1","pool":"rpool","severity":"critical"}},{"alert":"HostDiskTelemetryMissing","annotations":{"summary":"Disk media1 (wwn-0x5000cca270846370) on hvn-hyp1 was not read in the last two SMART runs."},"expr":"absent(homelab_smart_device_up{job=\"host-node\", host=\"hvn-hyp1\", disk=\"media1\"} == 1)\n","for":"20m","labels":{"disk":"media1","host":"hvn-hyp1","id":"wwn-0x5000cca270846370","severity":"critical"}},{"alert":"HostDiskTelemetryMissing","annotations":{"summary":"Disk media2 (wwn-0x5000cca270607128) on hvn-hyp1 was not read in the last two SMART runs."},"expr":"absent(homelab_smart_device_up{job=\"host-node\", host=\"hvn-hyp1\", disk=\"media2\"} == 1)\n","for":"20m","labels":{"disk":"media2","host":"hvn-hyp1","id":"wwn-0x5000cca270607128","severity":"critical"}},{"alert":"HostDiskTelemetryMissing","annotations":{"summary":"Disk media3 (wwn-0x5000cca26f7c1a74) on hvn-hyp1 was not read in the last two SMART runs."},"expr":"absent(homelab_smart_device_up{job=\"host-node\", host=\"hvn-hyp1\", disk=\"media3\"} == 1)\n","for":"20m","labels":{"disk":"media3","host":"hvn-hyp1","id":"wwn-0x5000cca26f7c1a74","severity":"critical"}},{"alert":"HostDiskTelemetryMissing","annotations":{"summary":"Disk media4 (wwn-0x5000cca27061f6b4) on hvn-hyp1 was not read in the last two SMART runs."},"expr":"absent(homelab_smart_device_up{job=\"host-node\", host=\"hvn-hyp1\", disk=\"media4\"} == 1)\n","for":"20m","labels":{"disk":"media4","host":"hvn-hyp1","id":"wwn-0x5000cca27061f6b4","severity":"critical"}},{"alert":"HostDiskTelemetryMissing","annotations":{"summary":"Disk rpool-a (pci-0000:88:00.0-nvme-1) on hvn-hyp1 was not read in the last two SMART runs."},"expr":"absent(homelab_smart_device_up{job=\"host-node\", host=\"hvn-hyp1\", disk=\"rpool-a\"} == 1)\n","for":"20m","labels":{"disk":"rpool-a","host":"hvn-hyp1","id":"pci-0000:88:00.0-nvme-1","severity":"critical"}},{"alert":"HostDiskTelemetryMissing","annotations":{"summary":"Disk rpool-b (pci-0000:87:00.0-nvme-1) on hvn-hyp1 was not read in the last two SMART runs."},"expr":"absent(homelab_smart_device_up{job=\"host-node\", host=\"hvn-hyp1\", disk=\"rpool-b\"} == 1)\n","for":"20m","labels":{"disk":"rpool-b","host":"hvn-hyp1","id":"pci-0000:87:00.0-nvme-1","severity":"critical"}},{"alert":"HostDiskTelemetryMissing","annotations":{"summary":"Disk spare-a (wwn-0x5000cca200080000) on hvn-hyp1 was not read in the last two SMART runs."},"expr":"absent(homelab_smart_device_up{job=\"host-node\", host=\"hvn-hyp1\", disk=\"spare-a\"} == 1)\n","for":"20m","labels":{"disk":"spare-a","host":"hvn-hyp1","id":"wwn-0x5000cca200080000","severity":"critical"}},{"alert":"HostDiskTelemetryMissing","annotations":{"summary":"Disk spare-b (wwn-0x5000cca26f7cf7cc) on hvn-hyp1 was not read in the last two SMART runs."},"expr":"absent(homelab_smart_device_up{job=\"host-node\", host=\"hvn-hyp1\", disk=\"spare-b\"} == 1)\n","for":"20m","labels":{"disk":"spare-b","host":"hvn-hyp1","id":"wwn-0x5000cca26f7cf7cc","severity":"critical"}},{"alert":"HostDiskTelemetryMissing","annotations":{"summary":"Disk spare-c (wwn-0x5000cca253dd0dc5) on hvn-hyp1 was not read in the last two SMART runs."},"expr":"absent(homelab_smart_device_up{job=\"host-node\", host=\"hvn-hyp1\", disk=\"spare-c\"} == 1)\n","for":"20m","labels":{"disk":"spare-c","host":"hvn-hyp1","id":"wwn-0x5000cca253dd0dc5","severity":"critical"}}]},{"name":"monitoring-storage","rules":[{"alert":"MonitoringStorageLow","annotations":{"summary":"Metrics storage has {{ $value | humanize1024 }}B free; ingestion stops at 50 GiB."},"expr":"vm_free_disk_space_bytes{job=\"victoriametrics\"} < 107374182400\n","for":"5m","labels":{"severity":"warning"}},{"alert":"MonitoringStorageLow","annotations":{"summary":"Metrics storage has {{ $value | humanize1024 }}B free; ingestion stops at 50 GiB."},"expr":"vm_free_disk_space_bytes{job=\"victoriametrics\"} < 75161927680\n","for":"5m","labels":{"severity":"critical"}},{"alert":"MonitoringStorageGrowth","annotations":{"summary":"Metrics history is {{ $value | humanize1024 }}B, expected under 9 GiB."},"expr":"sum(vm_data_size_bytes{job=\"victoriametrics\"}) > 21474836480\n","for":"30m","labels":{"severity":"warning"}}]},{"name":"watchdog","rules":[{"alert":"Watchdog","annotations":{"summary":"Homelab monitoring heartbeat."},"expr":"vector(1)\n  and on() (sum(increase(vm_rows_added_to_storage_total{job=\"victoriametrics\"}[3m])) > 0)\n  and on() (\n    time() - max(\n        timestamp(kubelet_running_pods{job=\"kubelet\"})\n      or timestamp(machine_cpu_cores{job=\"cadvisor\"})\n      or timestamp(kube_node_info{job=\"kube-state-metrics\"})\n      or timestamp(node_time_seconds{job=\"host-node\"})\n    ) < 180\n  )\n","labels":{"severity":"none"}}]},{"name":"workloads","rules":[{"alert":"KubeContainerOOMKilled","annotations":{"summary":"{{ $labels.namespace }}/{{ $labels.pod }} container {{ $labels.container }} was OOMKilled and restarted."},"expr":"(\n  increase(kube_pod_container_status_restarts_total{job=\"kube-state-metrics\"}[10m]) > 0\n  and on (namespace, pod, container)\n  kube_pod_container_status_last_terminated_reason{job=\"kube-state-metrics\", reason=\"OOMKilled\"} == 1\n)\nor on (namespace, pod, container)\n(\n  sum by (namespace, pod, container) (\n    increase(container_oom_events_total{job=\"cadvisor\", container!=\"\"}[10m])\n  ) > 0\n)\n","labels":{"severity":"critical"}},{"alert":"KubeContainerRestarted","annotations":{"summary":"{{ $labels.namespace }}/{{ $labels.pod }} container {{ $labels.container }} restarted."},"expr":"increase(kube_pod_container_status_restarts_total{job=\"kube-state-metrics\"}[10m]) > 0\nunless on (namespace, pod, container)\nkube_pod_container_status_last_terminated_reason{job=\"kube-state-metrics\", reason=\"OOMKilled\"} == 1\n","labels":{"severity":"warning"}},{"alert":"KubePodCrashLooping","annotations":{"summary":"{{ $labels.namespace }}/{{ $labels.pod }} container {{ $labels.container }} is crash-looping."},"expr":"max by (namespace, pod, container) (\n  max_over_time(kube_pod_container_status_waiting_reason{job=\"kube-state-metrics\", reason=\"CrashLoopBackOff\"}[5m])\n) >= 1\n","for":"15m","labels":{"severity":"critical"}},{"alert":"KubePodNotReady","annotations":{"summary":"{{ $labels.namespace }}/{{ $labels.pod }} has not been ready for 15 minutes."},"expr":"max by (namespace, pod) (kube_pod_status_ready{job=\"kube-state-metrics\", condition=\"true\"} == 0)\nand on (namespace, pod)\nmax by (namespace, pod) (kube_pod_status_phase{job=\"kube-state-metrics\", phase=~\"Pending|Running|Unknown\"} == 1)\n","for":"15m","labels":{"severity":"critical"}},{"alert":"KubePodEvicted","annotations":{"summary":"{{ $labels.namespace }}/{{ $labels.pod }} was evicted."},"expr":"kube_pod_status_reason{job=\"kube-state-metrics\", reason=\"Evicted\"} == 1\nunless\nkube_pod_status_reason{job=\"kube-state-metrics\", reason=\"Evicted\"} offset 30m == 1\n","labels":{"severity":"warning"}},{"alert":"KubeJobFailed","annotations":{"summary":"Job {{ $labels.namespace }}/{{ $labels.job_name }} failed."},"expr":"kube_job_failed{job=\"kube-state-metrics\", condition=\"true\"} == 1\n","labels":{"severity":"warning"}},{"alert":"KubeNodeMemoryPressure","annotations":{"summary":"Node {{ $labels.node }} reports memory pressure."},"expr":"kube_node_status_condition{job=\"kube-state-metrics\", condition=\"MemoryPressure\", status=\"true\"} == 1\n","for":"15m","labels":{"severity":"warning"}},{"alert":"KubeContainerCPUThrottled","annotations":{"summary":"{{ $labels.namespace }}/{{ $labels.pod }} container {{ $labels.container }} was CPU-throttled in {{ $value | humanizePercentage }} of its periods for 15 minutes."},"expr":"(\n  sum by (namespace, pod, container) (\n    rate(container_cpu_cfs_throttled_periods_total{job=\"cadvisor\", container!=\"\"}[5m])\n  )\n  /\n  sum by (namespace, pod, container) (\n    rate(container_cpu_cfs_periods_total{job=\"cadvisor\", container!=\"\"}[5m])\n  )\n) > 0.25\nand on (namespace, pod, container)\nkube_pod_container_resource_limits{job=\"kube-state-metrics\", resource=\"cpu\"} > 0\n","for":"15m","labels":{"severity":"warning"}},{"alert":"KubeContainerMemoryNearLimit","annotations":{"summary":"{{ $labels.namespace }}/{{ $labels.pod }} container {{ $labels.container }} has used {{ $value | humanizePercentage }} of its memory limit for 10 minutes."},"expr":"max by (namespace, pod, container) (\n  container_memory_working_set_bytes{job=\"cadvisor\", container!=\"\", image!=\"\"}\n)\n/ on (namespace, pod, container)\nmax by (namespace, pod, container) (\n  kube_pod_container_resource_limits{job=\"kube-state-metrics\", resource=\"memory\"}\n)\n> 0.9\n","for":"10m","labels":{"severity":"warning"}}]}]}'
kind: ConfigMap
