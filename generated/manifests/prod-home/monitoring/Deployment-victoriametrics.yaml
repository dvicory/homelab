apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: victoriametrics
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: victoriametrics
    helm.sh/chart: app-template-5.1.0
  name: victoriametrics
  namespace: monitoring
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/instance: victoriametrics
      app.kubernetes.io/name: victoriametrics
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        checksum/configMaps: 12c80689fa61b4579cb65d0156ce7cb366638b5491d75f92521a3ad20ce21e2a
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: victoriametrics
        app.kubernetes.io/name: victoriametrics
        app.kubernetes.io/part-of: monitoring
    spec:
      automountServiceAccountToken: true
      containers:
        - args:
            - -storageDataPath=/storage
            - -retentionPeriod=90d
            - -storage.minFreeDiskSpaceBytes=50GiB
            - -promscrape.config=/etc/victoriametrics/scrape.json
            - -promscrape.config.strictParse=true
            - -httpListenAddr=:8428
          image: docker.io/victoriametrics/victoria-metrics:v1.151.0@sha256:6d164540a04f49ba4e696cbdb70f9fee78be1e94b8f2a1292743a0b1ab8275bd
          imagePullPolicy: IfNotPresent
          name: victoriametrics
          ports:
            - containerPort: 8428
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 8428
            periodSeconds: 10
          resources:
            limits:
              cpu: "1"
              memory: 1536Mi
            requests:
              cpu: 100m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /etc/victoriametrics
              name: scrape
              readOnly: true
            - mountPath: /storage
              name: storage
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      nodeSelector:
        kubernetes.io/hostname: compute-1
      securityContext:
        runAsGroup: 3100
        runAsNonRoot: true
        runAsUser: 3100
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: victoriametrics
      volumes:
        - configMap:
            defaultMode: 420
            name: victoriametrics-scrape
          name: scrape
        - name: storage
          persistentVolumeClaim:
            claimName: monitoring-metrics
