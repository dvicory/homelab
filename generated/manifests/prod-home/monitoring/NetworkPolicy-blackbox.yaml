apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: blackbox
  namespace: monitoring
spec:
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: victoriametrics
              app.kubernetes.io/part-of: monitoring
      ports:
        - port: 9115
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: blackbox
      app.kubernetes.io/name: prometheus-blackbox-exporter
  policyTypes:
    - Ingress
