apiVersion: v1
data:
  dashboardproviders.yaml: |
    apiVersion: 1
    providers:
    - allowUiUpdates: false
      disableDeletion: true
      editable: false
      name: homelab
      options:
        path: /var/lib/grafana/dashboards/homelab
      orgId: 1
      type: file
  datasources.yaml: |
    apiVersion: 1
    datasources:
    - access: proxy
      editable: false
      isDefault: true
      jsonData:
        timeInterval: 30s
      name: VictoriaMetrics
      type: prometheus
      uid: victoriametrics
      url: http://victoriametrics.monitoring.svc:8428
    - access: proxy
      editable: false
      jsonData:
        handleGrafanaManagedAlerts: false
        implementation: prometheus
      name: Alertmanager
      type: alertmanager
      uid: alertmanager
      url: http://alertmanager.monitoring.svc:9093
  grafana.ini: |
    [analytics]
    check_for_plugin_updates = false
    check_for_updates = false
    reporting_enabled = false
    [auth]
    disable_login_form = true
    oauth_auto_login = true
    [auth.anonymous]
    enabled = false
    [auth.basic]
    enabled = false
    [auth.generic_oauth]
    allow_assign_grafana_admin = false
    allow_sign_up = true
    api_url = https://id.bzfx.net/oauth2/openid/grafana/userinfo
    auth_url = https://id.bzfx.net/ui/oauth2
    client_id = grafana
    client_secret = $__file{/etc/secrets/grafana-oidc/client-secret}
    email_attribute_path = email
    enabled = true
    groups_attribute_path = groups
    login_attribute_path = preferred_username
    name = Kanidm
    role_attribute_path = contains(groups[*], 'homelab-admin') && 'Admin' || ''
    role_attribute_strict = true
    scopes = openid profile email groups_name
    token_url = https://id.bzfx.net/oauth2/token
    use_pkce = true
    use_refresh_token = true
    [log]
    mode = console
    [metrics]
    enabled = false
    [news]
    news_feed_enabled = false
    [paths]
    data = /var/lib/grafana/
    logs = /var/log/grafana
    plugins = /var/lib/grafana/plugins
    provisioning = /etc/grafana/provisioning
    [plugins]
    preinstall_auto_update = false
    preinstall_disabled = true
    [security]
    cookie_secure = true
    disable_gravatar = true
    secret_key = $__file{/etc/secrets/grafana-admin/secret-key}
    [server]
    domain = grafana.plus2.danielvicory.dev
    root_url = https://grafana.plus2.danielvicory.dev
    [unified_alerting]
    execute_alerts = false
    [unified_storage]
    index_path = /var/lib/grafana-search/bleve
    [users]
    allow_sign_up = false
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: grafana
    app.kubernetes.io/name: grafana
    app.kubernetes.io/version: 13.2.3
    helm.sh/chart: grafana-13.5.0
  name: grafana
  namespace: monitoring
