apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: seerr
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: seerr
    helm.sh/chart: app-template-5.1.0
  name: seerr
  namespace: media
spec:
  podManagementPolicy: OrderedReady
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/instance: seerr
      app.kubernetes.io/name: seerr
  serviceName: seerr
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: seerr
        app.kubernetes.io/name: seerr
    spec:
      automountServiceAccountToken: false
      containers:
        - env:
            - name: TZ
              value: UTC
          image: ghcr.io/seerr-team/seerr:v3.4.1@sha256:f4768de5f616248d723e05891f3345a1402123775d03bf0890dbfedc0831bda1
          livenessProbe:
            httpGet:
              path: /api/v1/status
              port: 5055
            periodSeconds: 30
            timeoutSeconds: 5
          name: main
          readinessProbe:
            httpGet:
              path: /api/v1/status
              port: 5055
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              cpu: "2"
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            failureThreshold: 60
            httpGet:
              path: /api/v1/status
              port: 5055
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - mountPath: /app/config
              name: config
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      nodeSelector:
        kubernetes.io/hostname: compute-1
      serviceAccountName: seerr
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: media-seerr
  updateStrategy:
    type: RollingUpdate
