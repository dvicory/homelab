apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: radarr
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: radarr
    helm.sh/chart: app-template-5.1.0
  name: radarr
  namespace: media
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/instance: radarr
      app.kubernetes.io/name: radarr
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        checksum/configMaps: 48d17cdd79f10f00b458fb0fdc739e017ebb69dec6a9a303ca183906ca22b195
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: radarr
        app.kubernetes.io/name: radarr
    spec:
      automountServiceAccountToken: false
      containers:
        - env:
            - name: PGID
              value: "752"
            - name: PUID
              value: "752"
            - name: RADARR__AUTH__APIKEY
              valueFrom:
                secretKeyRef:
                  key: RADARR_API_KEY
                  name: media-runtime
            - name: RADARR__AUTH__METHOD
              value: External
            - name: RADARR__AUTH__REQUIRED
              value: Enabled
            - name: RADARR__SERVER__URLBASE
              value: ""
            - name: TZ
              value: UTC
            - name: UMASK
              value: "007"
          image: ghcr.io/linuxserver/radarr:6.4.4.10685-ls325@sha256:ade5937813c6ae415b29db729386e53fea3ecf067a019849bafbe2d2a6ec02ba
          livenessProbe:
            failureThreshold: 6
            httpGet:
              path: /ping
              port: 7878
            periodSeconds: 10
            timeoutSeconds: 5
          name: main
          readinessProbe:
            failureThreshold: 6
            httpGet:
              path: /ping
              port: 7878
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              cpu: "2"
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            failureThreshold: 60
            httpGet:
              path: /ping
              port: 7878
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - mountPath: /config
              name: config
            - mountPath: /data
              name: data
            - mountPath: /custom-cont-init.d/10-media-group.sh
              name: media-group
              readOnly: true
              subPath: 10-media-group.sh
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      nodeSelector:
        kubernetes.io/hostname: compute-1
      securityContext:
        supplementalGroups:
          - 505
      serviceAccountName: radarr
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: media-radarr
        - hostPath:
            path: /srv/media/data
            type: Directory
          name: data
        - configMap:
            defaultMode: 365
            name: radarr
          name: media-group
