apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: media-configuration
  namespace: argocd
spec:
  destination:
    namespace: media-configuration
    server: https://kubernetes.default.svc
  project: default
  source:
    path: ./generated/manifests/prod-home/media-configuration
    repoURL: https://github.com/dvicory/homelab.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
