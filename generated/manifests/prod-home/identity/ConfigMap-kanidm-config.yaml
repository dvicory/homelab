apiVersion: v1
data:
  server.toml: |
    version = "2"
    bindaddress = "0.0.0.0:8443"
    db_path = "/data/kanidm.db"
    tls_chain = "/etc/kanidm/tls/tls.crt"
    tls_key = "/etc/kanidm/tls/tls.key"
    domain = "id.bzfx.net"
    origin = "https://id.bzfx.net"
    ldapbindaddress = "0.0.0.0:3636"
kind: ConfigMap
metadata:
  name: kanidm-config
  namespace: identity
