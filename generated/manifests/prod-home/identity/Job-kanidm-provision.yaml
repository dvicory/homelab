apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  name: kanidm-provision
  namespace: identity
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kanidm-provision
    spec:
      automountServiceAccountToken: true
      containers:
        - env:
            - name: KANIDM_URL
              value: https://idm.plus2.danielvicory.dev
            - name: KANIDM_ADMIN_GROUP
              value: homelab-admin
            - name: KANIDM_OIDC_CLIENT
              value: household-admin
            - name: KANIDM_CLIENT_SECRET
              value: oidc-client
            - name: HOME
              value: /work
            - name: SSL_CERT_FILE
              value: /trust/ca.crt
            - name: CURL_CA_BUNDLE
              value: /trust/ca.crt
          image: homelab/kanidm-provision:zh2wqlbrfxm50k46csghr0316n47vwi1
          imagePullPolicy: Never
          name: provision
          resources:
            limits:
              cpu: "1"
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /work
              name: work
            - mountPath: /desired
              name: desired
              readOnly: true
            - mountPath: /credentials
              name: credentials
              readOnly: true
            - mountPath: /trust
              name: trust
              readOnly: true
      nodeSelector:
        kubernetes.io/hostname: compute-1
      restartPolicy: OnFailure
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: kanidm-provision
      volumes:
        - emptyDir:
            medium: Memory
            sizeLimit: 32Mi
          name: work
        - configMap:
            name: kanidm-provision
          name: desired
        - name: trust
          secret:
            items:
              - key: ca.crt
                path: ca.crt
            secretName: kanidm-tls
        - name: credentials
          secret:
            defaultMode: 288
            items:
              - key: idm-admin-password
                path: idm-admin-password
            secretName: kanidm-provision
