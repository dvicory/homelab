apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  name: kanidm-provision
  namespace: identity
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kanidm-provision
    spec:
      automountServiceAccountToken: true
      containers:
        - env:
            - name: KANIDM_URL
              value: https://id.bzfx.net
            - name: KANIDM_ADMIN_GROUP
              value: homelab-admin
            - name: HOME
              value: /work
          image: ghcr.io/dvicory/homelab/kanidm-provision@sha256:f02a5d250eebbaf171a81b8b21d4a4dac76889163deb24203e1716df76e27f3d
          imagePullPolicy: IfNotPresent
          name: provision
          resources:
            limits:
              cpu: "1"
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /work
              name: work
            - mountPath: /desired
              name: desired
              readOnly: true
            - mountPath: /credentials
              name: credentials
              readOnly: true
      nodeSelector:
        kubernetes.io/hostname: compute-1
      restartPolicy: OnFailure
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: kanidm-provision
      volumes:
        - emptyDir:
            medium: Memory
            sizeLimit: 32Mi
          name: work
        - configMap:
            name: kanidm-provision
          name: desired
        - name: credentials
          secret:
            defaultMode: 288
            items:
              - key: idm-admin-password
                path: idm-admin-password
            secretName: kanidm-provision
