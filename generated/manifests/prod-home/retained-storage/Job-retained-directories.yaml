apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    argocd.argoproj.io/sync-wave: "1"
  name: retained-directories
  namespace: local-path-storage
spec:
  backoffLimit: 0
  template:
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - /srv/state
            - .homelab-state-root
            - $(RETAINED_DIRECTORIES)
          env:
            - name: RETAINED_DIRECTORIES
              valueFrom:
                configMapKeyRef:
                  key: directories.json
                  name: retained-directories
          image: homelab/retained-directories:y5l6gks69k1qbxa1f9wxp6lzzgnhfyl9
          imagePullPolicy: Never
          name: retained-directories
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - CHOWN
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 0
            runAsUser: 0
          volumeMounts:
            - mountPath: /srv/state
              name: state
      nodeSelector:
        kubernetes.io/hostname: compute-1
      restartPolicy: Never
      volumes:
        - hostPath:
            path: /srv/state
            type: Directory
          name: state
