    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  name: immich-postgres
  namespace: immich
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 32Gi
  storageClassName: ""
  volumeName: immich-postgres
