# Resource-local contracts match actual Kubernetes resources. Only population,
# provenance and cross-resource joins use the independent verification bundle.
# Additional selecting NetworkPolicies are checked as an effective ingress union.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: edge-identity
  annotations:
    pod-policies.kyverno.io/autogen-controllers: none
spec:
  background: false
  rules:
  - name: identity-populations
    match:
      any:
      - resources:
          kinds:
          - ConfigMap
          names:
          - verification-bundle
          namespaces:
          - verification
    validate:
      failureAction: Enforce
      cel:
        variables: &id001
        - name: objects
          expression: object.bundle.resources.map(r, r.object)
        - name: cluster
          expression: object.bundle.expected.cluster
        - name: phase
          expression: variables.cluster.settings.kubernetes.services.identity.phase
        - name: inventory
          expression: variables.cluster.routes
        - name: active
          expression: >-
            variables.inventory.filter(n, (variables.inventory[n].auth != 'admin' || variables.phase ==
            'normal') && (n != 'requests' || variables.cluster.settings.kubernetes.services.seerr.phase
            == 'ready') && (n != 'home' || (variables.phase == 'normal' &&
            variables.cluster.settings.kubernetes.services.homarr.phase == 'ready')))
        - name: managed
          expression: variables.active.filter(n, variables.inventory[n].manageBackendIngress)
        - name: admins
          expression: variables.inventory.filter(n, variables.inventory[n].auth == 'admin')
        - name: routes
          expression: variables.objects.filter(o, o.kind == 'HTTPRoute')
        - name: tls
          expression: variables.objects.filter(o, o.kind == 'BackendTLSPolicy' && o.metadata.name != 'kanidm-oidc-tls')
        - name: isolation
          expression: >-
            variables.objects.filter(o, o.kind == 'NetworkPolicy' && o.metadata.name.startsWith('gateway-')
            && o.metadata.name.endsWith('-backend-ingress'))
        - name: public
          expression: variables.cluster.ingress.public != null
        - name: peers
          expression: "variables.public ? [variables.cluster.ingress.public.peerAddress + '/32'] : []"
        - name: gatewayImage
          expression: '''docker.io/envoyproxy/gateway:v1.9.1@sha256:0049bcb384c591c6a6dd043fe5c9929ef6e74f230e12dd678d2d3701df9b301e'''
        - name: proxyImage
          expression: >-
            'docker.io/envoyproxy/envoy:distroless-v1.39.1@sha256:eb2c01c13125d1629637cb4e4cce7207009fb7cc2c8027f9742758549d15b6f4'
        expressions:
        - expression: variables.phase in ['initial', 'provisioning', 'normal']
          message: >-
            Identity phase must have its own complete population, without initial provisioning or premature
            OIDC transport.
        - expression: >-
            ['Deployment', 'Service', 'ConfigMap'].all(k, variables.objects.filter(o, o.kind == k && o.metadata.name
            == (k == 'ConfigMap' ? 'kanidm-config' : 'kanidm') && has(o.metadata.namespace) && o.metadata.namespace
            == 'identity').size() == 1)
          message: >-
            Identity phase must have its own complete population, without initial provisioning or premature
            OIDC transport.
        - expression: >-
            ['ConfigMap', 'ServiceAccount', 'Job'].all(k, variables.objects.filter(o, o.kind == k && o.metadata.name
            == 'kanidm-provision').size() == (variables.phase == 'initial' ? 0 : 1))
          message: >-
            Identity phase must have its own complete population, without initial provisioning or premature
            OIDC transport.
        - expression: >-
            object.bundle.resources.filter(r, r.object.kind == 'Secret' && r.file.startsWith('identity/')).size()
            == 0 ? variables.phase == 'initial' : variables.phase != 'initial'
          message: >-
            Identity phase must have its own complete population, without initial provisioning or premature
            OIDC transport.
        - expression: >-
            object.bundle.resources.filter(r, r.object.kind == 'Secret' && r.file.startsWith('identity/')).all(r,
            ['Role', 'RoleBinding'].all(k, variables.objects.filter(o, o.kind == k && o.metadata.name
            == 'kanidm-client-secret-' + r.object.metadata.name && o.metadata.namespace == r.object.metadata.namespace)
            .size() == 1))
          message: >-
            Identity phase must have its own complete population, without initial provisioning or premature
            OIDC transport.
        - expression: >-
            variables.objects.filter(o, o.kind in ['Role', 'RoleBinding'] && o.metadata.name.startsWith('kanidm-client-secret-'))
            .all(o, object.bundle.resources.exists(r, r.object.kind == 'Secret' && r.file.startsWith('identity/')
            && o.metadata.name == 'kanidm-client-secret-' + r.object.metadata.name && o.metadata.namespace
            == r.object.metadata.namespace))
          message: >-
            Identity phase must have its own complete population, without initial provisioning or premature
            OIDC transport.
        - expression: >-
            ['Backend', 'BackendTLSPolicy', 'ReferenceGrant'].all(k, variables.objects.filter(o, o.kind
            == k && o.metadata.name == (k == 'Backend' ? 'kanidm-oidc' : k == 'BackendTLSPolicy' ? 'kanidm-oidc-tls'
            : 'gateway-oidc-backend')).size() == (variables.phase == 'normal' ? 1 : 0))
          message: >-
            Identity phase must have its own complete population, without initial provisioning or premature
            OIDC transport.
        - expression: >-
            object.bundle.resources.filter(r, (r.object.kind == 'Backend' && r.object.metadata.name ==
            'kanidm-oidc') || (r.object.kind == 'BackendTLSPolicy' && r.object.metadata.name == 'kanidm-oidc-tls')
            || (r.object.kind == 'ReferenceGrant' && r.object.metadata.name == 'gateway-oidc-backend'))
            .all(r, 'identity-gateway' in r.file.split('/'))
          message: OIDC transport belongs to the normal administrator consumer application, never the
            identity application.
  - name: administrator-publication-atomic
    match:
      any:
      - resources:
          kinds:
          - ConfigMap
          names:
          - verification-bundle
          namespaces:
          - verification
    validate:
      failureAction: Enforce
      cel:
        variables: *id001
        expressions:
        - expression: >-
            variables.objects.filter(o, o.kind == 'SecurityPolicy' && o.metadata.name.endsWith('-admin')).size()
            == (variables.phase == 'normal' ? variables.admins.size() : 0)
          message: >-
            Administrator route and SecurityPolicy must publish together only in normal, with matching
            namespace, target and waves.
        - expression: >-
            variables.admins.all(n, variables.routes.filter(r, r.metadata.name == n).size() == (variables.phase
            == 'normal' ? 1 : 0) && variables.objects.filter(o, o.kind == 'SecurityPolicy' && o.metadata.name
            == n + '-admin').size() == (variables.phase == 'normal' ? 1 : 0))
          message: >-
            Administrator route and SecurityPolicy must publish together only in normal, with matching
            namespace, target and waves.
        - expression: >-
            variables.objects.filter(o, o.kind == 'SecurityPolicy' && o.metadata.name.endsWith('-admin')).all(p,
            variables.admins.exists(n, p.metadata.name == n + '-admin' && variables.routes.exists(r, r.metadata.name
            == n && p.metadata.namespace == r.metadata.namespace && p.spec.targetRefs == [{'group':dyn(r.apiVersion.split('/')[0]),
            'kind':dyn(r.kind), 'name':dyn(r.metadata.name)}] && p.metadata.annotations['argocd.argoproj.io/sync-wave']
            == '-1' && r.metadata.annotations['argocd.argoproj.io/sync-wave'] == '0')))
          message: >-
            Administrator route and SecurityPolicy must publish together only in normal, with matching
            namespace, target and waves.
        - expression: >-
            variables.objects.filter(o, o.kind in ['ReferenceGrant', 'BackendTLSPolicy', 'NetworkPolicy']).all(o,
            variables.admins.all(n, !(o.metadata.name in [dyn('gateway-' + n), dyn(n), dyn('gateway-' + n + '-backend-ingress')])
            || variables.phase == 'normal'))
          message: >-
            Administrator route and SecurityPolicy must publish together only in normal, with matching
            namespace, target and waves.
  - name: native-idm-population
    match:
      any:
      - resources:
          kinds:
          - ConfigMap
          names:
          - verification-bundle
          namespaces:
          - verification
    validate:
      failureAction: Enforce
      cel:
        variables: *id001
        expressions:
        - expression: variables.routes.filter(o, o.metadata.name == 'idm').size() == 1
          message: Native identity data must remain on its retained claim and native idm route in every
            phase.
        - expression: >-
            variables.objects.filter(o, o.kind == 'PersistentVolumeClaim' && o.metadata.name == 'identity-kanidm'
            && o.metadata.namespace == 'identity').size() == 1 && variables.objects.filter(o, o.kind ==
            'PersistentVolume' && o.metadata.name == 'identity-kanidm').size() == 1
          message: Native identity data must remain on its retained claim and native idm route in every
            phase.
        - expression: >-
            variables.inventory.idm.namespace == 'identity' && variables.inventory.idm.service == 'kanidm'
            && variables.inventory.idm.port == 443 && variables.inventory.idm.backendTLS && variables.inventory.idm.backendHostname
            == variables.inventory.idm.hostnames[0] && variables.inventory.idm.pathPrefix == '/'
          message: The native idm route must retain its identity Service and HTTPS hostname-root boundary.
  - name: seerr-publication
    match:
      any:
      - resources:
          kinds:
          - ConfigMap
          names:
          - verification-bundle
          namespaces:
          - verification
    validate:
      failureAction: Enforce
      cel:
        variables: *id001
        expressions:
        - expression: >-
            variables.cluster.settings.kubernetes.services.seerr.phase in ['initial', 'ready'] && variables.inventory.requests.auth
            == 'native' && variables.inventory.requests.exposure == 'public'
          message: Requests publication must follow Seerr initial/ready facts independently of identity
            phase.
        - expression: >-
            variables.routes.filter(o, o.metadata.name == 'requests').size() == (variables.cluster.settings.kubernetes.services.seerr.phase
            == 'ready' ? 1 : 0)
          message: Requests publication must follow Seerr initial/ready facts independently of identity
            phase.
  - name: route-population
    match:
      any:
      - resources:
          kinds:
          - ConfigMap
          names:
          - verification-bundle
          namespaces:
          - verification
    validate:
      failureAction: Enforce
      cel:
        variables: *id001
        expressions:
        - expression: >-
            variables.routes.size() == variables.active.size() && variables.active.all(n, variables.routes.filter(o,
            o.metadata.name == n && o.metadata.namespace == 'gateway').size() == 1)
          message: Every active inventory route must render exactly once; unknown or inactive routes are
            forbidden.
        - expression: >-
            variables.routes.all(r, r.metadata.name in variables.active &&
            r.spec.parentRefs == ([{'group':'gateway.networking.k8s.io','kind':'Gateway','name':'household'}] +
            (variables.public && variables.inventory[r.metadata.name].exposure == 'public' &&
            (r.metadata.name != 'idm' || variables.phase == 'normal')
            ? [{'group':'gateway.networking.k8s.io','kind':'Gateway','name':'household-public'}] : [])))
          message: Every eligible route attaches privately and only declared public routes attach to public entry.
  - name: route-service-grant-joins
    match:
      any:
      - resources:
          kinds:
          - ConfigMap
          names:
          - verification-bundle
          namespaces:
          - verification
    validate:
      failureAction: Enforce
      cel:
        variables: *id001
        expressions:
        - expression: >-
            variables.routes.all(r, has(r.spec.rules) && r.spec.rules.size() > 0 && r.spec.rules.all(rule,
            has(rule.backendRefs) && rule.backendRefs.size() > 0 && rule.backendRefs.all(ref, (!has(ref.group)
            || ref.group == '') && (!has(ref.kind) || ref.kind == 'Service') && has(ref.port)
            && (type(ref.port) == int || type(ref.port) == double) && ref.port >= 1 && ref.port <= 65535
            && double(ref.port) == double(int(ref.port)) && variables.objects.exists(s, s.kind == 'Service'
            && s.metadata.name == ref.name && (has(s.metadata.namespace) ? s.metadata.namespace : 'default')
            == (has(ref.namespace) ? ref.namespace : (has(r.metadata.namespace) ? r.metadata.namespace
            : 'default')) && s.spec.ports.exists(p, p.port == ref.port)) && ((has(ref.namespace) ? ref.namespace
            : (has(r.metadata.namespace) ? r.metadata.namespace : 'default')) == (has(r.metadata.namespace)
            ? r.metadata.namespace : 'default') || variables.objects.exists(g, g.kind == 'ReferenceGrant'
            && g.apiVersion.split('/')[0] == 'gateway.networking.k8s.io' && (has(g.metadata.namespace)
            ? g.metadata.namespace : 'default') == (has(ref.namespace) ? ref.namespace : (has(r.metadata.namespace)
            ? r.metadata.namespace : 'default')) && g.spec.from.exists(f, f.group == 'gateway.networking.k8s.io'
            && f.kind == 'HTTPRoute' && f.namespace == (has(r.metadata.namespace) ? r.metadata.namespace
            : 'default')) && g.spec.to.exists(t, (!has(t.group) || t.group == '') && t.kind == 'Service'
            && (!has(t.name) || t.name == ref.name)))))))
          message: Every route must resolve a valid Service port and a cross-namespace ReferenceGrant
            using effective namespaces.
  - name: backend-tls-population
    match:
      any:
      - resources:
          kinds:
          - ConfigMap
          names:
          - verification-bundle
          namespaces:
          - verification
    validate:
      failureAction: Enforce
      cel:
        variables: *id001
        expressions:
        - expression: >-
            variables.tls.size() == variables.active.filter(n, variables.inventory[n].backendTLS).size()
            && variables.active.filter(n, variables.inventory[n].backendTLS).all(n, variables.tls.filter(t,
            t.metadata.name == n).size() == 1)
          message: Every active TLS backend must have exactly one matching System-PKI policy; unknown
            policies are forbidden.
  - name: origin-populations
    match:
      any:
      - resources:
          kinds:
          - ConfigMap
          names:
          - verification-bundle
          namespaces:
          - verification
    validate:
      failureAction: Enforce
      cel:
        variables: *id001
        expressions:
        - expression: >-
            variables.objects.filter(o, o.kind == 'ClientTrafficPolicy').size() == (variables.public ? 2 : 1) &&
            variables.objects.filter(o, o.kind == 'ClientTrafficPolicy' && o.metadata.namespace == 'gateway' &&
            o.metadata.name == 'private-origin').size() == 1 &&
            variables.objects.filter(o, o.kind == 'ClientTrafficPolicy' && o.metadata.namespace == 'gateway' &&
            o.metadata.name == 'public-origin').size() == (variables.public ? 1 : 0)
          message: Independent entry traffic policies must be complete.
  - name: gateway-populations
    match:
      any:
      - resources:
          kinds:
          - ConfigMap
          names:
          - verification-bundle
          namespaces:
          - verification
    validate:
      failureAction: Enforce
      cel:
        variables: *id001
        expressions:
        - expression: >-
            ['Gateway', 'EnvoyProxy'].all(k, variables.objects.filter(o, o.kind == k).size() ==
            (variables.public ? 2 : 1) && variables.objects.filter(o, o.kind == k &&
            o.metadata.name == 'household' && o.metadata.namespace == 'gateway').size() == 1 &&
            variables.objects.filter(o, o.kind == k && o.metadata.name == 'household-public' &&
            o.metadata.namespace == 'gateway').size() == (variables.public ? 1 : 0))
          message: Private Gateway and public-only data plane populations must match configured entries exactly.
        - expression: >-
            variables.objects.filter(o, o.kind == 'GatewayClass' && o.metadata.name == 'envoy').size()
            == 1 && variables.objects.filter(o, o.kind == 'Deployment' && o.metadata.name == 'envoy-gateway'
            && o.metadata.namespace == 'gateway').size() == 1 && variables.objects.filter(o, o.kind ==
            'ConfigMap' && o.metadata.name == 'envoy-gateway-config' && o.metadata.namespace == 'gateway').size()
            == 1
          message: Gateway controller/class/configuration populations must be complete.
  - name: backend-exact-isolation
    match:
      any:
      - resources:
          kinds:
          - ConfigMap
          names:
          - verification-bundle
          namespaces:
          - verification
    validate:
      failureAction: Enforce
      cel:
        variables: *id001
        expressions:
        - expression: >-
            variables.isolation.size() == variables.managed.size() && variables.managed.all(n, variables.isolation.filter(p,
            p.metadata.name == 'gateway-' + n + '-backend-ingress').size() == 1)
          message: Each Gateway-managed route must retain its exact backend isolation policy;
            backend-owned port-specific ingress must not acquire an all-port Gateway policy.
  - name: provisioning-serviceaccount
    match:
      any:
      - resources:
          kinds:
          - ServiceAccount
          names:
          - kanidm-provision
    validate:
      failureAction: Enforce
      cel:
        expressions:
        - expression: object.metadata.namespace == 'identity' && object.automountServiceAccountToken ==
            false
          message: provisioning serviceaccount
  - name: provisioning-rbac-postsync
    match:
      any:
      - resources:
          kinds:
          - Job
          names:
          - kanidm-provision
    validate:
      failureAction: Enforce
      cel:
        expressions:
        - expression: >-
            object.metadata.namespace == 'identity' && object.metadata.annotations['argocd.argoproj.io/hook']
            == 'PostSync' && object.spec.template.spec.serviceAccountName == 'kanidm-provision'
          message: provisioning rbac postsync
  - name: provisioning-secret-role
    match:
      any:
      - resources:
          kinds:
          - Role
          names:
          - kanidm-client-secret-*
    validate:
      failureAction: Enforce
      cel:
        expressions:
        - expression: >-
            object.rules == [{'apiGroups':[''], 'resources':['secrets'], 'resourceNames':[object.metadata.name.substring(21)],
            'verbs':['get', 'patch']}]
          message: provisioning secret role
  - name: provisioning-secret-binding
    match:
      any:
      - resources:
          kinds:
          - RoleBinding
          names:
          - kanidm-client-secret-*
    validate:
      failureAction: Enforce
      cel:
        expressions:
        - expression: >-
            object.roleRef.apiGroup == 'rbac.authorization.k8s.io' && object.roleRef.kind == 'Role'
            && object.roleRef.name == object.metadata.name && object.subjects == [{'kind':'ServiceAccount', 'name':'kanidm-provision', 'namespace':'identity'}]
          message: provisioning secret binding
  - name: administrator-membership
    match:
      any:
      - resources:
          kinds:
          - ConfigMap
          names:
          - kanidm-provision
          namespaces:
          - identity
    context:
    - &id002
      name: facts
      apiCall:
        # Use the ordinary Namespace collection: the pinned offline client
        # misparses named Namespace GETs as a namespaced-resource prefix.
        urlPath: /api/v1/namespaces
        jmesPath: "items[?metadata.name == 'policy-facts'].metadata.annotations | [0]"
    - name: members
      variable:
        jmesPath: parse_json(request.object.data."members.json")
    - name: state
      variable:
        jmesPath: parse_json(request.object.data."state.json")
    - name: expectedMembers
      variable:
        jmesPath: (facts.identityPhase == 'normal' && sort(keys(state.persons))) || `[]`
    validate:
      failureAction: Enforce
      message: administrator membership
      deny:
        conditions:
          any:
          - key: '{{ members }}'
            operator: NotEquals
            value: '{{ expectedMembers }}'
  - name: identity-data-deployment
    match:
      any:
      - resources:
          kinds:
          - Deployment
          names:
          - kanidm
          namespaces:
          - identity
    validate:
      failureAction: Enforce
      cel:
        expressions:
        - expression: >-
            object.spec.template.spec.volumes.exists(v, v.name == 'data' && v.persistentVolumeClaim.claimName
            == 'identity-kanidm') && object.spec.template.spec.containers.exists(c, c.name == 'kanidm'
            && c.volumeMounts.exists(m, m.name == 'data' && m.mountPath == '/data'))
          message: identity data deployment
  - name: identity-data-claim
    match:
      any:
      - resources:
          kinds:
          - PersistentVolumeClaim
          names:
          - identity-kanidm
          namespaces:
          - identity
    validate:
      failureAction: Enforce
      cel:
        expressions:
        - expression: object.spec.volumeName == 'identity-kanidm'
          message: identity data claim
  - name: identity-data-volume
    match:
      any:
      - resources:
          kinds:
          - PersistentVolume
          names:
          - identity-kanidm
    validate:
      failureAction: Enforce
      cel:
        expressions:
        - expression: >-
            object.spec.local.path == params.metadata.annotations.identityKanidmGuestPath && object.spec.claimRef.name
            == 'identity-kanidm' && object.spec.claimRef.namespace == 'identity'
          message: identity data volume
        paramKind:
          apiVersion: v1
          kind: Namespace
        paramRef:
          name: policy-facts
          parameterNotFoundAction: Deny
  - name: identity-backup-absent
    match:
      any:
      - resources:
          kinds:
          - ConfigMap
          names:
          - kanidm-config
          namespaces:
          - identity
    validate:
      failureAction: Enforce
      cel:
        expressions:
        - expression: >-
            !object.data['server.toml'].contains('[online_backup]') && !object.data['server.toml'].contains('schedule
            =') && !object.data['server.toml'].contains('versions =')
          message: identity backup absent
  - name: oidc-backend
    match:
      any:
      - resources:
          kinds:
          - Backend
          names:
          - kanidm-oidc
    validate:
      failureAction: Enforce
      cel:
        expressions:
        - expression: >-
            object.metadata.namespace == 'identity' && object.spec.endpoints == [{'fqdn':{'hostname':dyn('kanidm.identity.svc.cluster.local'),
            'port':dyn(443)}}]
          message: oidc backend
  - name: oidc-system-pki
    match:
      any:
      - resources:
          kinds:
          - BackendTLSPolicy
          names:
          - kanidm-oidc-tls
    validate:
      failureAction: Enforce
      cel:
        expressions:
        - expression: >-
            object.metadata.namespace == 'identity' && object.spec.targetRefs == [{'group':'gateway.envoyproxy.io',
            'kind':'Backend', 'name':'kanidm-oidc'}] && object.spec.validation == {'hostname':dyn(params.metadata.annotations['route.idm.backendHostname']),
            'wellKnownCACertificates':dyn('System')}
          message: oidc system pki
        paramKind:
          apiVersion: v1
          kind: Namespace
        paramRef:
          name: policy-facts
          parameterNotFoundAction: Deny
  - name: oidc-reference-grant
    match:
      any:
      - resources:
          kinds:
          - ReferenceGrant
          names:
          - gateway-oidc-backend
    validate:
      failureAction: Enforce
      cel:
        expressions:
        - expression: >-
            object.metadata.namespace == 'identity' && object.spec.from == [{'group':'gateway.envoyproxy.io',
            'kind':'SecurityPolicy', 'namespace':'gateway'}] && object.spec.to == [{'group':'gateway.envoyproxy.io',
            'kind':'Backend', 'name':'kanidm-oidc'}]
          message: oidc reference grant
  - name: provisioner-system-pki
    match:
      any:
      - resources:
          kinds:
          - Job
          names:
          - kanidm-provision
          namespaces:
          - identity
    validate:
      failureAction: Enforce
      cel:
        expressions:
        - expression: >-
            object.spec.template.spec.volumes.all(v, v.name != 'trust') && object.spec.template.spec.containers.all(c,
            (!has(c.env) || c.env.all(e, !(e.name in ['SSL_CERT_FILE', 'CURL_CA_BUNDLE']))) && (!has(c.volumeMounts)
            || c.volumeMounts.all(m, m.name != 'trust')))
          message: provisioner system pki
  - name: route-inventory
    match:
      any:
      - resources:
          kinds:
          - HTTPRoute
          names: &id003
          - argocd
          - grafana
          - radarr
          - sonarr
          - prowlarr
          - sabnzbd
          - requests
          - jellyfin
          - idm
          - home
          namespaces:
          - gateway
    context:
    - *id002
    - name: routeHosts
      variable:
        jmesPath: parse_json(facts."route.{{ request.object.metadata.name }}.hostnames")
    - name: routeNamespace
      variable:
        jmesPath: facts."route.{{ request.object.metadata.name }}.namespace"
    - name: routeService
      variable:
        jmesPath: facts."route.{{ request.object.metadata.name }}.service"
    - name: routePort
      variable:
        jmesPath: to_number(facts."route.{{ request.object.metadata.name }}.port")
    - name: routePath
      variable:
        jmesPath: facts."route.{{ request.object.metadata.name }}.pathPrefix"
    - name: routeParents
      variable:
