apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verification-transport
  annotations:
    pod-policies.kyverno.io/autogen-controllers: none
spec:
  background: false
  rules:
    - name: complete-original-transport
      match:
        any:
          - resources:
              kinds: [ConfigMap]
              names: [verification-bundle]
              namespaces: [verification]
      validate:
        failureAction: Enforce
        cel:
          variables:
            - name: bundle
              expression: object.bundle
            - name: files
              expression: variables.bundle.files.map(f, string(f))
            - name: resourceFiles
              expression: variables.bundle.resources.map(r, string(r.file))
          # Keep the raw corpus intact. In 1.19.2 the legacy dyn tracker charges
          # every membership call for its whole nested argument. Typed filename
          # lists keep inventory joins on names, not repeated raw-resource walks;
          # exists short-circuits only the nonempty test. Each validation below
          # retains its complete population and the upstream cost limit.
          expressions:
            - expression: >-
                variables.bundle.resources.exists(r, true) && variables.files.size() > 0 &&
                variables.bundle.bootstrap.exists(r, true) && variables.bundle.directories.size() > 0 &&
                variables.bundle.expected.repository != '' && variables.bundle.expected.revision != '' &&
                variables.bundle.expected.prefix != '' && variables.bundle.expected.project != '' &&
                variables.bundle.expected.destination != '' && variables.bundle.builtinScopes.size() > 0
              message: Complete original resources, independent inventory, bootstrap provenance and evaluated facts are required.
            - expression: >-
                variables.bundle.resources.all(r, r.file in variables.files && r.document >= 0 &&
                  r.content != '' && has(r.object.apiVersion) && has(r.object.kind) &&
                  has(r.object.metadata.name) && r.object.metadata.name != '')
              message: Every original resource requires its source file, document index, content and identity.
            - expression: >-
                variables.files.all(f, f in variables.resourceFiles || f == '.revision')
              message: Every original file must supply a checked resource unless it is the revision marker.
