apiVersion: v1
kind: Pod
metadata:
  name: credential-reader
  namespace: verification
spec:
  securityContext:
    runAsUser: 1000
    runAsGroup: 3000
  containers:
  - name: reader
    image: registry.k8s.io/pause:3.10
    volumeMounts:
    - name: credential
      mountPath: /credential
  volumes:
  - name: credential
    projected:
      sources:
      - serviceAccountToken:
          path: token
      defaultMode: 0
  restartPolicy: Never
