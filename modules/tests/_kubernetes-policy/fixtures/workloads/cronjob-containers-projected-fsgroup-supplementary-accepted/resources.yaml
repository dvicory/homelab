apiVersion: batch/v1
kind: CronJob
metadata:
  name: credential-reader
  namespace: verification
spec:
  jobTemplate:
    spec:
      template:
        spec:
          securityContext:
            runAsUser: 1000
            runAsGroup: 3000
            fsGroup: 2000
          containers:
          - name: reader
            image: registry.k8s.io/pause:3.10
            volumeMounts:
            - name: credential
              mountPath: /credential
          volumes:
          - name: credential
            projected:
              sources:
              - secret:
                  name: fixture-password
                  items:
                  - key: password
                    path: password
              defaultMode: 256
          restartPolicy: Never
  schedule: 0 * * * *
