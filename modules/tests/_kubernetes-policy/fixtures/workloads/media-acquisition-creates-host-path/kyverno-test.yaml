    name: sabnzbd
    namespace: media
  result: pass
- policy: verification-workloads
  rule: media-acquisition-mounts
  resources: []
  resourceSpecs:
  - group: apps
    version: v1
    kind: Deployment
    name: sabnzbd
    namespace: media
  result: fail
- policy: verification-workloads
  rule: media-acquisition-identity
  resources: []
  resourceSpecs:
  - group: apps
    version: v1
    kind: Deployment
    name: sabnzbd
    namespace: media
