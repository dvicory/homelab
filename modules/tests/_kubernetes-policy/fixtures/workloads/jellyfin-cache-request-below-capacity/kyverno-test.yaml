    version: v1
    kind: Deployment
    name: jellyfin
    namespace: jellyfin
  result: pass
- policy: verification-workloads
  rule: jellyfin-runtime
  resources: []
  resourceSpecs:
  - group: apps
    version: v1
    kind: Deployment
    name: jellyfin
    namespace: jellyfin
  result: pass
- policy: verification-workloads
  rule: jellyfin-provisioner
  resources: []
  resourceSpecs:
  - group: apps
    version: v1
    kind: Deployment
    name: jellyfin
    namespace: jellyfin
  result: pass
- policy: verification-workloads
  rule: jellyfin-media
  resources: []
  resourceSpecs:
  - group: apps
    version: v1
    kind: Deployment
    name: jellyfin
    namespace: jellyfin
  result: pass
- policy: verification-workloads
  rule: jellyfin-cache
  resources: []
  resourceSpecs:
  - group: apps
    version: v1
    kind: Deployment
    name: jellyfin
    namespace: jellyfin
  result: fail
- policy: verification-workloads
  rule: jellyfin-runtime-credentials
  resources: []
  resourceSpecs:
  - group: apps
    version: v1
    kind: Deployment
    name: jellyfin
    namespace: jellyfin
  result: pass
