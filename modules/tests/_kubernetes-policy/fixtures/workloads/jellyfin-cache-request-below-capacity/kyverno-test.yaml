  annotations:
    verification.homelab/variant: normal-ready-trustedEdges
policies:
- ../../../workloads.yaml
resources:
- resources.yaml
paramResources:
- ../policy-facts.yaml
results:
- policy: verification-workloads
  rule: pod-secret-readable
  resources: []
  resourceSpecs:
  - group: apps
    version: v1
    kind: Deployment
    name: jellyfin
    namespace: jellyfin
  result: pass
- policy: verification-workloads
  rule: pod-pvc-no-fsgroup
  resources: []
  resourceSpecs:
