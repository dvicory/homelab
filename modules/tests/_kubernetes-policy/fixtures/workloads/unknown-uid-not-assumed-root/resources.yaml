apiVersion: v1
kind: Pod
metadata:
  name: credential-reader
  namespace: verification
spec:
  securityContext:
    runAsGroup: 3000
  containers:
  - name: reader
    image: registry.k8s.io/pause:3.10
    volumeMounts:
    - name: credential
      mountPath: /credential
  volumes:
  - name: credential
    secret:
      secretName: fixture-password
      items:
      - key: password
        path: password
      defaultMode: 256
  restartPolicy: Never
