apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: jellarr-configuration-key-empty-admission
  annotations:
    verification.homelab/variant: normal-ready-trustedEdges
policies:
- ../../../workloads.yaml
resources:
- resources.yaml
paramResources:
- ../policy-facts.yaml
results:
- policy: verification-workloads
  rule: jellyfin-runtime-credentials
  resources: []
  resourceSpecs:
  - group: ''
    version: v1
    kind: ConfigMap
    name: jellarr-configuration
    namespace: jellyfin
  result: pass
- policy: verification-workloads
  rule: jellyfin-configuration-no-startup
  resources: []
  resourceSpecs:
  - group: ''
    version: v1
    kind: ConfigMap
    name: jellarr-configuration
    namespace: jellyfin
  result: fail
