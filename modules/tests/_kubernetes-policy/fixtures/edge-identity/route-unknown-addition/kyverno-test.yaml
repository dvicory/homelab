apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: route-unknown-addition
  annotations:
    verification.homelab/variant: normal-ready-trustedEdges
policies:
- ../../../edge-identity.yaml
resources:
- resources.yaml
paramResources:
- policy-facts.yaml
results:
- policy: edge-identity
  rule: route-population
  resources: []
  resourceSpecs:
  - group: ''
    version: v1
    kind: ConfigMap
    name: verification-bundle
    namespace: verification
  result: fail
- policy: edge-identity
  rule: route-domain-placement
  resources: []
  resourceSpecs:
  - group: gateway.networking.k8s.io
    version: v1
    kind: HTTPRoute
    name: unknown
    namespace: gateway
  result: fail
- policy: edge-identity
  rule: route-service-grant-joins
  resources: []
  resourceSpecs:
  - group: ''
    version: v1
    kind: ConfigMap
    name: verification-bundle
    namespace: verification
  result: fail
