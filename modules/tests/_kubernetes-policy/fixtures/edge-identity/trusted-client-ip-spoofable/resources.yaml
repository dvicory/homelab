apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: trusted-edges
  namespace: gateway
spec:
  clientIPDetection:
    xForwardedFor:
      numTrustedHops: 1
  headers:
    requestID: PreserveOrGenerate
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: household
