# Native Kyverno scenarios for this policy family. transport.py generate turns each scenario into a
# kyverno-test.yaml and, for single-object scenarios, a resources.yaml derived from the genuine render.
# Expected results are the declared fails plus Pass for every other in-scope rule that applies, as listed
# by the explicit complete-population positive below. Identities are apiVersion/kind/namespace/name.
policy: verification-workloads
policyFile: workloads.yaml
rules:
  admission-candidates: [pod-secret-readable, pod-pvc-no-fsgroup, jellyfin-runtime, jellyfin-provisioner, jellyfin-media,
    jellyfin-cache, jellyfin-retained-storage, jellyfin-runtime-credentials, jellyfin-configuration-job, jellyfin-configuration-no-startup,
    jellyfin-service-route, media-private-storage, media-acquisition-mounts, media-acquisition-identity, media-configuration-state,
    media-periodic-safety, media-storage-ingress]
  repository-only: [jellyfin-configuration-ingress, media-private-storage-bindings, media-configuration-inventory,
    media-periodic-inventory, media-storage-lifecycle, workload-population]
positive:
  name: complete-{variant}
  applies:
    apps/v1/Deployment/argocd/argocd-applicationset-controller: [pod-secret-readable, pod-pvc-no-fsgroup]
    apps/v1/Deployment/argocd/argocd-redis: [pod-secret-readable, pod-pvc-no-fsgroup]
    apps/v1/Deployment/argocd/argocd-repo-server: [pod-secret-readable, pod-pvc-no-fsgroup]
    apps/v1/Deployment/argocd/argocd-server: [pod-secret-readable, pod-pvc-no-fsgroup]
    apps/v1/Deployment/cert-manager/cert-manager: [pod-secret-readable, pod-pvc-no-fsgroup]
    apps/v1/Deployment/cert-manager/cert-manager-cainjector: [pod-secret-readable, pod-pvc-no-fsgroup]
    apps/v1/Deployment/cert-manager/cert-manager-webhook: [pod-secret-readable, pod-pvc-no-fsgroup]
    apps/v1/Deployment/gateway/envoy-gateway: [pod-secret-readable, pod-pvc-no-fsgroup]
    apps/v1/Deployment/identity/kanidm: [pod-secret-readable, pod-pvc-no-fsgroup]
    apps/v1/Deployment/jellyfin/jellyfin: [pod-secret-readable, pod-pvc-no-fsgroup, jellyfin-runtime, jellyfin-provisioner,
      jellyfin-media, jellyfin-cache, jellyfin-runtime-credentials]
    apps/v1/Deployment/local-path-storage/local-path-provisioner: [pod-secret-readable, pod-pvc-no-fsgroup]
    apps/v1/Deployment/media/prowlarr: [pod-secret-readable, pod-pvc-no-fsgroup]
    apps/v1/Deployment/media/radarr: [pod-secret-readable, pod-pvc-no-fsgroup, media-acquisition-mounts]
    apps/v1/Deployment/media/sabnzbd: [pod-secret-readable, pod-pvc-no-fsgroup, media-acquisition-mounts, media-acquisition-identity]
    apps/v1/Deployment/media/sonarr: [pod-secret-readable, pod-pvc-no-fsgroup, media-acquisition-mounts]
    apps/v1/StatefulSet/argocd/argocd-application-controller: [pod-secret-readable, pod-pvc-no-fsgroup]
    apps/v1/StatefulSet/media/seerr: [pod-secret-readable, pod-pvc-no-fsgroup]
    batch/v1/CronJob/media/media-config-seerr: [pod-secret-readable, pod-pvc-no-fsgroup, media-configuration-state,
      media-periodic-safety]
    batch/v1/CronJob/media/media-configarr: [pod-secret-readable, pod-pvc-no-fsgroup, media-configuration-state,
      media-periodic-safety]
    batch/v1/Job/argocd/argocd-redis-secret-init: [pod-secret-readable, pod-pvc-no-fsgroup]
    batch/v1/Job/gateway/envoy-gateway-gateway-helm-certgen: [pod-secret-readable, pod-pvc-no-fsgroup]
    batch/v1/Job/jellyfin/jellyfin-configuration: [pod-secret-readable, pod-pvc-no-fsgroup, jellyfin-configuration-job]
    batch/v1/Job/local-path-storage/retained-directories: [pod-secret-readable, pod-pvc-no-fsgroup]
    batch/v1/Job/media/media-config-seerr: [pod-secret-readable, pod-pvc-no-fsgroup, media-configuration-state]
    batch/v1/Job/media/media-configarr: [pod-secret-readable, pod-pvc-no-fsgroup, media-configuration-state]
    gateway.networking.k8s.io/v1/HTTPRoute/gateway/jellyfin: [jellyfin-service-route]
    networking.k8s.io/v1/NetworkPolicy/jellyfin/media-jellyfin-ingress: [media-storage-ingress]
    v1/ConfigMap/jellyfin/jellarr-configuration: [jellyfin-runtime-credentials, jellyfin-configuration-no-startup]
    v1/ConfigMap/verification/verification-bundle: [jellyfin-configuration-ingress, media-private-storage-bindings,
      media-configuration-inventory, media-periodic-inventory, media-storage-lifecycle, workload-population]
    v1/PersistentVolume//identity-kanidm: [media-private-storage]
    v1/PersistentVolume//jellyfin-config: [jellyfin-retained-storage, media-private-storage]
    v1/PersistentVolume//media-prowlarr: [media-private-storage]
    v1/PersistentVolume//media-radarr: [media-private-storage]
    v1/PersistentVolume//media-sabnzbd: [media-private-storage]
    v1/PersistentVolume//media-seerr: [media-private-storage]
    v1/PersistentVolume//media-seerr-configuration: [media-private-storage]
    v1/PersistentVolume//media-sonarr: [media-private-storage]
    v1/PersistentVolumeClaim/jellyfin/jellyfin-config: [jellyfin-retained-storage]
    v1/Service/jellyfin/jellyfin: [jellyfin-service-route]
  when:
  - if: {identity: [normal, provisioning]}
    applies:
      batch/v1/Job/identity/kanidm-provision: [pod-secret-readable, pod-pvc-no-fsgroup]
objects:
  credential-reader-pod:
    applies: [pod-secret-readable, pod-pvc-no-fsgroup]
    object:
      apiVersion: v1
      kind: Pod
      metadata:
        name: credential-reader
        namespace: verification
      spec:
        securityContext:
          runAsUser: 1000
          runAsGroup: 3000
        containers:
        - name: reader
          image: registry.k8s.io/pause:3.10
          volumeMounts:
          - name: credential
            mountPath: /credential
        volumes:
        - name: credential
          secret:
            secretName: fixture-password
            items:
            - key: password
              path: password
            defaultMode: 420
        - name: retained
          persistentVolumeClaim:
            claimName: fixture-retained
        restartPolicy: Never
  credential-reader-deployment:
    applies: [pod-secret-readable, pod-pvc-no-fsgroup]
    object:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: credential-reader
        namespace: verification
      spec:
        template:
          spec:
            securityContext:
              runAsUser: 1000
              runAsGroup: 3000
            containers:
            - name: reader
              image: registry.k8s.io/pause:3.10
              volumeMounts:
              - name: credential
                mountPath: /credential
            volumes:
            - name: credential
              projected:
                sources:
                - secret:
                    name: fixture-password
                    items:
                    - key: password
                      path: password
                defaultMode: 256
            restartPolicy: Always
          metadata:
            labels:
              app: credential-reader
        selector:
          matchLabels:
            app: credential-reader
  credential-reader-cronjob:
    applies: [pod-secret-readable, pod-pvc-no-fsgroup]
    object:
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: credential-reader
        namespace: verification
      spec:
        jobTemplate:
          spec:
            template:
              spec:
                securityContext:
                  runAsUser: 1000
                  runAsGroup: 3000
                containers:
                - name: reader
                  image: registry.k8s.io/pause:3.10
                  volumeMounts:
                  - name: credential
                    mountPath: /credential
                volumes:
                - name: credential
                  projected:
                    sources:
                    - secret:
                        name: fixture-password
                        items:
                        - key: password
                          path: password
                    defaultMode: 256
                restartPolicy: Never
        schedule: 0 * * * *
  jellyfin-admin:
    applies: [jellyfin-runtime-credentials]
    object:
      apiVersion: v1
      kind: Secret
      metadata:
        name: jellyfin-admin
        namespace: jellyfin
      stringData:
        password: fixture-only
  media-host-namespace:
    applies: [media-private-storage]
    object:
      apiVersion: v1
      kind: PersistentVolume
      metadata:
        name: media-host-namespace
      spec:
        local:
          path: /srv/media/data/library
scenarios:
- name: pod-containers-secret-0400-denied
  object: credential-reader-pod
  mutate: del(.spec.volumes[1]) | .spec.volumes[0].secret.defaultMode = 256
  fail: [pod-secret-readable]
- name: pod-containers-secret-fsgroup-supplementary-accepted
  object: credential-reader-pod
  mutate: .spec.securityContext.fsGroup = 2000 | del(.spec.volumes[1]) | .spec.volumes[0].secret.defaultMode = 256
- name: pod-containers-projected-0400-denied
  object: credential-reader-pod
  mutate: '.spec.volumes = [{"name": "credential", "projected": {"sources": [{"secret": {"name": "fixture-password",
    "items": [{"key": "password", "path": "password"}]}}], "defaultMode": 256}}]'
  fail: [pod-secret-readable]
- name: pod-containers-projected-fsgroup-supplementary-accepted
