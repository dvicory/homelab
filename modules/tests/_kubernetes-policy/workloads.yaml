        - expression: '[''Job'',''CronJob''].all(kind, [''media-configarr'',''media-config-seerr''].all(name, variables.mediaJobs.filter(j,
            j.kind == kind && j.metadata.name == name && j.metadata.namespace == ''media'').size() == 1))'
