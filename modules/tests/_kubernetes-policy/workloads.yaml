        - name: mediaJobs
          expression: variables.mediaJobEntries.map(r, r.object)
        - name: children
          expression: variables.bundle.resources.filter(r, r.file.startsWith('apps/') && r.object.apiVersion
            == 'argoproj.io/v1alpha1' && r.object.kind == 'Application').map(r, r.object)
        - name: mediaOwnership
          expression: >-
            variables.mediaJobEntries.map(e, {'entry':dyn(e), 'owners':dyn(variables.children.filter(a,
            e.file.startsWith(a.spec.source.path.substring(variables.bundle.expected.prefix.size()) + '/')
            && ((has(a.spec.source.directory) && has(a.spec.source.directory.recurse) && a.spec.source.directory.recurse)
            || !e.file.substring(a.spec.source.path.substring(variables.bundle.expected.prefix.size()).size()+1).contains('/'))))})
        - name: mediaJobPods
          expression: >-
            variables.mediaOwnership.map(x, {'name':dyn(x.entry.object.metadata.name),
            'namespace':dyn(has(x.entry.object.metadata.namespace) && x.entry.object.metadata.namespace != ''
            ? x.entry.object.metadata.namespace : (x.owners.size() == 1 ? x.owners[0].spec.destination.namespace : '')),
            'pod':dyn(x.entry.object.kind == 'CronJob' ? x.entry.object.spec.jobTemplate.spec.template.spec
            : x.entry.object.spec.template.spec), 'bootstrap':dyn(x.entry.object.kind == 'Job'
