apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: runtime-secret-initial-exact-ack
  labels:
    verification.homelab/layer: runtime-secret-api
spec:
  steps:
    - name: initial-exact-ack
      try:
        - script:
            shell: bash
            shellArgs: ["-c"]
            timeout: 90s
            content: |
              . "$(jq -er '.secret.helper' "$FIXTURE_SETTINGS")"
              secret_prepare secret-initial-exact-ack
              secret_baseline
              secret_exec "$SECRET_BIN/stat" -c %a "$SECRET_STATE" | jq -e '. == 700' >/dev/null
              secret_exec "$SECRET_BIN/stat" -c %a "$SECRET_STATE/owned" "$SECRET_STATE/applied-generation" | jq -s -e 'all(.[]; . == 600)' >/dev/null
              # A stale/missing ACK is not accepted merely because the Secret exists.
              printf '%s\n' stale > "$SECRET_CASE/stale-ack"
              secret_copy "$SECRET_CASE/stale-ack" "$SECRET_STATE/applied-generation"
              if secret_ack "$SECRET_INITIAL_GENERATION"; then exit 1; fi
              secret_run
              secret_ack "$SECRET_INITIAL_GENERATION"
