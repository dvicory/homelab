apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: runtime-secret-malformed-owned-inventory
  labels:
    verification.homelab/layer: runtime-secret-api
spec:
  steps:
    - name: malformed-owned-inventory
      try:
        - script:
            shell: bash
            shellArgs: ["-c"]
            timeout: 90s
            content: |
              . "$(jq -er '.secret.helper' "$FIXTURE_SETTINGS")"
              secret_prepare secret-malformed-owned-inventory
              secret_baseline
              secret_stage "$SECRET_CASE/desired.json"
              printf 'malformed\tinventory\n' > "$SECRET_CASE/malformed-owned"
              secret_copy "$SECRET_CASE/malformed-owned" "$SECRET_STATE/owned"
              secret_refused_without_mutation
