apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: runtime-secret-stale-desired-inventory
  labels:
    verification.homelab/layer: runtime-secret-api
spec:
  steps:
    - name: stale-desired-inventory
      try:
        - script:
            shell: bash
            shellArgs: ["-c"]
            timeout: 90s
            content: |
              . "$(jq -er '.secret.helper' "$FIXTURE_SETTINGS")"
              secret_prepare secret-stale-desired-inventory
              secret_baseline
              secret_foreign
              cp "$SECRET_CASE/runtime-secrets.names" "$SECRET_CASE/initial-names"
              secret_stage "$SECRET_CASE/desired.json"
              secret_copy "$SECRET_CASE/initial-names" "$SECRET_ROOT/runtime-secrets.names"
              secret_refused_without_mutation
