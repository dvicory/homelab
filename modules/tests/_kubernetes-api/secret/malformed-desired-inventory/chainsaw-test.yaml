apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: runtime-secret-malformed-desired-inventory
  labels:
    verification.homelab/layer: runtime-secret-api
spec:
  steps:
    - name: malformed-desired-inventory
      try:
        - script:
            shell: bash
            shellArgs: ["-c"]
            timeout: 90s
            content: |
              . "$(jq -er '.secret.helper' "$FIXTURE_SETTINGS")"
              secret_prepare secret-malformed-desired-inventory
              secret_baseline
              secret_foreign
              printf '%s\tshared\tOpaque\tmalformed key\n' "$SECRET_NAMESPACE" > "$SECRET_CASE/malformed-names"
              secret_stage "$SECRET_CASE/desired.json" "$SECRET_CASE/malformed-names"
              secret_refused_without_mutation
