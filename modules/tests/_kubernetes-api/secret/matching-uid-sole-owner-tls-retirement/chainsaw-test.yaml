apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: runtime-secret-matching-uid-sole-owner-tls-retirement
  labels:
    verification.homelab/layer: runtime-secret-api
spec:
  steps:
    - name: matching-uid-sole-owner-tls-retirement
      try:
        - script:
            shell: bash
            shellArgs: ["-c"]
            timeout: 90s
            content: |
              set -Eeuo pipefail
              # Numeric source locations only; never print commands or Secret values.
              trap 'printf "{\"errorLine\":%s,\"callerLine\":%s,\"outerLine\":%s}\n" "$LINENO" "${BASH_LINENO[0]:-0}" "${BASH_LINENO[1]:-0}" > "$FIXTURE_WORK/secret-failure.json"' ERR
              . "$(jq -er '.secret.helper' "$FIXTURE_SETTINGS")"
              secret_prepare secret-sole-tls
              jq '.items |= map(select(.metadata.name == "replaced"))' "$SECRET_CASE/initial.json" > "$SECRET_CASE/sole-tls.json"
              secret_stage "$SECRET_CASE/sole-tls.json"
              secret_run
              secret_ack "$SECRET_GENERATION"
              secret_get replaced > "$SECRET_CASE/tls-before.json"
              uid=$(jq -er '.metadata.uid' "$SECRET_CASE/tls-before.json")
              jq -e '[.metadata.managedFields[].manager] == ["homelab-runtime-secrets"]' "$SECRET_CASE/tls-before.json" >/dev/null
              secret_docker cp "$FIXTURE_SECRET:$SECRET_STATE/owned" "$SECRET_CASE/owned-before"
              printf '%s\treplaced\t%s\n' "$SECRET_NAMESPACE" "$uid" > "$SECRET_CASE/owned-expected"
              cmp "$SECRET_CASE/owned-before" "$SECRET_CASE/owned-expected"
              secret_stage "$SECRET_CASE/empty.json"
              secret_run
              secret_ack "$SECRET_GENERATION"
              secret_kubectl wait --for=delete secret/replaced -n "$SECRET_NAMESPACE" --timeout=30s
              secret_exec "$SECRET_BIN/test" ! -s "$SECRET_STATE/owned"
