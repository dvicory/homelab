apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: runtime-secret-fsgroup-readable
  labels:
    verification.homelab/layer: kubelet-secret-permissions
spec:
  steps:
    - name: actual-projected-file-access
      try:
        - script:
            shell: bash
            shellArgs: ["-c"]
            timeout: 120s
            content: |
              set -euo pipefail
              image=$(jq -er '.secret.readabilityImage' "$FIXTURE_SETTINGS")
              "$KUBECTL" --request-timeout=10s create namespace secret-fsgroup-readable
              "$KUBECTL" --request-timeout=10s create secret generic input -n secret-fsgroup-readable --from-literal=token=synthetic-token
              jq -n --arg image "$image" --arg command 'set -eu; test "$(id -u)" = 1000; test "$(id -g)" = 3000; case " $(id -G) " in *" 2000 "*) ;; *) exit 1;; esac; test "$(cat /secret/token)" = synthetic-token' '{
                apiVersion:"v1",kind:"Pod",metadata:{namespace:"secret-fsgroup-readable",name:"file-reader"},
                spec:{restartPolicy:"Never",automountServiceAccountToken:false,
                  securityContext:{runAsUser:1000,runAsGroup:3000,runAsNonRoot:true,fsGroup:2000},
                  containers:[{name:"reader",image:$image,imagePullPolicy:"Never",command:["/bin/sh","-ec",$command],
                    securityContext:{allowPrivilegeEscalation:false,capabilities:{drop:["ALL"]}},
                    volumeMounts:[{name:"input",mountPath:"/secret",readOnly:true}]}],
                  volumes:[{name:"input",projected:{defaultMode:420,sources:[{secret:{name:"input",items:[{key:"token",path:"token",mode:256}]}}]}}]
                }
              }' | "$KUBECTL" --request-timeout=10s apply -f -
              "$KUBECTL" --request-timeout=10s wait --for=jsonpath='{.status.phase}'=Succeeded pod/file-reader -n secret-fsgroup-readable --timeout=90s
        - assert:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: file-reader
                namespace: secret-fsgroup-readable
              status:
                phase: Succeeded
                containerStatuses:
                  - name: reader
                    state:
                      terminated:
                        exitCode: 0
