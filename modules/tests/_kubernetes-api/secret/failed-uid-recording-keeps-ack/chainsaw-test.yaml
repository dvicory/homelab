apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: runtime-secret-failed-uid-recording-keeps-ack
  labels:
    verification.homelab/layer: runtime-secret-api
spec:
  steps:
    - name: failed-uid-recording-keeps-ack
      try:
        - script:
            shell: bash
            shellArgs: ["-c"]
            timeout: 90s
            content: |
              . "$(jq -er '.secret.helper' "$FIXTURE_SETTINGS")"
              secret_prepare secret-failed-uid-recording-keeps-ack
              secret_baseline
              secret_foreign
              printf '%s\tghost\tOpaque\tkey\n%s\tshared\tOpaque\tsource-one\n' "$SECRET_NAMESPACE" "$SECRET_NAMESPACE" > "$SECRET_CASE/ghost-names"
              secret_stage "$SECRET_CASE/desired.json" "$SECRET_CASE/ghost-names"
              if secret_ack "$SECRET_GENERATION"; then exit 1; fi
              if secret_run; then echo 'Missing UID recording accepted' >&2; exit 1; fi
              secret_get shared | jq -e '.data["source-one"] == "dXBkYXRlZA=="' >/dev/null
              secret_ack "$SECRET_INITIAL_GENERATION"
              if secret_ack "$SECRET_GENERATION"; then exit 1; fi
              secret_docker cp "$FIXTURE_SECRET:$SECRET_STATE/owned" "$SECRET_CASE/owned-after"
              cmp "$SECRET_CASE/owned-original" "$SECRET_CASE/owned-after"
              secret_exec "$(jq -er '.secret.find' "$FIXTURE_SETTINGS")" "$SECRET_STATE" -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort > "$SECRET_CASE/state-files"
              printf 'applied-generation\nowned\n' > "$SECRET_CASE/expected-state-files"
              cmp "$SECRET_CASE/state-files" "$SECRET_CASE/expected-state-files"
