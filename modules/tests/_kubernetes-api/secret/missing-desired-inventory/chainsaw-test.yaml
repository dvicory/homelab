apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: runtime-secret-missing-desired-inventory
  labels:
    verification.homelab/layer: runtime-secret-api
spec:
  steps:
    - name: missing-desired-inventory
      try:
        - script:
            shell: bash
            shellArgs: ["-c"]
            timeout: 90s
            content: |
              . "$(jq -er '.secret.helper' "$FIXTURE_SETTINGS")"
              secret_prepare secret-missing-desired-inventory
              secret_baseline
              secret_stage "$SECRET_CASE/desired.json"
              secret_exec "$SECRET_BIN/rm" "$SECRET_ROOT/runtime-secrets.names"
              secret_refused_without_mutation
