apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: runtime-secret-matching-uid-shared-owner-tls-retirement
  labels:
    verification.homelab/layer: runtime-secret-api
spec:
  steps:
    - name: matching-uid-shared-owner-tls-retirement
      try:
        - script:
            shell: bash
            shellArgs: ["-c"]
            timeout: 90s
            content: |
              . "$(jq -er '.secret.helper' "$FIXTURE_SETTINGS")"
              secret_prepare secret-shared-tls
              jq '.items |= map(select(.metadata.name == "replaced") | .data.managed = "bWFuYWdlZA==")' "$SECRET_CASE/initial.json" > "$SECRET_CASE/shared-tls.json"
              secret_stage "$SECRET_CASE/shared-tls.json"
              secret_run
              secret_ack "$SECRET_GENERATION"
              secret_get replaced > "$SECRET_CASE/tls-before.json"
              uid=$(jq -er '.metadata.uid' "$SECRET_CASE/tls-before.json")
              jq '.items |= map(select(.metadata.name == "replaced") | .data.application = "YXBw")' "$SECRET_CASE/initial.json" > "$SECRET_CASE/application-tls.json"
              secret_apply "$SECRET_CASE/application-tls.json"
              secret_get replaced | jq -e '[.metadata.managedFields[].manager] | index("homelab-runtime-secrets") != null and index("application") != null' >/dev/null
              secret_docker cp "$FIXTURE_SECRET:$SECRET_STATE/owned" "$SECRET_CASE/owned-before"
              printf '%s\treplaced\t%s\n' "$SECRET_NAMESPACE" "$uid" > "$SECRET_CASE/owned-expected"
              cmp "$SECRET_CASE/owned-before" "$SECRET_CASE/owned-expected"
              secret_stage "$SECRET_CASE/empty.json"
              secret_run
              secret_ack "$SECRET_GENERATION"
              secret_get replaced | jq -e --arg uid "$uid" '.metadata.uid == $uid and .type == "kubernetes.io/tls" and .data == {"tls.crt":"Y2VydA==","tls.key":"a2V5",application:"YXBw"}' >/dev/null
              secret_exec "$SECRET_BIN/test" ! -s "$SECRET_STATE/owned"
