apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: runtime-secret-empty-generation-relinquishes-only-owned-fields
  labels:
    verification.homelab/layer: runtime-secret-api
spec:
  steps:
    - name: empty-generation-relinquishes-only-owned-fields
      try:
        - script:
            shell: bash
            shellArgs: ["-c"]
            timeout: 90s
            content: |
              . "$(jq -er '.secret.helper' "$FIXTURE_SETTINGS")"
              secret_prepare secret-empty-retirement
              secret_baseline
              secret_foreign
              secret_stage "$SECRET_CASE/desired.json"
              secret_run
              secret_stage "$SECRET_CASE/empty.json"
              if secret_ack "$SECRET_GENERATION"; then exit 1; fi
              secret_run
              secret_ack "$SECRET_GENERATION"
              secret_get shared | jq -e --arg uid "$SECRET_SHARED_UID" '.metadata.uid == $uid and .data == {application:"Zm9yZWlnbi12YWx1ZQ=="}' >/dev/null
              secret_get forged | jq -S . > "$SECRET_CASE/forged-after.json"
              cmp "$SECRET_CASE/forged-original.json" "$SECRET_CASE/forged-after.json"
              secret_get replaced | jq -S . > "$SECRET_CASE/replacement-after.json"
              cmp "$SECRET_CASE/replacement-original.json" "$SECRET_CASE/replacement-after.json"
              secret_exec "$SECRET_BIN/test" ! -s "$SECRET_STATE/owned"
