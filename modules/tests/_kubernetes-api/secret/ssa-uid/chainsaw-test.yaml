apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: runtime-secret-ssa-uid
  labels:
    verification.homelab/layer: runtime-secret-api
spec:
  steps:
    - name: ssa-uid
      try:
        - script:
            shell: bash
            shellArgs: ["-c"]
            timeout: 90s
            content: |
              . "$(jq -er '.secret.helper' "$FIXTURE_SETTINGS")"
              secret_prepare secret-ssa-uid
              secret_baseline
              secret_foreign
              secret_stage "$SECRET_CASE/desired.json"
              if secret_ack "$SECRET_GENERATION"; then exit 1; fi
              secret_run
              secret_ack "$SECRET_GENERATION"
              secret_get shared | jq -e --arg uid "$SECRET_SHARED_UID" '.metadata.uid == $uid and .type == "Opaque" and .data == {"source-one":"dXBkYXRlZA==",application:"Zm9yZWlnbi12YWx1ZQ=="}' >/dev/null
              secret_get replaced | jq -S . > "$SECRET_CASE/replacement-after.json"
              cmp "$SECRET_CASE/replacement-original.json" "$SECRET_CASE/replacement-after.json"
              secret_get forged | jq -S . > "$SECRET_CASE/forged-after.json"
              cmp "$SECRET_CASE/forged-original.json" "$SECRET_CASE/forged-after.json"
              printf '%s\tshared\t%s\n' "$SECRET_NAMESPACE" "$SECRET_SHARED_UID" > "$SECRET_CASE/owned-after-expected"
              secret_docker cp "$FIXTURE_SECRET:$SECRET_STATE/owned" "$SECRET_CASE/owned-after"
              cmp "$SECRET_CASE/owned-after-expected" "$SECRET_CASE/owned-after"
