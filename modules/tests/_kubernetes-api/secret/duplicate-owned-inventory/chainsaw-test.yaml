apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: runtime-secret-duplicate-owned-inventory
  labels:
    verification.homelab/layer: runtime-secret-api
spec:
  steps:
    - name: duplicate-owned-inventory
      try:
        - script:
            shell: bash
            shellArgs: ["-c"]
            timeout: 90s
            content: |
              . "$(jq -er '.secret.helper' "$FIXTURE_SETTINGS")"
              secret_prepare secret-duplicate-owned-inventory
              secret_baseline
              secret_stage "$SECRET_CASE/desired.json"
              cat "$SECRET_CASE/owned-original" "$SECRET_CASE/owned-original" > "$SECRET_CASE/duplicate-owned"
              secret_copy "$SECRET_CASE/duplicate-owned" "$SECRET_STATE/owned"
              secret_refused_without_mutation
