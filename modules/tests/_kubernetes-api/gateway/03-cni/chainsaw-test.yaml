apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: gateway-trusted-cni-source-boundary
spec:
  timeouts:
    exec: 600s
  steps:
    - name: apply-public-receiver-policy
      try:
        - script:
            content: exec gateway-case cni-prepare
    - name: wait-for-real-cni-negative-enforcement
      try:
        # Bound real negative enforcement at 120s.
        - script:
            timeout: 120s
            content: exec gateway-case cni-enforce
    - name: declared-transport-peer-allowed-stranger-denied
      try:
        - script:
            content: exec gateway-case cni-proof
    - name: proxy-v2-metadata-and-generated-request-id
      try:
        - script:
            content: exec gateway-case cni-forwarded
