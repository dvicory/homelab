name: Dependency-Track source-unit qualification
'on':
  push:
    branches:
    - security/dependency-track-oidc-qualification
permissions:
  actions: read
  contents: read
env:
  QUALIFIED_SOURCE: 79e9265a82a1d18c9f08d8179d838cefc7f00941
jobs:
  systemd:
    name: Actual systemd lifecycle and two-target import
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    steps:
    - name: Check out frozen source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ env.QUALIFIED_SOURCE }}
    - name: Enable available KVM
      run: |
        test -c /dev/kvm
        sudo chmod 666 /dev/kvm
    - name: Install Nix
      uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702
      with:
        github_access_token: ${{ github.token }}
    - name: Configure shared public caches
      run: |
        {
          printf 'NIX_CONFIG<<EOF\n%s\n' "${NIX_CONFIG:-}"
          nix eval --raw --file modules/nix/caches.nix --apply '
            module:
            let settings = module.flake.modules.generic.nix-common.nix.settings;
            in "extra-substituters = ${builtins.concatStringsSep " " settings.extra-substituters}\n"
             + "extra-trusted-public-keys = ${builtins.concatStringsSep " " settings.extra-trusted-public-keys}\n"
          '
          printf 'EOF\n'
        } >> "$GITHUB_ENV"
    - name: Exercise secretless source lifecycle in KVM
      run: |
        set -euo pipefail
        attr=checks.x86_64-linux.dependency-track-systemd
        export TEST_DERIVATION
        TEST_DERIVATION=$(nix eval --raw ".#${attr}.drvPath")
        export ACTUAL_SOURCE
        ACTUAL_SOURCE=$(git rev-parse HEAD)
        set +e
        nix build -L --option sandbox relaxed --no-link --print-out-paths ".#${attr}" 2>&1 | tee "$RUNNER_TEMP/dependency-track-systemd-build.log"
        status=${PIPESTATUS[0]}
        set -e
        export TEST_EXIT_CODE="$status"
        python3 - <<'PY'
        import json
        import os
        from pathlib import Path
        import sys

        root = Path(os.environ["RUNNER_TEMP"])
        status = int(os.environ["TEST_EXIT_CODE"])
        proof = {
            "schema": 1,
            "source": os.environ["ACTUAL_SOURCE"],
            "testDerivation": os.environ["TEST_DERIVATION"],
            "actualExitCode": status,
            "boundary": "Source NixOS check for actual units and stock K3s/DT/Postgres; secretless rejected acquisition, not successful inventory import",
        }
        (root / "dependency-track-systemd-result.json").write_text(json.dumps(proof, indent=2) + "\n")
        if proof["source"] != os.environ["QUALIFIED_SOURCE"] or status != 0:
            sys.exit("source lifecycle check failed")
        PY
    - name: Build exact standalone source driver
      run: |
        set -euo pipefail
        nix build --option sandbox relaxed --out-link "$RUNNER_TEMP/dependency-track-systemd-driver" \
          .#checks.x86_64-linux.dependency-track-systemd.driver
    - name: Complete actual source unit import with runtime file authority
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        runtime=$(mktemp -d "$RUNNER_TEMP/dependency-track-systemd-live.XXXXXX")
        trap 'rm -rf -- "$runtime"' EXIT
        mkdir -m 700 "$runtime/tmp" "$runtime/output"
        df -PT "$runtime"
        token_file="$runtime/github-token"
        (umask 077; printf '%s' "$GH_TOKEN" > "$token_file")
        chmod 400 "$token_file"
        unset GH_TOKEN
        set +e
        env -u GH_TOKEN -u GITHUB_TOKEN -u GH_ENTERPRISE_TOKEN \
          HOMELAB_DT_SYSTEMD_TOKEN_FILE="$token_file" \
          XDG_RUNTIME_DIR="$runtime/tmp" TMPDIR="$runtime/tmp" \
          /usr/bin/timeout --signal=INT --kill-after=60s 5400s \
          "$RUNNER_TEMP/dependency-track-systemd-driver/bin/nixos-test-driver" \
          --output_directory "$runtime/output" \
          2>&1 | tee "$RUNNER_TEMP/dependency-track-systemd-live.log"
        status=${PIPESTATUS[0]}
        set -e
        export LIVE_EXIT_CODE="$status"
        export LIVE_OUTPUT="$runtime/output"
        python3 - <<'PY'
        import hashlib
        import json
        import os
        from pathlib import Path
        import stat
        import sys

        root = Path(os.environ["RUNNER_TEMP"])
        status = int(os.environ["LIVE_EXIT_CODE"])
        proof = {"schema": 1, "source": os.environ["QUALIFIED_SOURCE"], "actualExitCode": status,
                 "boundary": "Standalone actual source-unit lifecycle with two admitted security-branch canary targets; no production enrollment"}
        if status == 0:
            source = Path(os.environ["LIVE_OUTPUT"]) / "systemd-live-observation.json"
            info = source.lstat()
            if not stat.S_ISREG(info.st_mode) or not 0 < info.st_size <= 1048576:
                sys.exit("bounded regular live observation missing")
            raw = source.read_bytes()
            observation = json.loads(raw)
            if (observation["scope"] != "isolated-security-branch-canary"
                    or set(observation["targets"]) != {"3ca171bb4d06a0d2584c981f", "cc64e08c1afb4776b4d587d4"}
                    or observation["unit"]["Result"] != "success" or observation["unit"]["ExecMainStatus"] != "0"):
                sys.exit("actual complete import observation missing")
            (root / "dependency-track-systemd-live-observation.json").write_bytes(raw)
            proof["observationSha256"] = hashlib.sha256(raw).hexdigest()
        (root / "dependency-track-systemd-live-result.json").write_text(json.dumps(proof, indent=2) + "\n")
        if status != 0:
            sys.exit("actual complete source-unit import failed")
        PY
    - name: Retain bounded unit proof, never VM disks or credentials
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: dependency-track-systemd-${{ github.run_id }}
        path: |
          ${{ runner.temp }}/dependency-track-systemd-result.json
          ${{ runner.temp }}/dependency-track-systemd-build.log
          ${{ runner.temp }}/dependency-track-systemd-live-result.json
          ${{ runner.temp }}/dependency-track-systemd-live.log
          ${{ runner.temp }}/dependency-track-systemd-live-observation.json
        if-no-files-found: error
