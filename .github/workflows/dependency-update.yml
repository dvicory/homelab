name: Dependency update PRs

on:
  schedule:
    - cron: "17 9 * * 1"
  pull_request:
    paths:
      - ".github/dependency-update.*"
      - ".github/workflows/dependency-update.yml"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Resolve updates without pushing branches or creating PRs
        type: boolean
        default: true

# No global write authority; only the two publisher jobs can update their own PR branches.
permissions: {}

concurrency:
  group: dependency-update
  cancel-in-progress: false

jobs:
  nix-lock:
    name: Prepare ordinary Nix input update and generated outputs
    if: github.repository == 'dvicory/homelab' && (github.event_name == 'pull_request' || inputs.dry-run || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out source declarations and current lock
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          github_access_token: ${{ github.token }}
      - name: Refresh root channel, floating inputs and tracked branches
        run: |
          # flake.nix is generated; source URLs remain owned by modules/meta/inputs.nix
          # and the modules declaring their own flake-file.inputs. Never rewrite it here.
          nix flake update --flake path:.
          python3 .github/dependency-update.py --refresh-generated
          python3 .github/dependency-update.py --write-patch "$RUNNER_TEMP/dependency-update.patch"
          git diff --stat HEAD -- flake.lock docs generated/manifests >> "$GITHUB_STEP_SUMMARY"
      - name: Transfer bounded generated candidate data to publisher
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-update-nix-candidate
          path: ${{ runner.temp }}/dependency-update.patch
          if-no-files-found: error
          retention-days: 7

  nix-pr:
    name: Propose Nix lock update without merging or deploying
    needs: nix-lock
    if: github.repository == 'dvicory/homelab' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.dry-run))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download prepared candidate patch only
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dependency-update-nix-candidate
          path: ${{ runner.temp }}/dependency-update
      - name: Validate allowed paths and apply generated data without candidate execution
        env:
          PATCH: ${{ runner.temp }}/dependency-update/dependency-update.patch
        run: python3 .github/dependency-update.py --apply-patch "$PATCH"
      - name: Create or refresh ordinary update PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_BODY: |
            Ordinary root Nixpkgs/channel and input/branch lock refresh using `nix flake update --flake path:.`.
            Authoritative declarations are `modules/meta/inputs.nix` and each module's `flake-file.inputs`.
            Immutable source pins, image and chart declarations have separate Renovate PRs.
            Canonical `write-files` and declaration-derived `sync-*-manifests` apps regenerated
            the accompanying documentation and manifests in an isolated token-free container.

            No automatic merge, deployment or activation. GitHub does not trigger ordinary push/PR
            workflows for GITHUB_TOKEN changes: a maintainer must explicitly dispatch Nix CI with
            this branch selected, review the full fleet/package candidate and merge manually.
        run: |
          set -euo pipefail
          if git diff --cached --quiet -- flake.lock docs generated/manifests; then
            echo 'No Nix input or generated output changes.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch=dependency-update/nix-lock
          # Only this updater-owned branch is replaceable, with an exact remote lease.
          lease=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(deps): refresh Nix inputs'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push "--force-with-lease=refs/heads/$branch:$lease" origin "HEAD:refs/heads/$branch"
          number=$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --title 'chore(deps): refresh Nix inputs' --body "$PR_BODY"
          else
            gh pr create --head "$branch" --base main --title 'chore(deps): refresh Nix inputs' --body "$PR_BODY"
          fi
      - name: Explain token policy prerequisite on failure
        if: failure()
        run: |
          echo 'If PR creation reports "GitHub Actions is not permitted to create or approve pull requests", recurring default-token publication is blocked by Settings > Actions > General > Workflow permissions > Allow GitHub Actions to create and approve pull requests. This workflow never changes that setting or uses replacement credentials.' >> "$GITHUB_STEP_SUMMARY"

  declarations:
    name: Propose source-owned input, image and chart updates
    if: github.repository == 'dvicory/homelab' && !inputs.dry-run && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
    steps: &declaration-steps
      - name: Check out trusted updater configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - name: Run upstream Renovate with the existing workflow token
        env:
          RENOVATE_TOKEN: ${{ github.token }}
          RENOVATE_CONFIG_FILE: ${{ github.workspace }}/.github/dependency-update.cjs
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_BRANCH_PREFIX: dependency-update/renovate/
          DRY_RUN: ${{ github.event_name == 'pull_request' || inputs.dry-run }}
          LOG_LEVEL: debug
        run: |
          # Upstream CLIs use this checkout's existing nixpkgs lock; no App/PAT.
          # Regeneration uses digest-pinned nixos/nix with a private store, never host /nix.
          args=()
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run=full); fi
          nix shell --inputs-from path:. nixpkgs#renovate nixpkgs#kubernetes-helm nixpkgs#skopeo nixpkgs#python3 --command renovate "${args[@]}"
      - name: Explain token and review boundaries
        if: always()
        run: |
          echo 'Source mapping: .github/dependency-update.cjs. nixhelm owns charts.*; local chart owners also get recursive hash refresh. Jellyfin candidates are draft-only pending the existing coupled producer/helper-release review. No verified release receipt is rewritten.' >> "$GITHUB_STEP_SUMMARY"
          echo 'GITHUB_TOKEN does not trigger normal push/PR CI; a maintainer must explicitly dispatch Nix CI on each update branch. No auto merge or deployment.' >> "$GITHUB_STEP_SUMMARY"
          echo 'If GitHub rejects PR creation, the exact prerequisite is Settings > Actions > General > Workflow permissions > Allow GitHub Actions to create and approve pull requests. The repository-wide read-only default is not a blocker: this workflow requests contents/pull-requests write only in publisher jobs. No setting or credential is changed here.' >> "$GITHUB_STEP_SUMMARY"

  declarations-plan:
    name: Resolve declaration updates without publication authority
    if: github.repository == 'dvicory/homelab' && (github.event_name == 'pull_request' || inputs.dry-run)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
    steps: *declaration-steps
