name: Disposable FUSE direct-I/O diagnosis

on:
  push:
    branches:
      - experiment/virtiofs-direct-eof

permissions:
  contents: read
  actions: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Require disposable KVM acceleration
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Check out the frozen compiler target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare disposable Nix storage
        run: |
          free_space=$(df -m --output=avail /mnt | tail -n 1)
          disk_size=$((free_space - 1024))
          test "$disk_size" -gt 16384
          sudo fallocate -l "${disk_size}M" /mnt/nix.img
          loop_dev=$(sudo losetup --find --show /mnt/nix.img)
          sudo mkfs.btrfs -L nix --nodiscard "$loop_dev"
          sudo mkdir -p /nix
          sudo mount "$loop_dev" /nix -o noatime,nodiscard,compress=zstd:1,space_cache=v2
          sudo mkdir -p /nix/build
          sudo chattr +C /nix/build
          free -h
          df -h / /nix
      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            build-dir = /nix/build
            max-jobs = 1
            cores = 4
            builders =
            system-features = kvm nixos-test big-parallel
      - name: Create runner-owned artifact storage after installation
        run: sudo install -d -m 0755 -o "$(id -u)" -g "$(id -g)" /nix/qualification
      - name: Configure the existing public caches
        run: |
          {
            printf 'NIX_CONFIG<<EOF\n%s\n' "${NIX_CONFIG:-}"
            nix eval --raw --file modules/nix/caches.nix --apply '
              module:
              let settings = module.flake.modules.generic.nix-common.nix.settings;
              in "extra-substituters = ${builtins.concatStringsSep " " settings.extra-substituters}\n"
                + "extra-trusted-public-keys = ${builtins.concatStringsSep " " settings.extra-trusted-public-keys}\n"
            '
            printf 'EOF\n'
          } >> "$GITHUB_ENV"
      - name: Restore the previously built exact LTS kernel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 43630402967
          artifact-ids: 14131833839
          merge-multiple: true
          path: ${{ runner.temp }}/fuse-prior-kernel
      - name: Import only the authenticated kernel closure
        run: |
          test "$(cat "$RUNNER_TEMP/fuse-prior-kernel/kernel-evidence/source-commit")" = 819332d4c3a855e0809051316d1b45bf81fd87cd
          test "$(cat "$RUNNER_TEMP/fuse-prior-kernel/kernel-evidence/kernel-drv")" = /nix/store/wq6fwwa4vdsj5wvz66sm6fbp35b036wp-linux-6.18.62.drv
          nix copy --no-check-sigs --from "file://$RUNNER_TEMP/fuse-prior-kernel/kernel-cache" \
            /nix/store/dqam29r4q9cmlqqjf87155324kkjgfv5-linux-6.18.62 \
            /nix/store/iyk4d4znzi92sndwal88pvmvsvasz9sv-linux-6.18.62-dev \
            /nix/store/hkl5ximvdf9lzqwfn87x9m046qwc53wz-linux-6.18.62-modules
          mv "$RUNNER_TEMP/fuse-prior-kernel/kernel-cache" /nix/qualification/kernel-cache
          mv "$RUNNER_TEMP/fuse-prior-kernel/kernel-evidence" /nix/qualification/imported-kernel-provenance
      - name: Build and run the isolated fixed-LTS reproducer
        run: |
          set -euo pipefail
          kernel_drv=$(nix eval --raw --file .github/fuse-eof.nix --apply 'q: q.kernel.drvPath')
          test "$kernel_drv" = /nix/store/wq6fwwa4vdsj5wvz66sm6fbp35b036wp-linux-6.18.62.drv
          drv=$(nix eval --raw --file .github/fuse-eof.nix --apply 'q: q.diagnostic.drvPath')
          mkdir -p /nix/qualification/kernel-evidence
          printf '%s\n' "$GITHUB_SHA" > /nix/qualification/kernel-evidence/source-commit
          printf '%s\n' "$kernel_drv" > /nix/qualification/kernel-evidence/kernel-drv
          printf '%s\n' "$drv" > /nix/qualification/kernel-evidence/diagnostic-drv
          nix derivation show "$drv" > /nix/qualification/kernel-evidence/derivation.json
          nix build --no-link --json "$kernel_drv^*" > /nix/qualification/kernel-evidence/kernel-build.json
          nix build --no-link --json "$drv^out" > /nix/qualification/kernel-evidence/diagnostic-build.json
          result=$(nix eval --raw --file .github/fuse-eof.nix --apply 'q: q.diagnostic.outPath')
          cp -r "$result" /nix/qualification/diagnostic-results
      - name: Preserve diagnostic logs
        if: always()
        run: |
          drv=$(nix eval --raw --file .github/fuse-eof.nix --apply 'q: q.diagnostic.drvPath')
          nix log "$drv" > /nix/qualification/diagnostic.log
      - name: Preserve raw results and provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuse-direct-eof-${{ github.run_id }}
          path: /nix/qualification
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
