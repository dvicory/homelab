name: Nix CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      check:
        description: Optional flake check name; leave empty to build the full CI projection
        type: string
        default: ""
      system:
        description: Platform; all uses x86_64-linux for a single check
        type: choice
        default: all
        options:
          - all
          - x86_64-linux
          - aarch64-linux
          - aarch64-darwin

permissions:
  actions: read
  contents: read

concurrency:
  group: nix-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  bootstrap-darwin-builder:
    name: Bootstrap Darwin Linux builder
    if: inputs.check == '' && (inputs.system == '' || inputs.system == 'all' || inputs.system == 'aarch64-darwin')
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare Nix storage
        run: |
          free_space=$(df -m --output=avail /mnt | tail -n 1)
          disk_size=$((free_space - 4096))
          test "$disk_size" -gt 1024
          sudo fallocate -l "${disk_size}M" /mnt/nix.img
          loop_dev=$(sudo losetup --find --show /mnt/nix.img)
          sudo mkfs.btrfs -L nix --nodiscard "$loop_dev"
          sudo mkdir -p /nix
          sudo mount "$loop_dev" /nix -o noatime,nobarrier,nodiscard,compress=zstd:1,space_cache=v2,commit=120
          sudo mkdir -p /nix/build
          sudo chattr +C /nix/build

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            build-dir = /nix/build
            sandbox = relaxed
          github_access_token: ${{ github.token }}

      - name: Configure durable cache (read only)
        if: vars.CACHIX_CACHE != ''
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ vars.CACHIX_CACHE }}
          skipPush: true

      - name: Build Darwin Linux builder system
        run: |
          sudo mkdir -p /mnt/darwin-builder-cache
          sudo chown "$USER" /mnt/darwin-builder-cache
          system_path=$(nix build --no-link --print-out-paths '.#darwinConfigurations.daniels-2021-mbp.config.nix.linux-builder.package.nixosConfig.system.build.toplevel')
          nix copy --to "file:///mnt/darwin-builder-cache?compression=zstd" "$system_path"
          printf '%s\n' "$system_path" > /mnt/darwin-builder-cache/system-path

      - name: Upload Darwin Linux builder closure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: darwin-builder-${{ github.run_id }}
          path: /mnt/darwin-builder-cache
          overwrite: true
          retention-days: 1

  # One job per (system, ciJobs group).
  #
  # Evaluation has to happen per system: nixidy reads the chart derivation while
  # evaluating, so evaluating a foreign system forces realising charts for a
  # platform the runner cannot build. The previous single evaluate job worked
  # only while no nixidy environment was in ciJobs.
  #
  # Each ciJobs group is directly buildable. The only cross-job handoff is the
  # Linux system closure needed to bootstrap the full Darwin configuration.
  build:
    needs: bootstrap-darwin-builder
    if: ${{ !cancelled() }}
    name: ${{ matrix.group }} (${{ matrix.system }})
    runs-on: ${{ matrix.system == 'x86_64-linux' && 'ubuntu-24.04' || matrix.system == 'aarch64-linux' && 'ubuntu-24.04-arm' || 'macos-14' }}
    environment:
      name: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CACHIX_CACHE != '' && 'cachix-publish' || '' }}
    strategy:
      fail-fast: false
      matrix:
        system: ${{ fromJSON(inputs.system && inputs.system != 'all' && format('["{0}"]', inputs.system) || inputs.check != '' && '["x86_64-linux"]' || '["x86_64-linux","aarch64-linux","aarch64-darwin"]') }}
        group: ${{ fromJSON(inputs.check != '' && '["checks"]' || '["packages","fastChecks","kubernetesApplications","hostRecovery","devShells","formatters","nixosConfigurations","darwinConfigurations","homeConfigurations"]') }}
        exclude:
          # Hosted ARM Linux has no KVM; Darwin cannot run native Linux VMs.
          - system: aarch64-linux
            group: kubernetesApplications
          - system: aarch64-linux
            group: hostRecovery
          - system: aarch64-darwin
            group: kubernetesApplications
          - system: aarch64-darwin
            group: hostRecovery
    steps:
      - name: Monitor cache publication runner
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CACHIX_CACHE != ''
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Enable available KVM acceleration
        if: runner.os == 'Linux'
        run: |
          if [ -c /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Put the Nix store on the runner's temporary disk.
      - name: Prepare Nix storage
        if: runner.os == 'Linux'
        env:
          GROUP: ${{ matrix.group }}
        run: |
          free_space=$(df -m --output=avail /mnt | tail -n 1)
          # The Kubernetes safety scenarios load fixture images into the
          # runner's Docker, whose data root shares this disk.
          reserve=1024
          if [ "$GROUP" = kubernetesApplications ]; then
            reserve=24576
          fi
          disk_size=$((free_space - reserve))
          test "$disk_size" -gt 1024
          sudo fallocate -l "${disk_size}M" /mnt/nix.img
          loop_dev=$(sudo losetup --find --show /mnt/nix.img)
          sudo mkfs.btrfs -L nix --nodiscard "$loop_dev"
          sudo mkdir -p /nix
          sudo mount "$loop_dev" /nix -o noatime,nobarrier,nodiscard,compress=zstd:1,space_cache=v2,commit=120
          sudo mkdir -p /nix/build
          # Keep Btrfs CoW out of disposable VM/build files, not the store.
          sudo chattr +C /nix/build

      - name: Install Nix on Linux
        if: runner.os == 'Linux'
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            build-dir = /nix/build
            sandbox = relaxed
          github_access_token: ${{ github.token }}

      - name: Install Nix on macOS
        if: runner.os == 'macOS'
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}

      - name: Configure durable cache (read only)
        if: vars.CACHIX_CACHE != ''
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ vars.CACHIX_CACHE }}
          skipPush: true

      # System builds and VM checks can fetch multi-GiB images. Hestia v3
      # buffers whole NARs in RAM; use durable/upstream caches for these groups.
      - name: Start Hestia cache
        if: matrix.group != 'nixosConfigurations' && matrix.group != 'darwinConfigurations' && matrix.group != 'checks' && matrix.group != 'fastChecks' && matrix.group != 'kubernetesApplications' && matrix.group != 'hostRecovery'
        uses: Mic92/hestia@dfed9ced335d28978ba74e513939a10db1f71025 # v3.1.0
        with:
          version: v3.0.1
          upstream-cache-filter: true

      - name: Download Darwin Linux builder closure
        if: matrix.system == 'aarch64-darwin' && matrix.group == 'darwinConfigurations'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: darwin-builder-${{ github.run_id }}
          path: ${{ runner.temp }}/darwin-builder-cache

      - name: Import Darwin Linux builder closure
        if: matrix.system == 'aarch64-darwin' && matrix.group == 'darwinConfigurations'
        run: |
          system_path=$(cat "$RUNNER_TEMP/darwin-builder-cache/system-path")
          sudo nix copy --option require-sigs false --from "file://$RUNNER_TEMP/darwin-builder-cache" "$system_path"

      - name: Record complete hosted gate inventory
        if: inputs.check == '' && (matrix.group == 'fastChecks' || matrix.group == 'kubernetesApplications' || matrix.group == 'hostRecovery')
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          set -euo pipefail
          nix eval --json ".#hostedCiInventory.$SYSTEM" > "$RUNNER_TEMP/ci-inventory.json"

      - name: Upload platform gate inventory
        if: inputs.check == '' && matrix.group == 'fastChecks'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-inventory-${{ matrix.system }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ci-inventory.json
          if-no-files-found: error

      - name: Build
        env:
          SYSTEM: ${{ matrix.system }}
          GROUP: ${{ matrix.group }}
          CHECK: ${{ inputs.check }}
        run: |
          set -euo pipefail
          if [ -n "$CHECK" ]; then
            [[ "$CHECK" =~ ^[a-zA-Z0-9_./-]+$ ]] || { echo "invalid check name" >&2; exit 1; }
            attr=".#checks.$SYSTEM.\"$CHECK\""
          elif [[ "$GROUP" = fastChecks || "$GROUP" = kubernetesApplications || "$GROUP" = hostRecovery ]]; then
            attr=".#hostedCiJobs.$SYSTEM.$GROUP"
          else
            attr=".#ciJobs.$SYSTEM.$GROUP"
          fi
          # Separate evaluation from every VM-bearing build group so Nix's
          # evaluator heap is released before a guest consumes runner memory.
          build_args=(--keep-going --fallback)
          if [ "$GROUP" = fastChecks ]; then
            build_args+=(--max-jobs 2)
          elif [[ "$GROUP" = checks || "$GROUP" = kubernetesApplications || "$GROUP" = hostRecovery ]]; then
            if [[ "$GROUP" = kubernetesApplications || "$GROUP" = hostRecovery ]]; then
              test "$SYSTEM" = x86_64-linux
              test -c /dev/kvm
            fi
            build_args+=(--max-jobs 1)
            attr="$(nix eval --raw "$attr.drvPath")^*"
          fi
          nix build -L --out-link "$RUNNER_TEMP/result" "${build_args[@]}" "$attr"

      - name: Run required Kubernetes safety scenarios
        if: ${{ !cancelled() && matrix.group == 'kubernetesApplications' }}
        run: |
          set -euo pipefail
          # Independent preparation still runs if a VM build failed. Evaluate
          # first so the evaluator is gone before the native fixture starts.
          drv=$(nix eval --raw .#packages.x86_64-linux.verify-kubernetes-api.drvPath)
          nix build -L --out-link "$RUNNER_TEMP/native-api" "$drv^*"
          test -S /var/run/docker.sock
          endpoint=$(env -u DOCKER_HOST -u DOCKER_CONTEXT docker context inspect default --format '{{ .Endpoints.docker.Host }}')
          test "$endpoint" = unix:///var/run/docker.sock
          # Image-store and disk facts for diagnosing image-fetch failures.
          docker info --format 'docker {{.ServerVersion}} driver={{.Driver}} root={{.DockerRootDir}}'
          df -h --output=target,avail / /mnt /nix "$RUNNER_TEMP"
          status=0
          "$RUNNER_TEMP/native-api/bin/verify-kubernetes-api" \
            --docker-context default --report "$RUNNER_TEMP/kubernetes-api-result.json" || status=$?
          if [ "$status" -ne 0 ]; then
            docker system df
            df -h --output=target,avail / /nix "$RUNNER_TEMP"
            exit "$status"
          fi
          "$RUNNER_TEMP/native-api/bin/verify-kubernetes-api" \
            --check-report "$RUNNER_TEMP/kubernetes-api-result.json"

      - name: Run required native media acceptance
        if: ${{ !cancelled() && matrix.group == 'kubernetesApplications' }}
        run: |
          set -euo pipefail
          drv=$(nix eval --raw .#packages.x86_64-linux.media-live-acceptance.drvPath)
          nix build -L --out-link "$RUNNER_TEMP/native-media" "$drv^*"
          test -S /var/run/docker.sock
          case "$(docker --host unix:///var/run/docker.sock info --format '{{.OSType}}/{{.Architecture}}')" in
            linux/x86_64|linux/amd64) ;;
            *) echo 'Native linux/amd64 Docker daemon required' >&2; exit 1 ;;
          esac
          # The full unchanged suite refuses bad credentials/configuration,
          # proves native state and checks owned cleanup before returning zero.
          /usr/bin/time -p timeout --signal=INT 2700s \
            "$RUNNER_TEMP/native-media/bin/media-live-acceptance" \
            --docker-host unix:///var/run/docker.sock --platform linux/amd64 \
            2>&1 | tee "$RUNNER_TEMP/media-native-acceptance.log"

      - name: Upload native media evidence
        if: always() && matrix.group == 'kubernetesApplications'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: media-native-${{ matrix.system }}-${{ github.run_id }}
          path: ${{ runner.temp }}/media-native-acceptance.log
          if-no-files-found: error

      - name: Upload sanitized API report
        if: always() && matrix.group == 'kubernetesApplications'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kubernetes-api-${{ matrix.system }}-${{ github.run_id }}
          path: ${{ runner.temp }}/kubernetes-api-result.json
          if-no-files-found: error

      - name: Upload successful check outputs
        if: matrix.group == 'checks' || matrix.group == 'fastChecks' || matrix.group == 'kubernetesApplications' || matrix.group == 'hostRecovery'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check-output-${{ matrix.group }}-${{ matrix.system }}-${{ github.run_id }}
          path: ${{ runner.temp }}/result*
          # Some checks have empty successful outputs; their evidence is the job log.
          if-no-files-found: ignore
      - name: Record successful required group execution
        if: inputs.check == ''
        env:
          SYSTEM: ${{ matrix.system }}
          GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          if [[ "$GROUP" = fastChecks || "$GROUP" = kubernetesApplications || "$GROUP" = hostRecovery ]]; then
            jq --arg system "$SYSTEM" --arg group "$GROUP" '{
              system: $system, group: $group,
              checks: [.checks[] | select(.hosted and .group == $group) | .name],
              nativeApplications: [.nativeApplications[] | select(.group == $group) | .name]
            }' "$RUNNER_TEMP/ci-inventory.json" > "$RUNNER_TEMP/ci-receipt.json"
          else
            jq -n --arg system "$SYSTEM" --arg group "$GROUP" \
              '{system: $system, group: $group, checks: [], nativeApplications: []}' > "$RUNNER_TEMP/ci-receipt.json"
          fi

      - name: Upload successful group receipt
        if: inputs.check == ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-receipt-${{ matrix.system }}-${{ matrix.group }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ci-receipt.json
          if-no-files-found: error


      - name: Publish successful outputs to Cachix
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CACHIX_CACHE != ''
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          CACHIX_CACHE: ${{ vars.CACHIX_CACHE }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          outputs=("$RUNNER_TEMP"/result*)
          if [ "${#outputs[@]}" -gt 0 ]; then
            cachix push "$CACHIX_CACHE" "${outputs[@]}"
          fi

  all-required:
    name: All required CI
    needs: [bootstrap-darwin-builder, build]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require full successful CI
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          BUILDER_RESULT: ${{ needs.bootstrap-darwin-builder.result }}
          CHECK: ${{ inputs.check }}
          SYSTEM: ${{ inputs.system }}
        run: |
          set -euo pipefail
          test -z "$CHECK"
          [[ -z "$SYSTEM" || "$SYSTEM" = all ]]
          test "$BUILD_RESULT" = success
          test "$BUILDER_RESULT" = success

      - name: Download evaluated inventories
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ci-inventory-*-${{ github.run_id }}
          path: ${{ runner.temp }}/required-inventories

      - name: Download successful execution receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ci-receipt-*-${{ github.run_id }}
          path: ${{ runner.temp }}/required-receipts

      - name: Reject missing platforms groups or safety gates
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          systems = {"x86_64-linux", "aarch64-linux", "aarch64-darwin"}
          inventories = {}
          for path in (root / "required-inventories").glob("*/ci-inventory.json"):
              system = path.parent.name.removeprefix("ci-inventory-").removesuffix("-${{ github.run_id }}")
              assert system in systems and system not in inventories, "missing/duplicate platform inventory"
              inventories[system] = json.loads(path.read_text())
          assert set(inventories) == systems, "full CI requires all three platform inventories"
          receipts = {}
          for path in (root / "required-receipts").glob("*/ci-receipt.json"):
              receipt = json.loads(path.read_text())
              key = (receipt["system"], receipt["group"])
              assert key not in receipts, "duplicate group receipt"
              receipts[key] = receipt
          expected = {(system, group) for system, inventory in inventories.items()
                      for group in inventory["jobGroups"]}
          assert set(receipts) == expected, "missing/unexpected CI group execution"
          for system, inventory in inventories.items():
              for group in inventory["jobGroups"]:
                  receipt = receipts[(system, group)]
                  checks = sorted(entry["name"] for entry in inventory["checks"]
                                  if entry["hosted"] and entry["group"] == group)
                  apps = sorted(entry["name"] for entry in inventory["nativeApplications"]
                                if entry["group"] == group)
                  assert sorted(receipt["checks"]) == checks, "omitted/misclassified check"
                  assert sorted(receipt["nativeApplications"]) == apps, "omitted native execution"
          print("all required platforms, groups, checks and native executions accounted for")
          PY
