name: Diagnostic legacy NetworkPolicy convergence
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  native-network-policy:
    name: Bounded native legacy controller diagnosis
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: 'false'
        ref: ${{ github.sha }}
    - name: Require existing native KVM
      run: 'test -c /dev/kvm

        sudo chmod a+rw /dev/kvm

        '
    - name: Install Nix on Linux
      if: runner.os == 'Linux'
      uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702
      with:
        extra_nix_config: 'sandbox = relaxed

          '
        github_access_token: ${{ github.token }}
    - name: Configure shared public caches
      env:
        CACHIX_CACHE: ${{ vars.CACHIX_CACHE }}
      run: "case \"${CACHIX_CACHE:-}\" in\n  \"\"|dvicory-homelab) ;;\n  *) printf '%s\\n' 'Unsupported CACHIX_CACHE;\
        \ expected dvicory-homelab or empty.' >&2; exit 1 ;;\nesac\n{\n  printf 'NIX_CONFIG<<EOF\\n%s\\n' \"${NIX_CONFIG:-}\"\
        \n  nix eval --raw --file modules/nix/caches.nix --apply '\n    module:\n    let settings = module.flake.modules.generic.nix-common.nix.settings;\n\
        \    in \"extra-substituters = ${builtins.concatStringsSep \" \" settings.extra-substituters}\\n\"\n   \
        \   + \"extra-trusted-public-keys = ${builtins.concatStringsSep \" \" settings.extra-trusted-public-keys}\\\
        n\"\n  '\n  printf 'EOF\\n'\n} >> \"$GITHUB_ENV\"\n"
    - name: Build exact diagnostic NetworkPolicy driver
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

        git rev-parse HEAD > "$RUNNER_TEMP/native-source-head.txt"

        nix eval --accept-flake-config --raw .#checks.x86_64-linux.compute-network-policy-runtime.driver.drvPath
        > "$RUNNER_TEMP/native-driver.drv"

        driver=$(nix build --accept-flake-config --builders '''' --max-jobs 1 --cores 2 --no-link --print-out-paths
        .#checks.x86_64-linux.compute-network-policy-runtime.driver)

        test -x "$driver/bin/nixos-test-driver"

        printf ''%s\n'' "$driver/bin/nixos-test-driver" > "$RUNNER_TEMP/native-driver-program.txt"

        printf ''NATIVE_NETWORK_POLICY_DRIVER=%s\n'' "$driver" >> "$GITHUB_ENV"

        '
    - name: Observe existing full NetworkPolicy scenario once
      working-directory: ${{ runner.temp }}
      run: "set -euo pipefail\ntest ! -e /mnt/nix.img && test ! -L /mnt/nix.img\nscratch=$(mktemp -d /var/tmp/homelab-network-policy.XXXXXX)\n\
        trap 'rm -rf -- \"$scratch\"' EXIT\nchmod 0700 \"$scratch\"\nroot_device=$(findmnt -n -T / -o MAJ:MIN)\n\
        test \"$(findmnt -n -T /nix -o MAJ:MIN)\" = \"$root_device\"\ntest \"$(findmnt -n -T \"$scratch\" -o MAJ:MIN)\"\
        \ = \"$root_device\"\n{\n  findmnt -n -T /nix -o TARGET,SOURCE,FSTYPE,MAJ:MIN\n  findmnt -n -T \"$scratch\"\
        \ -o TARGET,SOURCE,FSTYPE,MAJ:MIN\n  df -B1 / /nix \"$scratch\"\n  nix config show build-dir\n} | tee \"\
        $RUNNER_TEMP/native-storage.txt\"\nXDG_RUNTIME_DIR=\"$scratch\" \"$NATIVE_NETWORK_POLICY_DRIVER/bin/nixos-test-driver\"\
        \ 2>&1 | tee \"$RUNNER_TEMP/native-network-policy.log\"\n"
    - name: Retain diagnostic source runtime and storage evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: network-policy-legacy-diagnostic-${{ github.run_id }}
        path: '${{ runner.temp }}/native-source-head.txt

          ${{ runner.temp }}/native-driver.drv

          ${{ runner.temp }}/native-driver-program.txt

          ${{ runner.temp }}/native-storage.txt

          ${{ runner.temp }}/native-network-policy.log'
        if-no-files-found: error
        retention-days: 14
