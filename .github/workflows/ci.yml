name: Nix CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      check:
        description: Optional check name (household-sign-in-runtime runs the native suite); leave empty for all CI
        type: string
        default: ""
      system:
        description: Platform; all uses x86_64-linux for a single check
        type: choice
        default: all
        options:
          - all
          - x86_64-linux
          - aarch64-linux
          - aarch64-darwin

permissions:
  actions: read
  contents: read

concurrency:
  group: nix-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  bootstrap-darwin-builder:
    name: Bootstrap Darwin Linux builder
    if: inputs.check == '' && (inputs.system == '' || inputs.system == 'all' || inputs.system == 'aarch64-darwin')
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare Nix storage
        run: |
          free_space=$(df -m --output=avail /mnt | tail -n 1)
          disk_size=$((free_space - 4096))
          test "$disk_size" -gt 1024
          sudo fallocate -l "${disk_size}M" /mnt/nix.img
          loop_dev=$(sudo losetup --find --show /mnt/nix.img)
          sudo mkfs.btrfs -L nix --nodiscard "$loop_dev"
          sudo mkdir -p /nix
          sudo mount "$loop_dev" /nix -o noatime,nobarrier,nodiscard,compress=zstd:1,space_cache=v2,commit=120
          sudo mkdir -p /nix/build
          sudo chattr +C /nix/build

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            build-dir = /nix/build
            sandbox = relaxed
          github_access_token: ${{ github.token }}

      - name: Configure durable cache (read only)
        if: vars.CACHIX_CACHE != ''
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ vars.CACHIX_CACHE }}
          skipPush: true

      - name: Build Darwin Linux builder system
        run: |
          sudo mkdir -p /mnt/darwin-builder-cache
          sudo chown "$USER" /mnt/darwin-builder-cache
          system_path=$(nix build --no-link --print-out-paths '.#darwinConfigurations.daniels-2021-mbp.config.nix.linux-builder.package.nixosConfig.system.build.toplevel')
          nix copy --to "file:///mnt/darwin-builder-cache?compression=zstd" "$system_path"
          printf '%s\n' "$system_path" > /mnt/darwin-builder-cache/system-path

      - name: Upload Darwin Linux builder closure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: darwin-builder-${{ github.run_id }}
          path: /mnt/darwin-builder-cache
          overwrite: true
          retention-days: 1

  # One job per (system, ciJobs group).
  #
  # Evaluation has to happen per system: nixidy reads the chart derivation while
  # evaluating, so evaluating a foreign system forces realising charts for a
  # platform the runner cannot build. The previous single evaluate job worked
  # only while no nixidy environment was in ciJobs.
  #
  # Each ciJobs group is directly buildable. The only cross-job handoff is the
  # Linux system closure needed to bootstrap the full Darwin configuration.
  build:
    needs: bootstrap-darwin-builder
    if: ${{ !cancelled() && inputs.check != 'household-sign-in-runtime' }}
    name: ${{ matrix.group }} (${{ matrix.system }})
    runs-on: ${{ matrix.system == 'x86_64-linux' && 'ubuntu-24.04' || matrix.system == 'aarch64-linux' && 'ubuntu-24.04-arm' || 'macos-14' }}
    environment:
      name: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CACHIX_CACHE != '' && 'cachix-publish' || '' }}
    strategy:
      fail-fast: false
      matrix:
        system: ${{ fromJSON(inputs.system && inputs.system != 'all' && format('["{0}"]', inputs.system) || inputs.check != '' && '["x86_64-linux"]' || '["x86_64-linux","aarch64-linux","aarch64-darwin"]') }}
        group: ${{ fromJSON(inputs.check != '' && '["checks"]' || '["packages","checks","devShells","formatters","nixosConfigurations","darwinConfigurations","homeConfigurations"]') }}
    steps:
      - name: Monitor cache publication runner
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CACHIX_CACHE != ''
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Enable available KVM acceleration
        if: runner.os == 'Linux'
        run: |
          if [ -c /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Put the Nix store on the runner's temporary disk.
      - name: Prepare Nix storage
        if: runner.os == 'Linux'
        run: |
          free_space=$(df -m --output=avail /mnt | tail -n 1)
          disk_size=$((free_space - 1024))
          test "$disk_size" -gt 1024
          sudo fallocate -l "${disk_size}M" /mnt/nix.img
          loop_dev=$(sudo losetup --find --show /mnt/nix.img)
          sudo mkfs.btrfs -L nix --nodiscard "$loop_dev"
          sudo mkdir -p /nix
          sudo mount "$loop_dev" /nix -o noatime,nobarrier,nodiscard,compress=zstd:1,space_cache=v2,commit=120
          sudo mkdir -p /nix/build
          # Keep Btrfs CoW out of disposable VM/build files, not the store.
          sudo chattr +C /nix/build

      - name: Install Nix on Linux
        if: runner.os == 'Linux'
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            build-dir = /nix/build
            sandbox = relaxed
          github_access_token: ${{ github.token }}

      - name: Install Nix on macOS
        if: runner.os == 'macOS'
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}

      - name: Configure durable cache (read only)
        if: vars.CACHIX_CACHE != ''
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ vars.CACHIX_CACHE }}
          skipPush: true

      # System builds and VM checks can fetch multi-GiB images. Hestia v3
      # buffers whole NARs in RAM; use durable/upstream caches for these groups.
      - name: Start Hestia cache
        if: matrix.group != 'nixosConfigurations' && matrix.group != 'darwinConfigurations' && matrix.group != 'checks'
        uses: Mic92/hestia@dfed9ced335d28978ba74e513939a10db1f71025 # v3.1.0
        with:
          version: v3.0.1
          upstream-cache-filter: true

      - name: Download Darwin Linux builder closure
        if: matrix.system == 'aarch64-darwin' && matrix.group == 'darwinConfigurations'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: darwin-builder-${{ github.run_id }}
          path: ${{ runner.temp }}/darwin-builder-cache

      - name: Import Darwin Linux builder closure
        if: matrix.system == 'aarch64-darwin' && matrix.group == 'darwinConfigurations'
        run: |
          system_path=$(cat "$RUNNER_TEMP/darwin-builder-cache/system-path")
          sudo nix copy --option require-sigs false --from "file://$RUNNER_TEMP/darwin-builder-cache" "$system_path"

      - name: Build
        env:
          SYSTEM: ${{ matrix.system }}
          GROUP: ${{ matrix.group }}
          CHECK: ${{ inputs.check }}
        run: |
          set -euo pipefail
          if [ -n "$CHECK" ]; then
            [[ "$CHECK" =~ ^[a-zA-Z0-9_./-]+$ ]] || { echo "invalid check name" >&2; exit 1; }
            attr=".#checks.$SYSTEM.\"$CHECK\""
          elif [ "$GROUP" = checks ]; then
            attr=".#hostedCiJobs.$SYSTEM.checks"
          else
            attr=".#ciJobs.$SYSTEM.$GROUP"
          fi
          build_args=(--keep-going --fallback)
          if [ "$GROUP" = checks ]; then
            # VM checks need the runner's resources, not a share of parallel
            # builds. Evaluating every check takes about 10 GiB, and a nix
            # build process keeps that heap until its last build ends, so
            # evaluate in a separate process and build the derivation.
            build_args+=(--max-jobs 1)
            attr="$(nix eval --raw "$attr.drvPath")^*"
          fi
          nix build -L --out-link "$RUNNER_TEMP/result" "${build_args[@]}" "$attr"

      - name: Upload successful check outputs
        if: matrix.group == 'checks'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check-output-${{ matrix.system }}-${{ github.run_id }}
          path: ${{ runner.temp }}/result*
          # Some checks have empty successful outputs; their evidence is the job log.
          if-no-files-found: ignore

      - name: Publish successful outputs to Cachix
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CACHIX_CACHE != ''
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          CACHIX_CACHE: ${{ vars.CACHIX_CACHE }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          outputs=("$RUNNER_TEMP"/result*)
          if [ "${#outputs[@]}" -gt 0 ]; then
            cachix push "$CACHIX_CACHE" "${outputs[@]}"
          fi

  # Application APIs/authentication need Docker, not a second generic VM.
  # The separate household-directory K3s/kernel NetworkPolicy gate is unchanged.
  household-sign-in-runtime:
    name: household-sign-in-runtime (x86_64-linux)
    if: inputs.check == '' || inputs.check == 'household-sign-in-runtime'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Share the temporary-disk filesystem between Nix and this job's Docker fixture.
      - name: Prepare native acceptance storage
        run: |
          set -euo pipefail
          test ! -e /mnt/nix.img
          for target in /nix /var/lib/docker /var/lib/containerd; do
            if mountpoint -q "$target"; then
              printf 'refusing existing storage mount: %s\n' "$target" >&2
              exit 1
            fi
          done
          free_space=$(df -m --output=avail /mnt | tail -n 1)
          disk_size=$((free_space - 1024))
          test "$disk_size" -gt 1024
          sudo fallocate -l "${disk_size}M" /mnt/nix.img
          loop_dev=$(sudo losetup --find --show /mnt/nix.img)
          sudo mkfs.btrfs -L nix --nodiscard "$loop_dev"
          sudo mkdir -p /nix
          sudo mount "$loop_dev" /nix -o noatime,nobarrier,nodiscard,compress=zstd:1,space_cache=v2,commit=120
          sudo mkdir -p /nix/build
          sudo chattr +C /nix/build
          sudo mkdir -p /nix/build/household-native/{docker,containerd,tmp}
          sudo chmod 1777 /nix/build/household-native/tmp
          sudo systemctl stop docker.service docker.socket containerd.service
          sudo mkdir -p /var/lib/docker /var/lib/containerd
          sudo mount --bind /nix/build/household-native/docker /var/lib/docker
          sudo mount --bind /nix/build/household-native/containerd /var/lib/containerd
          sudo systemctl start containerd.service docker.service
          printf 'TMPDIR=/nix/build/household-native/tmp\n' >> "$GITHUB_ENV"

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            build-dir = /nix/build
          github_access_token: ${{ github.token }}

      - name: Configure durable cache (read only)
        if: vars.CACHIX_CACHE != ''
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ vars.CACHIX_CACHE }}
          skipPush: true

      - name: Record native runner and canonical inputs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/household-native-evidence"
          {
            printf 'runner_image=%s\nrunner_image_version=%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
            uname -a
            docker --host unix:///var/run/docker.sock version
            docker --host unix:///var/run/docker.sock info
            df -h / /nix
            for target in /nix /var/lib/docker /var/lib/containerd; do
              findmnt -rn -M "$target" -o TARGET,SOURCE,FSTYPE,FSROOT
            done
            git rev-parse HEAD HEAD:generated/manifests/prod-home
            sha256sum flake.lock modules/tests/household-sign-in-runtime.py modules/tests/household-sign-in-runtime.nix
          } 2>&1 | tee "$RUNNER_TEMP/household-native-evidence/inputs.log"

      - name: Prepare pinned native acceptance app
        run: |
          set -euo pipefail
          /usr/bin/time -p nix run .#household-sign-in-runtime -- --help \
            2>&1 | tee "$RUNNER_TEMP/household-native-evidence/app-preparation.log"

      - name: Run complete native household acceptance
        run: |
          set -euo pipefail
          # This runner is disposable; the app never changes host resolution.
          printf '127.0.0.1 idm.plus2.danielvicory.dev\n' | sudo tee -a /etc/hosts
          app=$(nix eval --raw .#apps.x86_64-linux.household-sign-in-runtime.program)
          # Preserve the original suite's 3000-second deadline and owned cleanup.
          sudo env TMPDIR="$TMPDIR" /usr/bin/time -p timeout --signal=INT 3000s "$app" \
            2>&1 | tee "$RUNNER_TEMP/household-native-evidence/acceptance.log"

      - name: Record independent owned cleanup
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/household-native-evidence"
          {
            for name in kanidm jellyfin seerr; do
              remaining=$(docker --host unix:///var/run/docker.sock container ls --all --filter "name=^/$name$" --format '{{.Names}}')
              printf 'remaining_%s=%s\n' "$name" "$remaining"
              test -z "$remaining"
            done
            remaining=$(docker --host unix:///var/run/docker.sock network ls --filter name=^household$ --format '{{.Name}}')
            printf 'remaining_household_network=%s\n' "$remaining"
            test -z "$remaining"
            sudo test ! -e /root/household
            sudo test ! -e /nix/build/household-native/tmp/household
            printf 'remaining_fixture_directory=false\n'
          } 2>&1 | tee "$RUNNER_TEMP/household-native-evidence/cleanup.log"

      - name: Clean owned native acceptance storage
        if: always()
        run: |
          set -euo pipefail
          if sudo test -d /nix/build/household-native; then
            # Never unmount an unrelated daemon's storage.
            for name in docker containerd; do
              if mountpoint -q "/var/lib/$name"; then
                test "$(findmnt -rn -M "/var/lib/$name" -o FSROOT)" = "/build/household-native/$name"
                test "$(findmnt -rn -M "/var/lib/$name" -o UUID)" = "$(findmnt -rn -M /nix -o UUID)"
              fi
            done
            sudo systemctl stop docker.service docker.socket containerd.service
            for name in docker containerd; do
              if mountpoint -q "/var/lib/$name"; then
                sudo umount "/var/lib/$name"
              fi
            done
            sudo rm -rf /nix/build/household-native
            sudo test ! -e /nix/build/household-native
          fi
          printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Upload sanitized native household evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: household-sign-in-runtime-${{ github.run_id }}
          path: ${{ runner.temp }}/household-native-evidence
