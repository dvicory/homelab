name: Nix CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      check:
        description: Optional check name (media-runtime runs the native suite); leave empty for all CI
        type: string
        default: ""
      system:
        description: Platform; all uses x86_64-linux for a single check
        type: choice
        default: all
        options:
          - all
          - x86_64-linux
          - aarch64-linux
          - aarch64-darwin

permissions:
  actions: read
  contents: read

concurrency:
  group: nix-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  plan:
    name: Inventory hosted checks
    if: inputs.check != 'media-runtime'
    runs-on: ${{ inputs.check != '' && inputs.system == 'aarch64-linux' && 'ubuntu-24.04-arm' || inputs.check != '' && inputs.system == 'aarch64-darwin' && 'macos-14' || 'ubuntu-24.04' }}
    outputs:
      matrix: ${{ steps.inventory.outputs.matrix }}
      darwin: ${{ steps.inventory.outputs.darwin }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
          github_access_token: ${{ github.token }}
      - name: Configure durable cache (read only)
        if: vars.CACHIX_CACHE != ''
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ vars.CACHIX_CACHE }}
          skipPush: true
      - &signed-upstream-cache
        name: Preserve signed upstream cache after Cachix
        run: |
          config_dir="${XDG_CONFIG_HOME:-$HOME/.config}/nix"
          mkdir -p "$config_dir"
          printf '%s\n' \
            'extra-substituters = https://cache.numtide.com' \
            'extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=' \
            >> "$config_dir/nix.conf"
      - name: Partition actual check derivations
        id: inventory
        env:
          CHECK: ${{ inputs.check }}
          REQUESTED_SYSTEM: ${{ inputs.system }}
        run: |
          set -euo pipefail
          system=x86_64-linux
          if [ -n "$CHECK" ] && [ -n "$REQUESTED_SYSTEM" ] && [ "$REQUESTED_SYSTEM" != all ]; then
            system="$REQUESTED_SYSTEM"
          fi
          # Keep exact drv identities in native job receipts, not the planning barrier.
          nix eval --json ".#hostedCiInventory.$system" \
            --apply 'builtins.mapAttrs (_: builtins.map (entry: builtins.removeAttrs entry [ "drvPath" ]))' \
            > "$RUNNER_TEMP/check-inventory.json"
          cat "$RUNNER_TEMP/check-inventory.json"
          if [ -n "$CHECK" ]; then
            matrix=$(jq -ce --arg check "$CHECK" --arg system "$system" '
              [.inventory[] | select(.name == $check)] |
              if length != 1 then error("check is not registered for selected platform")
              elif .[0].hosted | not then error("selected check requires KVM unavailable on this hosted platform")
              else {include: [{system: $system, group: (if .[0].runtime then "runtime" else "checks" end), check: $check, artifact: ($check | @uri)}]} end
            ' "$RUNNER_TEMP/check-inventory.json")
            darwin=false
          else
            platforms='["x86_64-linux","aarch64-linux","aarch64-darwin"]'
            if [ -n "$REQUESTED_SYSTEM" ] && [ "$REQUESTED_SYSTEM" != all ]; then
              platforms=$(jq -cn --arg system "$REQUESTED_SYSTEM" '[$system]')
            fi
            matrix=$(jq -c --argjson platforms "$platforms" '
              {include: (
                [if $platforms | index("x86_64-linux") then .runtime[] |
                   {system: "x86_64-linux", group: "runtime", check: .name, artifact: (.name | @uri)} else empty end]
                + [$platforms[] as $system |
                 ["packages","checks","devShells","formatters","nixosConfigurations","darwinConfigurations","homeConfigurations"][] as $group |
                 select($system != "aarch64-darwin" or $group != "darwinConfigurations") |
                 {system: $system, group: $group, check: "", artifact: ""}]
              )}
            ' "$RUNNER_TEMP/check-inventory.json")
            darwin=$(jq -cn --argjson platforms "$platforms" '$platforms | index("aarch64-darwin") != null')
          fi
          printf 'matrix=%s\ndarwin=%s\n' "$matrix" "$darwin" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$matrix" | jq .
      - name: Upload required check inventory
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: required-check-inventory-${{ github.run_id }}
          path: ${{ runner.temp }}/check-inventory.json

  bootstrap-darwin-builder:
    name: Bootstrap Darwin Linux builder
    if: inputs.check == '' && (inputs.system == '' || inputs.system == 'all' || inputs.system == 'aarch64-darwin')
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare Nix storage
        run: |
          free_space=$(df -m --output=avail /mnt | tail -n 1)
          disk_size=$((free_space - 4096))
          test "$disk_size" -gt 1024
          sudo fallocate -l "${disk_size}M" /mnt/nix.img
          loop_dev=$(sudo losetup --find --show /mnt/nix.img)
          sudo mkfs.btrfs -L nix --nodiscard "$loop_dev"
          sudo mkdir -p /nix
          sudo mount "$loop_dev" /nix -o noatime,nobarrier,nodiscard,compress=zstd:1,space_cache=v2,commit=120
          sudo mkdir -p /nix/build
          sudo chattr +C /nix/build

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            build-dir = /nix/build
            sandbox = relaxed
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
          github_access_token: ${{ github.token }}

      - name: Configure durable cache (read only)
        if: vars.CACHIX_CACHE != ''
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ vars.CACHIX_CACHE }}
          skipPush: true
      - *signed-upstream-cache

      - name: Build Darwin Linux builder system
        run: |
          sudo mkdir -p /mnt/darwin-builder-cache
          sudo chown "$USER" /mnt/darwin-builder-cache
          system_path=$(nix build --no-link --print-out-paths '.#darwinConfigurations.daniels-2021-mbp.config.nix.linux-builder.package.nixosConfig.system.build.toplevel')
          nix copy --to "file:///mnt/darwin-builder-cache?compression=zstd" "$system_path"
          printf '%s\n' "$system_path" > /mnt/darwin-builder-cache/system-path

      - name: Upload Darwin Linux builder closure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: darwin-builder-${{ github.run_id }}
          path: /mnt/darwin-builder-cache
          overwrite: true
          retention-days: 1

  # Native evaluation discovers all VM drivers; each gets its own KVM runner.
  # Only the real Darwin configuration consumer waits for the bootstrap closure.
  build:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    name: ${{ matrix.check || matrix.group }} (${{ matrix.system }})
    runs-on: ${{ matrix.system == 'x86_64-linux' && 'ubuntu-24.04' || matrix.system == 'aarch64-linux' && 'ubuntu-24.04-arm' || 'macos-14' }}
    environment:
      name: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CACHIX_CACHE != '' && 'cachix-publish' || '' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps: &build-steps
      - name: Monitor cache publication runner
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CACHIX_CACHE != ''
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Enable available KVM acceleration
        if: runner.os == 'Linux'
        env:
          GROUP: ${{ matrix.group }}
        run: |
          if [ -c /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm
          elif [ "$GROUP" = runtime ]; then
            echo 'Runtime check requires a native KVM runner' >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Put the Nix store on the runner's temporary disk.
      - name: Prepare Nix storage
        if: runner.os == 'Linux'
        run: |
          free_space=$(df -m --output=avail /mnt | tail -n 1)
          disk_size=$((free_space - 1024))
          test "$disk_size" -gt 1024
          sudo fallocate -l "${disk_size}M" /mnt/nix.img
          loop_dev=$(sudo losetup --find --show /mnt/nix.img)
          sudo mkfs.btrfs -L nix --nodiscard "$loop_dev"
          sudo mkdir -p /nix
          sudo mount "$loop_dev" /nix -o noatime,nobarrier,nodiscard,compress=zstd:1,space_cache=v2,commit=120
          sudo mkdir -p /nix/build
          # Keep Btrfs CoW out of disposable VM/build files, not the store.
          sudo chattr +C /nix/build

      - name: Install Nix on Linux
        if: runner.os == 'Linux'
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            build-dir = /nix/build
            sandbox = relaxed
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
          github_access_token: ${{ github.token }}

      - name: Install Nix on macOS
        if: runner.os == 'macOS'
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
          github_access_token: ${{ github.token }}

      - name: Configure durable cache (read only)
        if: vars.CACHIX_CACHE != ''
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ vars.CACHIX_CACHE }}
          skipPush: true
      - *signed-upstream-cache

      # System builds and VM checks can fetch multi-GiB images. Hestia v3
      # buffers whole NARs in RAM; use durable/upstream caches for these groups.
      - name: Start Hestia cache
        if: matrix.group != 'nixosConfigurations' && matrix.group != 'darwinConfigurations' && matrix.group != 'checks' && matrix.group != 'runtime'
        uses: Mic92/hestia@dfed9ced335d28978ba74e513939a10db1f71025 # v3.1.0
        with:
          version: v3.1.0
          upstream-cache-filter: true

      - name: Download Darwin Linux builder closure
        if: matrix.system == 'aarch64-darwin' && matrix.group == 'darwinConfigurations'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: darwin-builder-${{ github.run_id }}
          path: ${{ runner.temp }}/darwin-builder-cache

      - name: Import Darwin Linux builder closure
        if: matrix.system == 'aarch64-darwin' && matrix.group == 'darwinConfigurations'
        run: |
          system_path=$(cat "$RUNNER_TEMP/darwin-builder-cache/system-path")
          sudo nix copy --option require-sigs false --from "file://$RUNNER_TEMP/darwin-builder-cache" "$system_path"

      - name: Build
        env:
          SYSTEM: ${{ matrix.system }}
          GROUP: ${{ matrix.group }}
          CHECK: ${{ matrix.check }}
        run: |
          set -euo pipefail
          if [ "$GROUP" = checks ]; then
            nix eval --json ".#hostedCiInventory.$SYSTEM" > "$RUNNER_TEMP/check-inventory.json"
            cat "$RUNNER_TEMP/check-inventory.json"
          fi
          if [ -n "$CHECK" ]; then
            check_attr=$(jq -rn --arg check "$CHECK" '$check | @json')
            attr=".#checks.$SYSTEM.$check_attr"
          elif [ "$GROUP" = checks ]; then
            attr=".#hostedCiJobs.$SYSTEM.checks"
          else
            attr=".#ciJobs.$SYSTEM.$GROUP"
          fi
          build_args=(--keep-going --fallback)
          if [ "$GROUP" = runtime ]; then
            # One VM suite on this runner, never competing VM heaps.
            build_args+=(--max-jobs 1)
          fi
          # Release the evaluation heap before any build/VM starts (PR #64).
          drv=$(nix eval --raw "$attr.drvPath")
          nix build -L --out-link "$RUNNER_TEMP/result" --json "${build_args[@]}" "$drv^*" > "$RUNNER_TEMP/build.json"

      - name: Upload successful check outputs
        if: matrix.group == 'checks' || matrix.group == 'runtime'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check-output-${{ matrix.system }}-${{ matrix.artifact || matrix.group }}-${{ github.run_id }}
          path: ${{ runner.temp }}/result*
          # Some checks have empty successful outputs; their evidence is the job log.
          if-no-files-found: ignore

      - name: Upload platform check inventory
        if: always() && matrix.group == 'checks'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check-inventory-${{ matrix.system }}-${{ matrix.artifact || matrix.group }}-${{ github.run_id }}
          path: ${{ runner.temp }}/check-inventory.json

      - name: Publish successful outputs and build dependencies to Cachix
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CACHIX_CACHE != ''
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          CACHIX_CACHE: ${{ vars.CACHIX_CACHE }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          outputs=("$RUNNER_TEMP"/result*)
          if [ "${#outputs[@]}" -gt 0 ]; then
            # Compressed images hide build dependencies from their runtime references.
            # Keep only realized additions to the exact build's source closure.
            jq -r '.[].drvPath' "$RUNNER_TEMP/build.json" \
              | xargs nix-store --query --requisites \
              | sort -u > "$RUNNER_TEMP/build-sources"
            jq -r '.[].drvPath' "$RUNNER_TEMP/build.json" \
              | xargs nix-store --query --requisites --include-outputs \
              | sort -u > "$RUNNER_TEMP/build-realized"
            {
              printf '%s\n' "${outputs[@]}"
              comm -13 "$RUNNER_TEMP/build-sources" "$RUNNER_TEMP/build-realized"
            } | cachix push "$CACHIX_CACHE"
          fi

  build-darwin-configuration:
    needs: [plan, bootstrap-darwin-builder]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.bootstrap-darwin-builder.result == 'success' && needs.plan.outputs.darwin == 'true' }}
    name: darwinConfigurations (aarch64-darwin)
    runs-on: macos-14
    environment:
      name: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CACHIX_CACHE != '' && 'cachix-publish' || '' }}
    strategy:
      matrix:
        include:
          - system: aarch64-darwin
            group: darwinConfigurations
            check: ""
            artifact: ""
    steps: *build-steps

  # Same pinned application suite as the former media VM envelope. Kubernetes
  # and host-storage boundaries remain covered by their separate runtime gates.
  media-runtime:
    name: media-runtime (x86_64-linux)
    if: (inputs.check == '' && (inputs.system == '' || inputs.system == 'all' || inputs.system == 'x86_64-linux')) || inputs.check == 'media-runtime'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
          github_access_token: ${{ github.token }}

      - name: Configure durable cache (read only)
        if: vars.CACHIX_CACHE != ''
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ vars.CACHIX_CACHE }}
          skipPush: true
      - *signed-upstream-cache

      - name: Record native runner and input identities
        run: |
          set -euo pipefail
          case "${{ inputs.system }}" in
            ''|all|x86_64-linux) ;;
            *) echo 'media-runtime requires the native x86_64-linux hosted runner' >&2; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/media-native-evidence"
          {
            printf 'runner_image=%s\nrunner_image_version=%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
            printf 'suite_platform=linux/amd64\nmeasurement=cold disposable runner; image pulls included\n'
            printf 'excluded=Kubernetes RBAC/NetworkPolicy/Gateway; Incus/MergerFS/ZFS/GPU\n'
            uname -a
            lscpu
            docker --host unix:///var/run/docker.sock version
            docker --host unix:///var/run/docker.sock info
            docker --host unix:///var/run/docker.sock image ls --digests --no-trunc
            nix --version
            git rev-parse HEAD HEAD:assets/media-policy HEAD:generated/manifests/prod-home
            sha256sum flake.lock modules/tests/media-live-acceptance.py
            case "$(docker --host unix:///var/run/docker.sock info --format '{{.OSType}}/{{.Architecture}}')" in
              linux/x86_64|linux/amd64) ;;
              *) echo 'Native linux/amd64 Docker daemon required' >&2; exit 1 ;;
            esac
          } 2>&1 | tee "$RUNNER_TEMP/media-native-evidence/inputs.log"

      - name: Prepare existing pinned native app
        run: |
          set -euo pipefail
          /usr/bin/time -p nix run .#media-live-acceptance -- --help \
            2>&1 | tee "$RUNNER_TEMP/media-native-evidence/app-preparation.log"

      - name: Run full unchanged native media acceptance
        run: |
          set -euo pipefail
          # Preserve the VM suite's 2700-second deadline; INT permits owned cleanup.
          /usr/bin/time -p timeout --signal=INT 2700s nix run .#media-live-acceptance -- \
            --docker-host unix:///var/run/docker.sock --platform linux/amd64 \
            2>&1 | tee "$RUNNER_TEMP/media-native-evidence/acceptance.log"

      - name: Record images and owned cleanup
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/media-native-evidence"
          {
            docker --host unix:///var/run/docker.sock image ls --digests --no-trunc
            docker --host unix:///var/run/docker.sock image ls --quiet --no-trunc \
              | sort -u | xargs --no-run-if-empty docker --host unix:///var/run/docker.sock image inspect \
                --format '{{.Id}} {{.Os}}/{{.Architecture}} {{json .RepoDigests}}'
            containers=$(docker --host unix:///var/run/docker.sock container ls --all --filter name=homelab-media-live- --format '{{.Names}}')
            networks=$(docker --host unix:///var/run/docker.sock network ls --filter name=homelab-media-live- --format '{{.Name}}')
            volumes=$(docker --host unix:///var/run/docker.sock volume ls --filter name=homelab-media-live- --format '{{.Name}}')
            printf 'remaining_owned_containers=%s\nremaining_owned_networks=%s\nremaining_owned_volumes=%s\n' "$containers" "$networks" "$volumes"
            test -z "$containers"
            test -z "$networks"
            test -z "$volumes"
          } 2>&1 | tee "$RUNNER_TEMP/media-native-evidence/cleanup.log"

      - name: Upload native media diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: media-runtime-${{ github.run_id }}
          path: ${{ runner.temp }}/media-native-evidence
