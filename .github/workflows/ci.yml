name: Diagnostic native queue registration stack
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  native-queue-stack:
    name: One normal Nix queue startup discriminator
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: 'false'
        ref: ${{ github.sha }}
    - name: Require existing native KVM
      run: 'test -c /dev/kvm

        sudo chmod a+rw /dev/kvm

        '
    - name: Install Nix on Linux
      if: runner.os == 'Linux'
      uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702
      with:
        extra_nix_config: 'sandbox = relaxed

          '
        github_access_token: ${{ github.token }}
    - name: Configure shared public caches
      env:
        CACHIX_CACHE: ${{ vars.CACHIX_CACHE }}
      run: "case \"${CACHIX_CACHE:-}\" in\n  \"\"|dvicory-homelab) ;;\n  *) printf '%s\\n' 'Unsupported CACHIX_CACHE;\
        \ expected dvicory-homelab or empty.' >&2; exit 1 ;;\nesac\n{\n  printf 'NIX_CONFIG<<EOF\\n%s\\n' \"${NIX_CONFIG:-}\"\
        \n  nix eval --raw --file modules/nix/caches.nix --apply '\n    module:\n    let settings = module.flake.modules.generic.nix-common.nix.settings;\n\
        \    in \"extra-substituters = ${builtins.concatStringsSep \" \" settings.extra-substituters}\\n\"\n   \
        \   + \"extra-trusted-public-keys = ${builtins.concatStringsSep \" \" settings.extra-trusted-public-keys}\\\
        n\"\n  '\n  printf 'EOF\\n'\n} >> \"$GITHUB_ENV\"\n"
    - name: Run exact normal Nix check with failure-only task stack
      run: "set -euo pipefail\ntest \"$(git rev-parse HEAD)\" = \"$GITHUB_SHA\"\ngit rev-parse HEAD > \"$RUNNER_TEMP/queue-source-head.txt\"\
        \ntest ! -e /mnt/nix.img && test ! -L /mnt/nix.img\ntest \"$(findmnt -n -T /nix -o MAJ:MIN)\" = \"$(findmnt\
        \ -n -T / -o MAJ:MIN)\"\n{\n  findmnt -n -T /nix -o TARGET,SOURCE,FSTYPE,MAJ:MIN\n  df -B1 / /nix \"$RUNNER_TEMP\"\
        \n  nix config show build-dir\n} | tee \"$RUNNER_TEMP/queue-native-storage.txt\"\nnix eval --accept-flake-config\
        \ --raw .#checks.x86_64-linux.compute-network-policy-runtime.drvPath > \"$RUNNER_TEMP/queue-check.drv\"\n\
        if nix build --accept-flake-config --builders '' --max-jobs 1 --cores 2 --no-link -L --json .#checks.x86_64-linux.compute-network-policy-runtime\
        \ 2>&1 | tee \"$RUNNER_TEMP/queue-normal-nix.log\"; then\n  status=0\nelse\n  status=$?\nfi\nprintf '%s\\\
        n' \"$status\" > \"$RUNNER_TEMP/queue-normal-exit.txt\"\nexit \"$status\"\n"
    - name: Retain exact normal-check diagnostic text only
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: native-queue-stack-${{ github.run_id }}
        path: '${{ runner.temp }}/queue-source-head.txt

          ${{ runner.temp }}/queue-native-storage.txt

          ${{ runner.temp }}/queue-check.drv

          ${{ runner.temp }}/queue-normal-nix.log

          ${{ runner.temp }}/queue-normal-exit.txt'
        if-no-files-found: error
        retention-days: 14
