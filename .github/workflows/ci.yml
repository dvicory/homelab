name: Nix CI

on:
  push:
    branches:
      - main
      - "ci/**"
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: nix-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # One job per (system, ciJobs group).
  #
  # Evaluation has to happen per system: nixidy reads the chart derivation while
  # evaluating, so evaluating a foreign system forces realising charts for a
  # platform the runner cannot build. The previous single evaluate job worked
  # only while no nixidy environment was in ciJobs.
  #
  # `.#ciJobs.<system>.<group>` is an attrset of derivations, so the matrix can
  # be static and needs no evaluation stage or cross-job matrix handoff.
  build:
    name: ${{ matrix.group }} (${{ matrix.system }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        system:
          - x86_64-linux
          - aarch64-linux
          - aarch64-darwin
        group:
          - packages
          - checks
          - devShells
          - formatters
          - nixosConfigurations
          - darwinConfigurations
          - homeConfigurations
        include:
          - system: x86_64-linux
            os: ubuntu-24.04
          - system: aarch64-linux
            os: ubuntu-24.04-arm
          - system: aarch64-darwin
            os: macos-14
    steps:
      - name: Enable KVM for native NixOS tests
        if: matrix.system == 'x86_64-linux' && matrix.group == 'checks'
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm

      - &checkout
        name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # nothing-but-nix's conservative "holster" mode, shared inline because
      # the action invokes mutable srz-zumix/post-run-action@v3 internally.
      - &prepare-nix-storage
        name: Prepare Nix storage
        if: runner.os == 'Linux'
        run: |
          free_space=$(df -m --output=avail /mnt | tail -n 1 | tr -d ' ')
          disk_size=$((free_space - 1024))
          test "$disk_size" -gt 1024
          loop_dev=$(sudo losetup --find)
          sudo fallocate -l "${disk_size}M" /mnt/nix.img
          sudo losetup "$loop_dev" /mnt/nix.img
          sudo mkfs.btrfs -L nix --nodiscard "$loop_dev"
          sudo mkdir -p /nix
          sudo mount "$loop_dev" /nix -o noatime,nobarrier,nodiscard,compress=zstd:1,space_cache=v2,commit=120
          sudo mkdir -p /nix/build

      - &install-nix-linux
        name: Install Nix on Linux
        if: runner.os == 'Linux'
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: build-dir = /nix/build

      - &install-nix-macos
        name: Install Nix on macOS
        if: runner.os == 'macOS'
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - &configure-durable-cache
        name: Configure durable cache (read only)
        if: vars.CACHIX_CACHE != ''
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ vars.CACHIX_CACHE }}
          skipPush: true

      - &start-hestia
        name: Start Hestia cache
        uses: Mic92/hestia@f1f4df2801140a36398ed423533c8460618539df # v3.0.1
        with:
          version: v3.0.1
          upstream-cache-filter: true

      - name: Build
        env:
          SYSTEM: ${{ matrix.system }}
          GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          # `ciJobs.<system>.<group>` is an attrset of derivations, and nix build
          # wants a derivation, so resolve the group to explicit store paths
          # rather than changing the flake output that hestia also consumes.
          attr=".#ciJobs.$SYSTEM.$GROUP"
          derivations=$(nix eval --json "$attr" --apply 'x: map (d: d.drvPath) (builtins.attrValues x)' | jq -r '.[]')
          if [ -z "$derivations" ]; then
            echo "no jobs in $attr"
            exit 0
          fi
          echo "building $(echo "$derivations" | wc -l) job(s) from $attr"
          if [ "$GROUP" = checks ] && [ "$SYSTEM" = x86_64-linux ]; then
            # TEMPORARY: prove whether the test output is already valid
            # before nix build runs (distinguishes pre-seeded store from
            # substitution without log lines).
            mount | grep -c " on /nix " || true
            df -h /nix | tail -1 || true
            ls /nix/store | wc -l || true
            testdrv=$(nix eval --raw ".#checks.$SYSTEM.prod-home-replacement.drvPath")
            echo "test drv: $testdrv"
            testout=$(nix derivation show "$testdrv" | jq -r '.[].outputs.out.path')
            echo "test out: $testout"
            nix path-info "$testout" || echo "TEST OUTPUT NOT VALID BEFORE BUILD"
            ls "$testout" 2>/dev/null || echo "TEST OUTPUT CONTENT MISSING"
          fi
          # shellcheck disable=SC2086
          nix build -L --no-link $derivations

  publish:
    name: Publish ${{ matrix.system }} to Cachix
    needs: build
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.CACHIX_CACHE != '' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    environment: cachix-publish
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            os: ubuntu-24.04
          - system: aarch64-linux
            os: ubuntu-24.04-arm
          - system: aarch64-darwin
            os: macos-14
    steps:
      - name: Monitor publication runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - *checkout

      - *prepare-nix-storage

      - *install-nix-linux

      - *install-nix-macos

      - *configure-durable-cache

      - *start-hestia

      - name: Publish successful projection
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          CACHIX_CACHE: ${{ vars.CACHIX_CACHE }}
          SYSTEM: ${{ matrix.system }}
        run: |
          set -o pipefail
          nix build -L --no-link --print-out-paths ".#ciBundles.$SYSTEM" | cachix push "$CACHIX_CACHE"
