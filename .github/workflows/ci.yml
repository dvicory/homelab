# PRIVATE DISPOSABLE EXPERIMENT: materialize only on an isolated experiment branch.
name: Disposable CI orchestration comparison

on:
  workflow_dispatch:
    inputs:
      arm:
        description: Identical full x86_64-linux hosted runtime inventory, different allocation
        type: choice
        required: true
        options: [matrix, batches]
      pair:
        description: Evidence label, not a source or cache selector
        type: string
        required: true

permissions:
  actions: read
  contents: read

# Do not cancel another observation or contend within a pair.
concurrency:
  group: disposable-ci-orchestration-comparison
  cancel-in-progress: false

env:
  SOURCE_SHA: d6f8e9a7a2912253071d0591a5492f975f23a52c

jobs:
  plan:
    name: Plan complete runtime slice
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
          github_access_token: ${{ github.token }}
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        if: vars.CACHIX_CACHE != ''
        with:
          name: ${{ vars.CACHIX_CACHE }}
          skipPush: true
      - &signed-upstream-cache
        name: Preserve signed upstream cache after Cachix
        run: |
          config_dir="${XDG_CONFIG_HOME:-$HOME/.config}/nix"
          mkdir -p "$config_dir"
          printf '%s\n' \
            'extra-substituters = https://cache.numtide.com' \
            'extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=' \
            >> "$config_dir/nix.conf"
      - name: Partition opaque runtime inventory with Nix
        id: plan
        env:
          ARM: ${{ inputs.arm }}
          PAIR: ${{ inputs.pair }}
          INVENTORY_PATH: ${{ runner.temp }}/orchestration-evidence/inventory.json
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/orchestration-evidence"
          mkdir -p "$e"
          date -u +%s.%N > "$e/plan-start.txt"
          nix eval --json "path:$PWD#hostedCiInventory.x86_64-linux" \
            --apply 'builtins.mapAttrs (_: builtins.map (entry: builtins.removeAttrs entry [ "drvPath" ]))' \
            > "$e/inventory.json"
          nix eval --impure --json \
            --expr '
              let
                inventoryPath = builtins.getEnv "INVENTORY_PATH";
                arm = builtins.getEnv "ARM";
                entries = (builtins.fromJSON (builtins.readFile inventoryPath)).runtime;
                names = builtins.map (entry: entry.name) entries;
                count = builtins.length names;
                slots = if arm == "matrix" then count else if count < 4 then count else 4;
                indices = builtins.genList (i: i) count;
                assigned = slot: builtins.map (i: builtins.elemAt names i)
                  (builtins.filter (i: i - (builtins.div i slots) * slots == slot) indices);
              in
              assert arm == "matrix" || arm == "batches";
              assert count > 0;
              assert builtins.all (entry: entry.hosted && entry.runtime) entries;
              { include = builtins.genList (slot: {
                  id = "runtime-" + builtins.toString slot;
                  names = assigned slot;
                }) slots; }
            ' > "$e/matrix.json"
          date -u +%s.%N > "$e/plan-end.txt"
          jq -n --arg arm "$ARM" --arg pair "$PAIR" --arg source "$SOURCE_SHA" \
            '{arm:$arm,pair:$pair,source:$source}' > "$e/observation.json"
          printf 'matrix=%s\n' "$(jq -c . "$e/matrix.json")" >> "$GITHUB_OUTPUT"
      - name: Save planning evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orchestration-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/orchestration-evidence

  accept:
    name: Runtime allocation ${{ matrix.id }}
    needs: plan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Enable available KVM acceleration
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Prepare Nix storage
        run: |
          free_space=$(df -m --output=avail /mnt | tail -n 1)
          disk_size=$((free_space - 1024))
          test "$disk_size" -gt 1024
          sudo fallocate -l "${disk_size}M" /mnt/nix.img
          loop_dev=$(sudo losetup --find --show /mnt/nix.img)
          sudo mkfs.btrfs -L nix --nodiscard "$loop_dev"
          sudo mkdir -p /nix
          sudo mount "$loop_dev" /nix -o noatime,nobarrier,nodiscard,compress=zstd:1,space_cache=v2,commit=120
          sudo mkdir -p /nix/build
          sudo chattr +C /nix/build
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            build-dir = /nix/build
            sandbox = relaxed
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
          github_access_token: ${{ github.token }}
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        if: vars.CACHIX_CACHE != ''
        with:
          name: ${{ vars.CACHIX_CACHE }}
          skipPush: true
      - *signed-upstream-cache
      - name: Evaluate then accept every assigned exact derivation
        env:
          NAMES: ${{ toJSON(matrix.names) }}
          ARM: ${{ inputs.arm }}
          PAIR: ${{ inputs.pair }}
          ALLOCATION: ${{ matrix.id }}
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/orchestration-evidence"
          mkdir -p "$e"
          jq -n --arg arm "$ARM" --arg pair "$PAIR" --arg source "$SOURCE_SHA" \
            --arg allocation "$ALLOCATION" --argjson names "$NAMES" \
            --arg runner "$RUNNER_NAME" --arg image "${ImageOS:-unknown}" \
            --arg version "${ImageVersion:-unknown}" \
            '{arm:$arm,pair:$pair,source:$source,allocation:$allocation,names:$names,runner:$runner,image:$image,imageVersion:$version}' \
            > "$e/observation.json"
          { uname -a; lscpu; free -b; df -B1 /nix; nix --version; sha256sum flake.lock; } > "$e/runner.txt"
          nix --version > "$e/nix-version.txt"
          # Never upload access-tokens from the full configuration.
          nix config show --json | jq '{substituters, "trusted-public-keys": .["trusted-public-keys"], "max-jobs": .["max-jobs"], cores, "system-features": .["system-features"], builders, sandbox, "always-allow-substitutes": .["always-allow-substitutes"]}' > "$e/nix-config.json"
          date -u +%s.%N > "$e/evaluator-start.txt"
          nix eval --impure --json "path:$PWD#checks.x86_64-linux" \
            --apply 'checks: builtins.map (name: { inherit name; drvPath = (builtins.getAttr name checks).drvPath; }) (builtins.fromJSON (builtins.getEnv "NAMES"))' \
            > "$e/targets.json"
          date -u +%s.%N > "$e/evaluator-end.txt"
          mapfile -t drvs < <(jq -r '.[].drvPath' "$e/targets.json")
          nix derivation show "${drvs[@]}" > "$e/derivations.json"
          installables=()
          for drv in "${drvs[@]}"; do
            installables+=("$drv^*")
          done
          date -u +%s.%N > "$e/acceptance-start.txt"
          set +e
          # Unchanged production drvs/flags/cache policy. Cached roots are not assertion timings.
          python3 - "$e" "${installables[@]}" <<'PY'
          import json, pathlib, subprocess, sys, time
          evidence = pathlib.Path(sys.argv[1])
          targets = {entry["drvPath"] for entry in json.loads((evidence / "targets.json").read_text())}
          derivations = json.loads((evidence / "derivations.json").read_text())
          derivations = derivations.get("derivations", derivations)
          derivations = {"/nix/store/" + key.removeprefix("/nix/store/"): value for key, value in derivations.items()}
          outputs = {"/nix/store/" + output["path"].removeprefix("/nix/store/") for drv in targets for output in derivations[drv]["outputs"].values()}
          validity = {}
          for path in sorted(outputs):
              query = subprocess.run(["nix-store", "--check-validity", path], capture_output=True, text=True)
              validity[path] = {"status": query.returncode, "stderr": query.stderr}
          (evidence / "pre-build-validity.json").write_text(json.dumps(validity))
          command = ["nix", "build", "-L", "--log-format", "internal-json",
                     "--out-link", str(evidence / "result"), "--json",
                     "--keep-going", "--fallback", "--max-jobs", "1", *sys.argv[2:]]
          (evidence / "build-command.json").write_text(json.dumps(command))
          activities = {}
          with (evidence / "build.json").open("w") as output, \
               (evidence / "build-events.jsonl").open("w") as events:
              started = time.monotonic()
              process = subprocess.Popen(command, stdout=output, stderr=subprocess.PIPE, text=True)
              for line in process.stderr:
                  try:
                      event = json.loads(line.removeprefix("@nix "))
                  except ValueError:
                      event = {"raw": line}
                  events.write(json.dumps({"receivedAt": time.time(), "receivedMonotonic": time.monotonic(), "event": event}) + "\n")
                  events.flush()
                  fields = event.get("fields", [])
                  if event.get("action") == "start" and event.get("type") == 105 and fields and fields[0] in targets:
                      activities[event["id"]] = fields[0]
                  elif event.get("action") == "result" and event.get("type") == 101 and event.get("id") in activities and fields:
                      # Only this invocation's root log lines; never fetch an old cache log.
                      with (evidence / (pathlib.Path(activities[event["id"]]).name + ".log")).open("a") as log:
                          log.write(fields[0] + "\n")
                  elif event.get("action") == "stop":
                      activities.pop(event.get("id"), None)
              status = process.wait()
              (evidence / "build-invocation-seconds.txt").write_text(str(time.monotonic() - started))
              sys.exit(status)
          PY
          status=$?
          set -e
          date -u +%s.%N > "$e/acceptance-end.txt"
          printf '%s\n' "$status" > "$e/exit-status.txt"
          exit "$status"
      - name: Save identities, actual acceptance logs, outputs and timing
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orchestration-${{ matrix.id }}-${{ github.run_id }}
          path: ${{ runner.temp }}/orchestration-evidence
