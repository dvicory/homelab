name: Probe Test
# TEMPORARY diagnostic: isolate why the replacement acceptance sometimes
# completes without executing. Two jobs, same commit, no Hestia, no Cachix,
# plain store. Deletes after the mechanism is proven.
on:
  workflow_dispatch:
  push:
    branches:
      - "ci/prod-home-acceptance"
jobs:
  attrpath:
    name: attrpath build (no Hestia)
    runs-on: ubuntu-24.04
    steps:
      - name: Enable KVM for native NixOS tests
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix on Linux
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Build test by attrpath
        run: |
          set -euo pipefail
          df -h /nix | tail -1 || true
          ls /nix/store | wc -l || true
          nix eval --raw '.#checks.x86_64-linux.prod-home-replacement.drvPath'
          nix build -L --no-link --print-out-paths '.#checks.x86_64-linux.prod-home-replacement'
  groupdrvs:
    name: group drvs build (no Hestia)
    runs-on: ubuntu-24.04
    steps:
      - name: Enable KVM for native NixOS tests
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix on Linux
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Build test via group evaluation
        run: |
          set -euo pipefail
          df -h /nix | tail -1 || true
          ls /nix/store | wc -l || true
          derivations=$(nix eval --json '.#ciJobs.x86_64-linux.checks' --apply 'x: map (d: d.drvPath) (builtins.attrValues x)' | jq -r '.[]')
          echo "$derivations" | grep 'prod-home-replacement' || echo "TEST DRV MISSING FROM GROUP"
          testdrv=$(echo "$derivations" | grep 'prod-home-replacement' || true)
          if [ -n "$testdrv" ]; then
            nix build -L --no-link --print-out-paths "$testdrv"
          else
            echo "refusing to build an empty set"
            exit 1
          fi
